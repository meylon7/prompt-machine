eg":105,"elevation_deg":25,"distance_cm":70,"power_stops_rel_key":-1,"size_cm":140,"grid_deg":40},{"role":"background","modifier":"snoot","azimuth_deg":175,"elevation_deg":45,"distance_cm":120,"power_stops_rel_key":-1.5},{"role":"negative_fill","modifier":"negative_fill_black","azimuth_deg":0,"elevation_deg":20,"distance_cm":60,"power_stops_rel_key":0}]}},"materials":{"_doc":"Each material expands into three facts: surface micro structure, how it takes light, and its imperfection. Three facts beat ten adjectives. Keep each expansion under about twenty words so several materials can stack in one prompt.","_groups":{"human":["skin_face","skin_hands","skin_aged","skin_child","skin_freckled","skin_deep_tone","skin_sweaty","human_hair","beard_stubble","lips_natural","eye_iris","fingernails"],"animal":["fur_short","fur_long","fur_wet","horse_coat","feather","feather_flight","scales_fish","reptile_skin","insect_carapace","barnacle_crust"],"plant":["cut_flower_petal","leafy_herb","grass_blades","fern_frond","moss","tree_bark","dry_leaf"],"food":["pear_skin","apple_skin","citrus_peel","fresh_berries","crusty_bread","cured_meat","grilled_char","raw_fish","cheese_aged","egg_yolk","melting_butter","dark_chocolate","whipped_cream","honey_pour","coffee_crema","ice_cubes"],"textile":["linen_cloth","cotton_poplin_shirt","canvas_duck","denim","tweed","corduroy","knit_wool","felt_wool","velvet","raw_silk_noil","silk_charmeuse","satin_ribbon","tulle_mesh","lace_cotton","sequin_fabric","nylon_technical","leather_full_grain","leather_suede"],"wood":["raw_wood_table","polished_walnut","painted_wood_chipped","plywood_edge","driftwood","burnt_wood"],"surface":["matte_paper_backdrop","kraft_paper","newsprint","plaster_wall","painted_wall_matte","wallpaper_faded","concrete_board_formed","brick_weathered","terracotta_tile","cork"],"stone":["polished_marble","granite_flamed","slate_split","sandstone","wet_stone","river_pebbles"],"glass":["clear_drinking_glass","aged_glass_bottle","frosted_glass","crystal_cut","mirror_glass","plexiglass_scratched"],"ceramic":["glazed_ceramic","unglazed_stoneware","porcelain_thin","raku_crackle"],"metal":["stainless_steel_mirror","chrome_plated","brushed_metal","brushed_aluminium","anodised_black","powder_coated","copper_hammered","brass_polished","gold_leaf","tarnished_silver","cast_iron","rusted_steel"],"synthetic":["matte_abs_plastic","glossy_plastic","silicone_rubber","rubber_tyre","carbon_fibre","vinyl_record"],"liquid":["still_water","water_droplets","wet_asphalt","oil_slick","soap_foam","snow_fresh","frost","steam_wisp","dust_motes"]},"skin_face":{"micro":"visible pores enlarged around the nose, fine vellus hair catching the rim light, uneven pigment","light":"subsurface scattering warming the ear rims and nostrils, oily specular only on the nose bridge and forehead","flaw":"one small mole, faint capillaries near the nostril, slight asymmetry between the eyes"},"skin_hands":{"micro":"knuckle creases, dry cuticles, tendon relief under the skin","light":"diffuse with a matte finish, speculars only on the knuckles","flaw":"a healed nick, uneven nail edges"},"skin_aged":{"micro":"deep set expression lines, enlarged pores in the cheek zone, crepe texture at the neck and hands","light":"less subsurface warmth than young skin, the specular drier and sitting only on the raised lines","flaw":"sun spots, broken capillaries, uneven pigment across the temple"},"skin_child":{"micro":"smooth fine grain, almost no visible pores, downy hair along the jaw and temple","light":"strong subsurface scattering, ears and fingers glowing where light passes through","flaw":"a scratch on one cheek, a faint dry patch at the mouth corner"},"skin_freckled":{"micro":"dense freckles clustered over the nose and cheekbones, thinning toward the jaw","light":"pigment reads darker in the diffuse areas and almost disappears inside the specular","flaw":"one freckle larger than the rest, sunburn peeling on the nose bridge"},"skin_deep_tone":{"micro":"tight pore structure, an even sheen along the cheekbone and brow","light":"highlights carry colour rather than going white, specular rolling broadly across the forehead","flaw":"a healed scar in lighter pigment, dry skin at the knuckles"},"skin_sweaty":{"micro":"beaded moisture sitting on top of the pores rather than soaking in","light":"hundreds of tiny hard speculars over a broad sheen, each bead holding its own highlight","flaw":"hair stuck to the temple, a damp line at the collar"},"human_hair":{"micro":"individual strands breaking the silhouette, flyaways, visible parting scalp","light":"anisotropic sheen band curving with the head, not a flat highlight","flaw":"split ends, uneven strand grouping"},"beard_stubble":{"micro":"three day growth, individual hairs breaking the skin line unevenly","light":"catches rim light as a soft halo and blocks the subsurface glow underneath","flaw":"a bare patch along one jaw line, grey hairs mixed in"},"lips_natural":{"micro":"fine vertical creases across the surface, drier toward the outer edge","light":"one low broad specular in the centre of the lower lip and nowhere else","flaw":"a small split in the lower lip, uneven colour at the border"},"eye_iris":{"micro":"fibrous radial structure with a darker limbal ring, the pupil edge slightly irregular","light":"the modifier's shape reproduced sharply as a catchlight, the wet film adding a second smaller one","flaw":"a red vessel in the white, lashes casting a thin shadow across the upper iris"},"fingernails":{"micro":"vertical ridges running to the tip, cuticle skin lifting at one corner","light":"a narrow specular that travels along the curve of the nail","flaw":"one chipped edge, a white mark from an old knock"},"fur_short":{"micro":"directional hair flow with cowlicks, guide hairs longer than the undercoat","light":"rim light separates single hairs at the silhouette, diffuse elsewhere","flaw":"matted patch, dust in the coat"},"fur_long":{"micro":"layered guard hairs over dense undercoat, direction changing across the body","light":"rim light passing through the outer layer and glowing before it reaches skin","flaw":"a matted section behind the ear, a burr caught near the flank"},"fur_wet":{"micro":"hair clumped into spikes with the body shape visible through it","light":"a specular along every clump, the whole coat several stops darker than the same fur dry","flaw":"a drip forming at the lowest point, mud at the leg"},"horse_coat":{"micro":"short hair lying in whorls, direction shifting over the muscle","light":"sheen following the hair direction, brightest where the coat lies flat","flaw":"a scar on the shoulder, dust held in the coat"},"feather":{"micro":"barbs zipping into a continuous vane with gaps where they have separated","light":"a sheen running along the barb direction, translucent at the trailing edge when backlit","flaw":"a broken barb, a bent shaft, down clinging at the base"},"feather_flight":{"micro":"interlocking barbs with a visible gap where they have separated","light":"an iridescent shift along the vane as the angle changes","flaw":"one barb out of alignment, a worn tip"},"scales_fish":{"micro":"overlapping plates, each carrying a fine growth ring","light":"wet iridescence changing hue across the body, hard speculars on the raised edges","flaw":"two scales missing, a scuff along the flank"},"reptile_skin":{"micro":"beaded scutes of uneven size with deep creases at the joints","light":"dry and matte, sharp small speculars only on the raised beads","flaw":"shedding skin lifting at the neck, a healed tear"},"insect_carapace":{"micro":"segmented chitin plates with fine punctures across the surface","light":"hard mirror specular on the domed sections, deep shadow in the seams","flaw":"a chipped edge on one wing case, pollen caught in the joints"},"barnacle_crust":{"micro":"calcified conical shells clustered irregularly, sand grains bonded into the crust","light":"chalky diffuse, tiny occlusion shadows inside every shell mouth","flaw":"broken shells, uneven coverage denser on one side"},"cut_flower_petal":{"micro":"fine vein tracery, a slightly cupped surface, a papery edge","light":"translucent enough that the veins read dark against a bright ground when lit from behind","flaw":"a browning bruise where it was handled, one petal curling before the others"},"leafy_herb":{"micro":"visible vein structure, slight cupping, fine hairs on the leaf underside","light":"waxy semi matte on top, translucent when backlit so the veins read as dark lines","flaw":"a bruised leaf darkening at the edge, a torn stem, one leaf already wilting"},"grass_blades":{"micro":"individual blades crossing at different angles, each folded along its centre rib","light":"every blade catching a thin specular line, backlight turning them yellow green","flaw":"brown tips, a bent blade that did not recover"},"fern_frond":{"micro":"regular paired leaflets narrowing toward the tip, edges finely toothed","light":"backlight showing the vein structure straight through the leaf","flaw":"one leaflet browned at the tip, a curl that never opened"},"moss":{"micro":"thousands of upright shoots reading as one soft mass at this distance","light":"light dying inside the layer rather than reflecting, only the top millimetre lit","flaw":"a dry brown patch, a twig pressed into the surface"},"tree_bark":{"micro":"deep vertical fissures with lichen sitting in the shaded cracks","light":"raking light exaggerating the ridge shadows, no specular at all","flaw":"a healed wound where a branch was lost, insect holes"},"dry_leaf":{"micro":"brittle veins standing proud of a curled blade","light":"translucent between the veins when backlit, fully opaque from the front","flaw":"a torn edge, a hole eaten through near the stem"},"pear_skin":{"micro":"lenticel speckles, a green to yellow gradient, russet patch near the stem","light":"waxy semi matte, one soft elongated specular following the curve","flaw":"a bruise going soft, a dried stem with a broken tip"},"apple_skin":{"micro":"waxy bloom, pale speckles over red, striated color transition","light":"sharp small specular from the key plus a dimmer second from the bounce","flaw":"a stem scar, one shallow dent"},"citrus_peel":{"micro":"oil gland pitting across the whole surface, a raised navel scar, pith visible at a cut","light":"semi gloss with the specular broken into small pits, a fine oil mist when the peel is bent","flaw":"a scuff going brown, uneven colouring on the shaded side of the fruit"},"fresh_berries":{"micro":"a matte bloom over the skin, tiny drupelets each catching light separately","light":"the bloom scattering the highlight into a soft patch rather than a point","flaw":"one berry pressed flat, a torn skin leaking"},"crusty_bread":{"micro":"blistered crust with a scored ear, open irregular crumb of varying cell size","light":"warm specular on the crust blisters, the crumb entirely diffuse and holding deep occlusion in every cell","flaw":"a burnt spot at the ear, flour dusting unevenly, a torn edge where it was pulled not cut"},"cured_meat":{"micro":"marbled fat in irregular seams against dense muscle, a dry rim at the cut edge","light":"the fat translucent and slightly glowing, the lean matte, the cut face wetter than the sides","flaw":"a ragged slice edge, a darkened dry edge where it has been exposed"},"grilled_char":{"micro":"black grill marks over a browned surface, charred edges crumbling","light":"matte inside the char, glossy where fat has rendered onto it","flaw":"one mark darker than the rest, a split where the meat contracted"},"raw_fish":{"micro":"translucent muscle bands separated by thin silver membrane","light":"a wet surface with broad soft speculars, colour deepening where the flesh is thickest","flaw":"a bruise mark in the flesh, a loose fibre at the cut"},"cheese_aged":{"micro":"crystalline crumb structure with a dry rind at the edge","light":"light dying immediately in the paste, only the cut face slightly wet","flaw":"a crack running in from the rind, a darker line where it has dried"},"egg_yolk":{"micro":"a smooth membrane holding a dome, faint mottling under the surface","light":"one bright specular on the crown, deep saturated colour by transmission","flaw":"a wrinkle where the membrane has slackened"},"melting_butter":{"micro":"a knife drawn surface holding its ridges, a melted rim pooling outward","light":"the solid diffuse and slightly translucent, the melted rim carrying a bright liquid specular","flaw":"an uneven cut, crumbs stuck in the surface, the pool spreading asymmetrically"},"dark_chocolate":{"micro":"a tempered sheen with a clean snapped fracture showing a matte fine grain interior","light":"glossy on the moulded faces, entirely matte on the break","flaw":"bloom greying one corner, a fingerprint melted into the surface"},"whipped_cream":{"micro":"soft peaks holding their shape over a fine air structure","light":"almost pure subsurface, no hard specular anywhere, shadows staying bright","flaw":"a peak that has slumped, a smear at the base"},"honey_pour":{"micro":"a continuous thread thinning as it falls and coiling where it lands","light":"transmitting deep amber and throwing a bright caustic onto the surface","flaw":"a bubble trapped in the stream, a stray drip on the rim"},"coffee_crema":{"micro":"fine tan foam with bubbles of mixed size collapsing slowly","light":"matte with almost no specular, dark liquid showing wherever it has broken","flaw":"a gap in the crema at one edge, a stain running down the cup"},"ice_cubes":{"micro":"internal fracture planes and trapped air bubbles in the core","light":"refraction bending everything behind them and throwing caustics onto the surface below","flaw":"a melted rounded corner, a wet ring where it sits"},"linen_cloth":{"micro":"irregular slub weave, individual threads visible along fold ridges, frayed selvage","light":"matte diffuse with sheen only where the weave lies flat toward the source","flaw":"permanent creases, a faint stain, a loose thread"},"cotton_poplin_shirt":{"micro":"tight plain weave, a pressed edge on the placket, stitch dimples at the seams","light":"matte, with sheen only where the press has flattened the weave","flaw":"a crease behind the elbow that will not press out, a thread end at a buttonhole"},"canvas_duck":{"micro":"heavy plain weave with individual yarns visible, stiff at the fold","light":"matte with a faint sheen along the raised yarns","flaw":"a worn corner showing lighter fibre, a paint fleck"},"denim":{"micro":"twill diagonal, indigo warp over undyed weft so the weave reads as a two tone diagonal","light":"matte, with a slight sheen on the raised twill ridges only","flaw":"whiskering at the hip, fray at the hem, a lighter wear patch at the seat"},"tweed":{"micro":"flecked yarn in several colours with a visible twill diagonal","light":"matte, the flecks reading as colour noise rather than as texture","flaw":"a pulled thread, a shine at the elbow"},"corduroy":{"micro":"parallel raised wales with cut pile between them","light":"the wales catching light in bands while the valleys stay dark","flaw":"flattened pile at the knee, a wale worn through"},"knit_wool":{"micro":"individual stitch loops, halo of loose fibers at the edges","light":"very diffuse, light penetrates the fiber halo and glows at rim lit edges","flaw":"pilling at friction points, one pulled loop"},"felt_wool":{"micro":"compressed fibre with no weave at all, fuzz standing at the cut edge","light":"completely matte, shadow edges softened by the surface fuzz","flaw":"a pilled area, a crease pressed in"},"velvet":{"micro":"dense cut pile standing perpendicular to the backing, direction visible as a nap","light":"inverse behaviour, darkest where it faces the source and brightest at grazing angles, near black in the folds","flaw":"crushed pile where something rested, a shiny bald patch at a wear point"},"raw_silk_noil":{"micro":"irregular slubs through the weave, matte with visible short fibre ends","light":"diffuse with a faint dry sheen and no specular of its own","flaw":"a slub thick enough to distort the weave, a snag"},"silk_charmeuse":{"micro":"continuous filament with no weave visible at normal distance, fluid drape in long folds","light":"anisotropic sheen travelling along the fold as the surface turns, near white at the fold crest","flaw":"a pulled thread, a crease set by folding, water spotting"},"satin_ribbon":{"micro":"a smooth float weave with a hard fold line","light":"a long specular running the length of the fold, dull on the reverse","flaw":"a frayed cut end, a permanent crease"},"tulle_mesh":{"micro":"a regular hexagonal net, layers moiring where they cross","light":"almost fully transmitting, every thread catching a tiny hard specular","flaw":"a snagged thread, a fold that has not fallen out"},"lace_cotton":{"micro":"an open worked pattern with a denser corded outline","light":"transmitting between the threads and casting a patterned shadow","flaw":"a broken thread at one motif, a yellowed area"},"sequin_fabric":{"micro":"overlapping discs, each free to tilt slightly","light":"hundreds of independent hard speculars, the pattern shifting with any movement","flaw":"a missing sequin showing the backing thread"},"nylon_technical":{"micro":"a tight ripstop grid with a slight sheen from the coating","light":"sharp small speculars along the folds, crisp shadow edges","flaw":"a scuff mark, a crease that holds"},"leather_full_grain":{"micro":"natural pore pattern and hair follicle marks, grain tightening toward the edges","light":"low soft specular that broadens where handling has burnished the surface","flaw":"a scar from the animal, a crease that has set permanently, darkening where hands hold it"},"leather_suede":{"micro":"a raised nap that changes tone with the direction it is brushed","light":"no specular at all, only a velvet like falloff and a bright edge where the nap lifts","flaw":"a darker mark where it has been rubbed, a stain that will not lift"},"raw_wood_table":{"micro":"open grain, saw marks, filled nail holes, end grain darker than face grain","light":"matte with a low waxy sheen that follows the grain direction","flaw":"ring stains, a split running with the grain, dust in the grooves"},"polished_walnut":{"micro":"close figured grain, filled and levelled to a flat surface","light":"a deep reflection with the grain showing through it and a soft travelling highlight","flaw":"a repaired knot, a ring mark left by a glass"},"painted_wood_chipped":{"micro":"brush direction visible in the paint film, build up at the corners, grain telegraphing through","light":"the paint holding a soft even sheen while the exposed wood beneath stays dry and matte","flaw":"chips exposing an older colour underneath, a run that dried mid drip"},"plywood_edge":{"micro":"glued layers of alternating grain with voids visible in the core","light":"the end grain drinking light and reading darker than the face","flaw":"a splinter lifting, a chipped veneer corner"},"driftwood":{"micro":"grain eroded into ridges, the ends worn round","light":"silver grey and completely matte, the ridges catching a faint edge light","flaw":"a bore hole, a crack running along the grain"},"burnt_wood":{"micro":"a carbonised alligator pattern with unburnt wood down in the cracks","light":"the char absorbing almost everything, the cracks brighter than the surface","flaw":"a flake fallen away, ash residue"},"matte_paper_backdrop":{"micro":"paper tooth, roll curl at the edges, seam where it meets the table","light":"even diffuse falloff, no specular at all","flaw":"scuffs, a crease, dust along the bottom edge"},"kraft_paper":{"micro":"long visible fibres and a slight tooth, a fold line breaking the surface","light":"matte, with a faint sheen only at the fold","flaw":"a crease that will not flatten, a torn edge"},"newsprint":{"micro":"coarse fibre with visible halftone dots inside the printed area","light":"very matte, the ink marginally less matte than the paper","flaw":"a yellowed edge, a wear line along the fold"},"plaster_wall":{"micro":"trowel arcs across a slightly uneven plane, fine aggregate visible at grazing light","light":"the trowel arcs appear only when the light rakes across them and vanish under frontal light","flaw":"a hairline settlement crack, a filled and sanded patch that takes light differently"},"painted_wall_matte":{"micro":"roller stipple visible in raking light, a slight orange peel","light":"no specular anywhere, the stipple readable only at a grazing angle","flaw":"a filled nail hole not quite level, a scuff at hand height"},"wallpaper_faded":{"micro":"a printed pattern with the paper texture showing through it","light":"matte, the colours lighter where light has reached them for years","flaw":"a lifting seam, a darker rectangle where a frame hung"},"concrete_board_formed":{"micro":"board impressions with wood grain transferred into the surface, tie holes, aggregate showing at chips","light":"fully diffuse, every board seam catching a hard shadow line","flaw":"efflorescence bleeding white from a crack, a rust stain from a tie, a cold joint"},"brick_weathered":{"micro":"irregular faces with the mortar recessed between them, pitting on the exposed side","light":"raking light exaggerating the mortar shadows, no specular anywhere","flaw":"a salt bloom of efflorescence, a chipped corner"},"terracotta_tile":{"micro":"a porous unglazed body carrying a slight surface dust","light":"matte with a warm bounce, edges lighter where they have worn","flaw":"a chip at one corner, a mortar smear"},"cork":{"micro":"compressed granules of mixed size with visible boundaries between them","light":"matte, the granule edges catching a faint line","flaw":"a granule pulled out leaving a pit"},"polished_marble":{"micro":"veining running through the body rather than sitting on the surface, filled fissures","light":"specular reflection plus a shallow subsurface glow that softens the edge of every shadow cast on it","flaw":"an etch mark where something acidic sat, a chip at the edge, a dull patch where the polish has worn"},"granite_flamed":{"micro":"crystalline grains of quartz and feldspar, the surface roughened by heat","light":"no coherent reflection, each crystal catching light on its own facet","flaw":"a chip at the edge, a darker patch where it has stayed damp"},"slate_split":{"micro":"cleaved layers leaving a naturally uneven face","light":"dark and low in reflectance, wet areas jumping several stops brighter","flaw":"a flake lifting at the corner, a rust coloured vein"},"sandstone":{"micro":"a granular surface with visible bedding lines","light":"matte, the grain producing a fine soft texture in raking light","flaw":"an erosion hollow, a lichen patch"},"wet_stone":{"micro":"mineral grain visible through a water film that pools in the low points","light":"the wet areas gain a mirror specular while the dry areas stay matte, and the boundary between them is sharp","flaw":"a drying edge where the film is retreating, a dust line left by an earlier waterline"},"river_pebbles":{"micro":"rounded stones of mixed size, each with its own mineral pattern","light":"the wet ones reading much darker with a hard specular, the dry ones matte","flaw":"one cracked stone, sand caught between them"},"clear_drinking_glass":{"micro":"thin even wall, slight optical distortion in the base, a faint mould ring","light":"refracts a bright caustic onto the surface below, edges read as dark lines where total internal reflection occurs","flaw":"a water spot, a lip print, a bubble in the stem"},"aged_glass_bottle":{"micro":"mold seam running the full height, embossed lettering with softened edges, bubbles in the glass","light":"refraction through the thick base, a bright caustic pooled on the table, transmitted color deepening at the shoulders","flaw":"chipped lip, iridescent patina film, mineral crust"},"frosted_glass":{"micro":"acid etched surface with even micro pitting and no directional grain","light":"transmits diffusely, glows rather than refracts, casts no caustic","flaw":"a fingerprint reading darker than the surrounding frost because oil fills the pits"},"crystal_cut":{"micro":"sharp facets meeting at defined edges","light":"splitting light into caustics and throwing coloured fringes at the edges","flaw":"a chipped facet, a fingerprint on one face"},"mirror_glass":{"micro":"perfectly flat with a faint surface dust","light":"reflecting the set rather than being lit, doubling every source in the frame","flaw":"a scratch, a desilvered spot at one edge"},"plexiglass_scratched":{"micro":"a haze of fine directional scratches over a clear body","light":"the scratches turning every specular into a streak","flaw":"a deeper gouge, a yellowed edge"},"glazed_ceramic":{"micro":"glaze pooling thicker in the recesses, crazing lines in the surface, unglazed foot ring","light":"a hard bright specular sitting on top of a softer subsurface glow from the body beneath","flaw":"a chip showing raw clay, a crazing line stained by use, a kiln stilt mark"},"unglazed_stoneware":{"micro":"open clay body with visible grog particles, throwing rings from the wheel","light":"fully diffuse, holds a shadow in every throwing ring","flaw":"a firing crack, iron speckles bled through, a dry chalky patch"},"porcelain_thin":{"micro":"a smooth vitrified surface, the rim translucent where it thins","light":"light passing through the rim, a clean hard specular on the glaze","flaw":"a firing speck under the glaze, a slight warp"},"raku_crackle":{"micro":"a crazed network of fine cracks stained darker by smoke","light":"a glossy glaze with the crack lines reading as dark hairlines","flaw":"an unglazed patch, a thumb mark left from the making"},"stainless_steel_mirror":{"micro":"near optically flat, faint polishing haze visible only at grazing angles","light":"true mirror, returns a readable image of the modifier and of everything around it","flaw":"fingerprints, a hairline scratch catching the key, dust reading as dark specks"},"chrome_plated":{"micro":"a flawless plated surface with a faint orange peel from the substrate","light":"a full mirror: the frame reads as reflections of the sources and of nothing else","flaw":"a pit where the plating has failed, a wipe mark"},"brushed_metal":{"micro":"unidirectional brush lines, anisotropic reflection stretched along them","light":"elongated smeared specular perpendicular to the brush direction","flaw":"handling marks, dulling around the edges"},"brushed_aluminium":{"micro":"fine unidirectional grain, anodised surface with a slightly powdery matte tone","light":"the reflection stretches perpendicular to the grain into a long soft band","flaw":"a scuff crossing the grain direction, dulling at the handled edges"},"anodised_black":{"micro":"a fine bead blasted texture under a dyed layer","light":"a soft broad specular rather than a mirror, staying dark at every angle","flaw":"a bright scratch showing raw aluminium, an uneven dye patch"},"powder_coated":{"micro":"an even matte coating that slightly softens every edge it covers","light":"a low wide specular with no sharpness in it at all","flaw":"a chip at a corner showing metal, an orange peel run"},"copper_hammered":{"micro":"planished hammer facets in an irregular overlapping pattern, each facet on a slightly different plane","light":"warm orange specular broken into one small highlight per facet rather than one continuous reflection","flaw":"verdigris starting in the crevices, a dented facet, etched fingerprint where a hand held it"},"brass_polished":{"micro":"fine rotary polishing swirl, cast seam at the joins, threading at the fittings","light":"mirror specular with a yellow green cast, returns the set distorted by the curvature","flaw":"tarnish blooming near the solder joint, lacquer worn through at the contact points"},"gold_leaf":{"micro":"wrinkled foil following the surface beneath, joins visible between sheets","light":"a warm reflection that changes brightness across every wrinkle","flaw":"a tear showing the ground underneath, a fingerprint"},"tarnished_silver":{"micro":"fine circular polishing scratches, engraved rim, dark tarnish in the recesses","light":"mirror specular carrying a distorted reflection of the light source and the objects around it","flaw":"dents on the rim, fingerprints in the tarnish"},"cast_iron":{"micro":"sand cast pebbling, mould parting line, seasoned surface carrying a matte carbon layer","light":"almost no specular, a dull sheen only on the wear paths that use has burnished","flaw":"rust freckles at a chip, grey ash residue in the pitting"},"rusted_steel":{"micro":"layered flaking oxide over pitting, edges lifting where flakes are about to shed","light":"no coherent specular, the surface reads entirely as texture and colour variation","flaw":"a run stain below the rust where water carried it, bright metal at a fresh scratch"},"matte_abs_plastic":{"micro":"a fine moulded grain with a parting line running around the form","light":"a broad soft specular and no depth to the reflection","flaw":"a sink mark opposite an internal rib, a scuff on the edge"},"glossy_plastic":{"micro":"a high polish moulded surface with a gate mark near the base","light":"a sharp specular plus a visible second reflection from below the surface","flaw":"a fine scratch, dust clinging electrostatically"},"silicone_rubber":{"micro":"a soft matte surface that dust sticks to","light":"noticeable subsurface making the shadows warmer than expected","flaw":"a mould flash line, a permanent indentation"},"rubber_tyre":{"micro":"moulded tread blocks with fine sipes and casting numbers in relief","light":"very dark and matte, only the block edges catching light","flaw":"a stone lodged in the tread, wear on one shoulder"},"carbon_fibre":{"micro":"a woven tow pattern under clear resin","light":"the weave direction changing the reflection under a deep gloss","flaw":"a resin rich area, a swirl in the clear coat"},"vinyl_record":{"micro":"concentric groove lines dense enough to diffract","light":"throwing a rainbow sheen across the reflection of any source","flaw":"a fingerprint, dust in the run out groove"},"still_water":{"micro":"an unbroken surface with the faintest movement at the edge","light":"reflecting the sky at grazing angles and showing the bottom at steep ones","flaw":"a floating leaf, a ring where something touched it"},"water_droplets":{"micro":"beads of mixed size, the larger ones flattened by their own weight","light":"each acting as a lens: one hard specular and an inverted image inside","flaw":"two drops that have merged, a dry patch where one has run"},"wet_asphalt":{"micro":"aggregate showing through worn binder, a fine crack network across it","light":"reflections of every source stretched along the direction of the surface","flaw":"an oil stain, a pothole repair with a different texture"},"oil_slick":{"micro":"an unbroken film thinning to nothing at the edge","light":"interference colours banding where the film is thinnest","flaw":"a dust particle trapped in it, a break where it was disturbed"},"soap_foam":{"micro":"bubbles of mixed size collapsing at different rates","light":"each bubble a tiny lens with an interference sheen on its film","flaw":"a collapsed area, a wet mark where it has drained"},"snow_fresh":{"micro":"individual crystal facets in the undisturbed top layer","light":"bright subsurface scattering, shadows going blue from the sky","flaw":"a footprint, a compressed edge that has started to ice"},"frost":{"micro":"needle crystals growing out from nucleation points, denser at the edges","light":"every needle catching a tiny hard specular, the whole surface reading as sparkle","flaw":"a melted patch where a finger touched it"},"steam_wisp":{"micro":"a thinning column losing definition as it rises","light":"backlight making it visible, front light making it disappear","flaw":"a break in the column where the air moved"},"dust_motes":{"micro":"individual particles suspended, some in the focus plane and most not","light":"visible only inside a beam and invisible everywhere else","flaw":"an uneven density where the air has been moved"}},"modifiers":{"_doc":"Every modifier is described by what it DOES to pixels, not by its brand name. The compiler emits these physical consequences, because models respond to consequences far better than to gear names. A field with an _object twin is one whose plain wording names a face. The twin is used when the genre has no face in it, because a still life prompt that talks about eye sockets and a chin is telling the model there is a person in the frame.","octabox_150":{"label":"150cm octabox","quality":"soft directional","catchlight":"large rounded octagonal catchlight, slightly flattened at the edges","shadow_edge":"wide gradual penumbra, roughly two finger widths at subject scale","falloff":"gentle wrap around the cheek and jaw","falloff_object":"gentle wrap around a curved surface, no hard edge anywhere","specular":"broad soft specular sheen on any curved or glossy surface"},"softbox_60x90":{"label":"60x90cm softbox","quality":"soft rectangular","catchlight":"vertical rectangular catchlight with visible corners","shadow_edge":"soft but defined, penumbra about one finger width","falloff":"faster than a broader source, visible shading across the subject","specular":"rectangular specular strip on curved glossy surfaces"},"stripbox_30x140":{"label":"30x140cm strip","quality":"narrow soft","catchlight":"tall thin rectangular catchlight","shadow_edge":"soft along the long axis, crisper across it","falloff":"strong lateral falloff, light dies within a hand span","specular":"long thin highlight running down any vertical edge"},"beauty_dish_70_grid":{"label":"70cm beauty dish with 30 degree grid","quality":"crisp contrasty","catchlight":"round catchlight with a small dark center from the deflector","shadow_edge":"tight penumbra, the shadow shape stays clearly readable","falloff":"rapid, background goes dark unless separately lit","specular":"punchy speculars on raised edges and metal"},"reflector_grid":{"label":"standard reflector with honeycomb grid","quality":"hard and contained","catchlight":"small bright round catchlight","shadow_edge":"hard shadow with a thin penumbra","falloff":"very rapid, a controlled pool of light with a soft edged circle","specular":"small intense speculars"},"snoot":{"label":"snoot","quality":"hard spot","catchlight":"tiny hard catchlight","shadow_edge":"hard edged shadow","falloff":"narrow cone, everything outside it falls to shadow","specular":"pinpoint speculars"},"bare_bulb":{"label":"bare flash tube","quality":"hard omnidirectional","catchlight":"small hard point catchlight","shadow_edge":"hard edged shadow with almost no penumbra","falloff":"inverse square, strong","specular":"harsh pinpoint speculars, visible texture relief"},"scrim_2x1m":{"label":"2x1m diffusion scrim","quality":"very soft wide","catchlight":"large soft rectangular catchlight, low contrast","shadow_edge":"very wide penumbra, shadows almost dissolve","falloff":"slow and even","specular":"wide low intensity sheen"},"window_north":{"label":"north facing window","quality":"soft daylight","catchlight":"rectangular catchlight with a faint frame division","shadow_edge":"soft, direction constant across the frame","falloff":"clear gradient away from the window, inverse square across a table","specular":"cool toned soft sheen"},"bounce_v_flat_white":{"label":"white v flat bounce","quality":"soft fill without its own catchlight","catchlight":"no distinct catchlight, only a faint lift in shadow side","shadow_edge":"none of its own","falloff":"very slow","specular":"raises shadow detail, keeps texture"},"negative_fill_black":{"label":"black flag negative fill","quality":"subtractive","catchlight":"removes ambient reflection from the shadow side","shadow_edge":"deepens and sharpens the shadow side","falloff":"increases apparent contrast ratio by one to two stops","specular":"kills unwanted sheen on the shadow side"},"ring_light_45":{"label":"45cm ring light on axis","quality":"flat shadowless on axis","catchlight":"a complete ring catchlight centred in the pupil, identical in both eyes","shadow_edge":"a thin even halo shadow directly behind the subject, no directional shadow at all","falloff":"very rapid, the background goes dark within a metre","specular":"a ring shaped specular on every curved glossy surface","catchlight_object":"a complete ring reflected in every glossy curve, concentric and unbroken"},"parabolic_deep_90":{"label":"90cm deep parabolic reflector","quality":"collimated and punchy yet soft edged","catchlight":"round catchlight with a bright core and a dimmer outer ring from the rods","shadow_edge":"crisp shadow with a narrow but soft edged penumbra, more defined than a diffused source of the same size","falloff":"slower than its size suggests because the beam is partly collimated","specular":"bright compact speculars that keep surface texture readable"},"book_light_bounce":{"label":"book light, strobe bounced into white and read back through diffusion","quality":"extremely soft directional","catchlight":"very large soft rectangular catchlight with no visible edge","shadow_edge":"penumbra so wide the shadow has no readable boundary","falloff":"steep, because the effective source is very close to the subject","specular":"broad low intensity sheen that flatters texture without erasing it"},"fresnel_spot_hard":{"label":"fresnel spot, lens focused","quality":"hard directional with a controllable beam","catchlight":"small bright round catchlight with a faint concentric ring structure from the lens","shadow_edge":"hard edged shadow that stays sharp well away from the contact point","falloff":"controlled cone with a defined edge, everything outside it unlit","specular":"hard bright speculars that carve out every raised edge"},"overhead_scrim_3x2m":{"label":"3x2m overhead diffusion scrim","quality":"soft toplight over a wide area","catchlight":"a wide shallow catchlight sitting high in the eye, close to the upper lid","shadow_edge":"soft shadows falling almost straight down, deepest in the eye sockets and under the chin","falloff":"even across the covered area then dropping sharply outside it","specular":"soft broad sheen along every upward facing surface","catchlight_object":"a wide shallow reflection of the source lying along every upward facing curve","shadow_edge_object":"soft shadows falling almost straight down, deepest in every recess and under every overhang"},"gobo_window_pattern":{"label":"hard source through a window frame gobo","quality":"hard patterned","catchlight":"small hard catchlight where the beam reaches the eye, absent where a bar crosses","shadow_edge":"sharp edged bars of light and shade, the edges softening with distance from the gobo","falloff":"the pattern stretches and softens as it falls across a receding surface","specular":"hard speculars inside the lit bars only","catchlight_object":"a small hard reflection of the source inside the lit bars, absent where a bar crosses"}},"options_he":{"_doc":"Ready made options for the free text fields. A help popover explains what a field is; it does not tell someone who has never grades an image what a black point can be set to. Every field that has a knowable set of answers offers them here, in Hebrew, next to a text box that still accepts anything. The value is English because it goes into the prompt verbatim; the label is Hebrew because it never leaves the form.","subject_styling":[{"value":"plain crew neck knit, no jewellery","label":"סוודר פשוט, בלי תכשיטים"},{"value":"an open collar cotton shirt, sleeves rolled","label":"חולצה מכופתרת, שרוולים מקופלים"},{"value":"a dark jacket over a light shirt, no tie","label":"ז'קט כהה על חולצה בהירה"},{"value":"everyday clothes, nothing new","label":"בגדי יומיום, שום דבר חדש"},{"value":"a plain t shirt, hair not styled","label":"טי שירט, שיער לא מסודר"},{"value":"soft worn clothing, nothing new","label":"בגדים רכים ובלויים"},{"value":"a wool coat left unbuttoned","label":"מעיל צמר פתוח"},{"value":"workwear with real wear at the knees and cuffs","label":"בגדי עבודה עם סימני שימוש"},{"value":"no label, no logo","label":"בלי לוגו ובלי תווית (למוצר)"},{"value":"served, not arranged piece by piece","label":"מוגש, לא מסודר בפינצטה (לאוכל)"}],"set_background":[{"value":"seamless paper backdrop in warm grey","label":"רקע נייר אפור חם"},{"value":"seamless paper backdrop in white, lit separately","label":"רקע נייר לבן מואר בנפרד"},{"value":"black falling to nothing behind the subject","label":"שחור שנופל לאין"},{"value":"a smooth gradient from light to dark behind the subject","label":"גרדיאנט מאור לחושך"},{"value":"a plain painted wall a short distance behind","label":"קיר צבוע פשוט"},{"value":"a weathered plaster wall","label":"קיר טיח מתקלף"},{"value":"a plain interior wall with a window out of frame to one side","label":"קיר פנימי עם חלון מחוץ לפריים"},{"value":"a lived in room thrown well out of focus","label":"חדר מגורים מטושטש לגמרי"},{"value":"an office interior thrown well out of focus, no readable signage","label":"משרד מטושטש, בלי שילוט קריא"},{"value":"a café interior, other tables well out of focus","label":"בית קפה, שולחנות מטושטשים"},{"value":"a city street compressed by the lens, signage unreadable","label":"רחוב עירוני דחוס, שילוט לא קריא"},{"value":"open woodland dissolving into shapes at this aperture","label":"יער שנמס לצורות"},{"value":"an open field running to a far treeline","label":"שדה פתוח עד קו עצים"},{"value":"still water with the far bank compressed by the long lens","label":"מים שקטים וגדה רחוקה"},{"value":"a dim kitchen falling away behind","label":"מטבח עמום שנסוג לאחור"},{"value":"near black, the subject emerging out of it","label":"כמעט שחור, הנושא יוצא ממנו"}],"set_surface":[{"value":"white acrylic sweep","label":"אקריל לבן"},{"value":"black acrylic, giving one clean mirror reflection","label":"אקריל שחור עם השתקפות"},{"value":"a rustic wooden table with old knife marks","label":"שולחן עץ כפרי עם סימני סכין"},{"value":"a worn wooden counter","label":"דלפק עץ שחוק"},{"value":"honed marble with grey veining","label":"שיש מלוטש עם עורקים"},{"value":"dark slate","label":"צפחה כהה"},{"value":"brushed steel","label":"פלדה מוברשת"},{"value":"seamless paper curving under the subject","label":"נייר שמתעגל מתחת לנושא"},{"value":"a wooden floor","label":"רצפת עץ"},{"value":"a rug over a wooden floor","label":"שטיח על רצפת עץ"},{"value":"wet pavement","label":"מדרכה רטובה"},{"value":"leaf litter and low grass","label":"עלים ודשא נמוך"},{"value":"dry grass bending in the wind","label":"עשב יבש ברוח"},{"value":"fresh snow holding tracks","label":"שלג טרי עם עקבות"},{"value":"wet stones and shallow water","label":"אבנים רטובות ומים רדודים"}],"set_props":[{"value":"a cold mug set down and forgotten","label":"ספל קר שנשכח"},{"value":"a linen napkin pushed aside","label":"מפית פשתן דחופה הצידה"},{"value":"a few crumbs left on the surface","label":"כמה פירורים"},{"value":"an open book left face down","label":"ספר פתוח הפוך"},{"value":"a glass of water","label":"כוס מים"},{"value":"cutlery at the frame edge","label":"סכום בקצה הפריים"},{"value":"a throw blanket pushed to one side","label":"שמיכה דחופה לצד"},{"value":"keys and a phone left on the surface","label":"מפתחות וטלפון"},{"value":"a folded cloth with a real crease in it","label":"בד מקופל עם קמט אמיתי"}],"subject_secondary":[{"value":"hands, in the same focus plane as the face","label":"ידיים באותו מישור פוקוס כמו הפנים"},{"value":"another figure behind, well out of focus","label":"דמות נוספת מאחור, מחוץ לפוקוס"},{"value":"steam rising and breaking","label":"אדים שעולים ונשברים"},{"value":"a second object behind and to the side, out of focus","label":"אובייקט שני מאחור ובצד"},{"value":"foreground foliage crossing the frame, out of focus","label":"עלווה בקדמה שחוצה את הפריים"},{"value":"clutter that was not tidied for the photograph","label":"בלגן halo outlines around the subject","label":"הילה סביב הנושא"},{"value":"an over sharpened edge","label":"קצה מחודד יתר על המידה"}],"intent_message":[{"value":"a person seen plainly, without flattery added afterwards","label":"אדם כפי שהוא, בלי להחמיא"},{"value":"an object that looks like it has been used and kept","label":"חפץ שנראה משומש ושמור"},{"value":"food that looks edible rather than styled","label":"אוכל שנראה אכיל ולא מסודר לצילום"},{"value":"a quiet moment that was not staged for the camera","label":"רגע שקט שלא בוים"},{"value":"a product shown honestly, at its real proportions","label":"מוצר בפרופורציות האמיתיות שלו"}],"intent_tradition":[{"value":"editorial studio portraiture","label":"פורטרט אולפן עיתונאי"},{"value":"dutch_golden_age_still_life","label":"טבע דומם הולנדי"},{"value":"peter_lindbergh_grain","label":"גרעין בשחור לבן, ליבנדברג"},{"value":"documentary reportage","label":"רפורטאז' תיעודי"},{"value":"catalogue product photography","label":"צילום מוצר קטלוגי"},{"value":"natural light food photography","label":"צילום אוכל באור טבעי"}],"intent_usage":[{"value":"web and print","label":"אתר ודפוס"},{"value":"social media, seen small","label":"רשתות, נצפה בקטן"},{"value":"a printed menu","label":"תפריט מודפס"},{"value":"an online store listing","label":"עמוד מוצר בחנות"},{"value":"a course slide, seen on a projector","label":"שקופית בקורס"}]},"quick_he":{"_doc":"Recipes for the quick path. Each recipe is a complete, valid shot spec plus three sets of options, and the sixth answer comes from `_moments`, which is shared by every recipe. Every option carries a patch that is deep merged onto the base in a fixed order (subject, environment, mood, moment, aspect ratio). Nothing here is generated at runtime, so every combination a user can reach is a spec that was authored, not assembled by guesswork. The moments are shared and the other three are not, and that is a fact about the data rather than a preference: subject, environment and mood all write into ca function round1(x) {
  const scaled = x * 10;
  const floor = Math.floor(scaled);
  const diff = scaled - floor;
  let result;
  if (diff > 0.5) result = floor + 1;
  else if (diff < 0.5) result = floor;
  else result = (floor % 2 === 0) ? floor : floor + 1;
  return result / 10;
}

/* Depth of field. Distances in cm, focal in mm, aperture like "f/4".
   H = f^2/(N*c) + f;  Dn = H*s/(H+s-f);  Df = H*s/(H-s+f), infinity when s
   reaches hyperfocal. Returns {near_cm, far_cm, total_cm} rounded to 0.1cm,
   far_cm/total_cm null beyond hyperfocal. */
function depthOfField(camera) {
  const f = camera.focal_length_mm;
  const N = parseFloat(String(camera.aperture).replace(/^f\//, ''));
  const c = COC_MM[camera.format];
  const s = camera.subject_distance_cm * 10; /* mm */
  if (!f || !N || !c || !s) return null;
  const H = (f * f) / (N * c) + f;
  const near = (H * s) / (H + s - f);
  if (s >= H - f) {
    return { near_cm: round1(near / 10), far_cm: null, total_cm: null };
  }
  const far = (H * s) / (H - s + f);
  return {
    near_cm: round1(near / 10),
    far_cm: round1(far / 10),
    total_cm: round1((far - near) / 10),
  };
}

/* Azimuth 0 = camera axis, positive = camera right (viewed from above).
   Normalised to [-180, 180) so that 180 reads as behind on the left. */
function azimuthWords(deg) {
  let a = ((deg % 360) + 360) % 360;
  if (a >= 180) a -= 360;
  const side = a < 0 ? 'left' : 'right';
  const mag = Math.abs(a);
  if (mag <= 7) return 'on the camera axis';
  if (mag <= 30) return `just off axis to camera ${side}`;
  if (mag <= 50) return `forty five degrees to camera ${side}`;
  if (mag <= 135) return `ninety degrees to camera ${side}, fully side on`;
  return `directly behind the subject on the camera ${side} side`;
}

/* Elevation 0 = subject height, positive = above. */
function elevationWords(deg) {
  if (deg < -15) return 'below subject height, angled up';
  if (deg <= 15) return 'level with the subject';
  if (deg <= 35) return 'slightly above subject height, angled down';
  if (deg <= 70) return 'high, angled down onto the subject';
  return 'almost straight overhead';
}

/* What the source's size at its distance does to wrap and falloff.
   Only speaks when the light declares its own size. */
function geometryWords(sizeCm, distanceCm) {
  if (!sizeCm || !distanceCm) return null;
  const ratio = sizeCm / distanceCm;
  if (ratio >= 1) {
    return 'source larger than the subject at this distance, so the light '
      + 'wraps and the falloff across the frame is steep';
  }
  if (ratio <= 0.25) {
    return 'small distant source, hard shadows and near even illumination '
      + 'across the subject';
  }
  return 'source about the size of the subject, clear modelling with a '
    + 'readable shadow side';
}

/* Focal character: the authored table wins on the literal focal length;
   anything else falls to bands chosen by 35mm equivalent, not the barrel. */
function focalCharacter(camera, realismLib) {
  const authored = realismLib.focal_character[String(camera.focal_length_mm)];
  if (authored) return authored;
  const diag = realismLib.format_diagonal_mm[camera.format];
  if (!diag) return null;
  const equivalent = camera.focal_length_mm * (43.3 / diag);
  for (const [limit, words] of realismLib.focal_bands) {
    if (equivalent <= limit) return words;
  }
  return null;
}

const PHYSICS = {
  COC_MM, round1, depthOfField, azimuthWords, elevationWords,
  geometryWords, focalCharacter,
};

if (typeof module !== 'undefined') module.exports = PHYSICS;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, PHYSICS);
}

/* Prompt Machine — the compiler: shot spec -> four model dialects.
   The spec holds physics, this file holds execution. Section wording is the
   documented format from docs/PROMPTS.md and must not drift from it. */
'use strict';

const P = (typeof require !== 'undefined') ? require('./physics.js') : globalThis.PM;

/* Genres whose modifier wording may talk about a face. Everything else gets
   the _object twin when one exists, because a still life prompt that mentions
   eye sockets has told the model there is a person in the frame. */
const FACE_GENRES = ['portrait', 'fashion', 'reportage'];

const RATIO_WORDS = {
  '1:1': 'even light, no real shadow side',
  '2:1': 'one stop, soft modelling, shadows fully readable',
  '3:1': 'a stop and a half, open shadows with clear direction',
  '4:1': 'two stops between light and shadow side, clear modelling',
  '5:1': 'just over two stops, shadows reading but dark',
  '6:1': 'two and a half stops, dramatic',
  '8:1': 'three stops, deep shadows that keep only a hint of detail',
  '16:1': 'four stops, the shadow side essentially unlit',
};

const EQUIPMENT_SENTENCE =
  'Nothing used to make this light is in the picture. A window or lamp the '
  + 'set puts in frame is part of the room and stays.';

const GPT_PREAMBLE =
  'Produce a single photograph that would pass as a real capture from the set '
  + 'described below. Follow the lighting plot literally: every shadow, '
  + 'catchlight and reflection must be derivable from the listed sources and '
  + 'from nothing else.';

const GPT_IDENTITY_PREAMBLE =
  'This subject appears in a series. Treat the IDENTITY section as binding: '
  + 'reproduce every trait in it exactly, and change nothing about the subject '
  + 'that the section does not mention.';

/* Midjourney texture token per realism level; 320 characters has no room for
   the capture character section. */
const MJ_TEXTURE = {
  clean_commercial: 'clean studio finish',
  editorial: 'fine grain',
  documentary: 'clutter at the frame edge',
  vernacular: 'heavy grain',
};

const MJ_LIMIT = 320;
const MJ_TAIL_NO = ['softbox', 'light stand', 'reflector'];

function words(key) { return String(key).replace(/_/g, ' '); }

/* ------------------------------------------------------------ normalize -- */

/* The authored libraries (quick recipes, identities) carry the original
   schema: subject as an object, realism.level, rig.key_to_fill_ratio,
   moment.action. The compiler accepts both shapes; this maps the original
   onto the internal one without touching a spec that is already internal. */
function normalizeSpec(original) {
  const s = JSON.parse(JSON.stringify(original));
  if (s.subject && typeof s.subject === 'object') {
    const sub = s.subject;
    s.subject = sub.primary;
    if (s.secondary_subjects === undefined) s.secondary_subjects = sub.secondary || [];
    if (s.styling === undefined && sub.styling !== undefined) s.styling = sub.styling;
    if (sub.materials) s.materials = [...sub.materials, ...(s.materials || [])];
    if (sub.scale_cm !== undefined) s.subject_scale_cm = sub.scale_cm;
  }
  if (s.realism && s.realism.level) {
    const r = s.realism;
    s.realism_level = r.level;
    s.realism = {};
    if (r.retouch_level) s.realism.retouch = r.retouch_level;
    if (r.optical_extra) s.realism.optical_extra = r.optical_extra;
    if (r.sensor_extra) s.realism.sensor_extra = r.sensor_extra;
    if (r.scene_imperfections && r.scene_imperfections.length) {
      s.imperfections_extra =
        [...r.scene_imperfections, ...(s.imperfections_extra || [])];
    }
  }
  if (s.rig && s.rig.key_to_fill_ratio && !s.rig.ratio) {
    s.rig.ratio = s.rig.key_to_fill_ratio;
  }
  if (s.moment && s.moment.action && !s.moment.body) {
    s.moment.body = s.moment.action;
    delete s.moment.action;
  }
  if (s.intent && typeof s.intent === 'object') s.intent = s.intent.message;
  delete s.generation;
  delete s.version;
  return s;
}

/* ------------------------------------------------------------------ rig -- */

/* Resolve the rig: preset lights deep copied, then spec lights merged by
   role. off:true removes; a matching role overrides fields; a new role must
   arrive complete (the validator enforces that). */
function resolveRig(rig, lib) {
  const preset = rig.preset ? lib.lighting[rig.preset] : null;
  let lights = preset ? preset.lights.map((l) => ({ ...l })) : [];
  for (const override of rig.lights || []) {
    const at = lights.findIndex((l) => l.role === override.role);
    if (override.off) {
      if (at !== -1) lights.splice(at, 1);
    } else if (at !== -1) {
      lights[at] = { ...lights[at], ...override };
    } else {
      lights.push({ ...override });
    }
  }
  return {
    lights,
    ratio: rig.ratio || (preset ? preset.key_to_fill_ratio : null),
    ambient: rig.ambient || 'none',
    name_equipment: !!rig.name_equipment,
  };
}

function lightLine(light, nameEquipment, lib) {
  const parts = [P.azimuthWords(light.azimuth_deg),
                 P.elevationWords(light.elevation_deg),
                 `${light.distance_cm}cm from the subject`];
  if (light.feathered) {
    parts.push('feathered so the subject sits on the edge of the beam, not its hot centre');
  }
  if (light.power_stops_rel_key) {
    const p = light.power_stops_rel_key;
    parts.push(`${p > 0 ? '+' + p : p} stops relative to the key`);
  }
  if (light.color_temp_k) parts.push(`${light.color_temp_k}K`);
  let head = words(light.role);
  if (nameEquipment && lib.modifiers[light.modifier]) {
    head += ` (${lib.modifiers[light.modifier].label})`;
  }
  return `${head}: ${parts.join(', ')}.`;
}

/* What the light does: key's three facts, then geometry (or the modifier's
   falloff when the light declares no size), then every later light's own
   contribution — a negative fill deepens the shadow side, a bounce says
   nothing, an emissive source brings its three facts. */
function consequences(lights, genre, lib) {
  const useObject = !FACE_GENRES.includes(genre);
  const fact = (mod, field) =>
    (useObject && mod[`${field}_object`]) ? mod[`${field}_object`] : mod[field];
  const out = [];
  const key = lights.find((l) => l.role === 'key');
  if (key && lib.modifiers[key.modifier]) {
    const mod = lib.modifiers[key.modifier];
    out.push(fact(mod, 'shadow_edge'), fact(mod, 'catchlight'), fact(mod, 'specular'));
    const geometry = P.geometryWords(key.size_cm, key.distance_cm);
    out.push(geometry || fact(mod, 'falloff'));
  }
  for (const light of lights) {
    if (light === key) continue;
    const mod = lib.modifiers[light.modifier];
    if (!mod) continue;
    if (light.modifier === 'negative_fill_black') {
      out.push(mod.shadow_edge);
    } else if (light.modifier === 'bounce_v_flat_white') {
      /* fill without a signature of its own */
    } else {
      out.push(fact(mod, 'shadow_edge'), fact(mod, 'catchlight'), fact(mod, 'specular'));
    }
  }
  return out.filter(Boolean);
}

/* ------------------------------------------------------------- sections -- */

/* Negatives: base + genre + the shot's own list. A leading minus removes,
   "-*" removes every default; removals that match nothing are reported. */
function buildNegatives(spec, lib) {
  const own = spec.negative || [];
  const removals = own.filter((n) => n.startsWith('-')).map((n) => n.slice(1));
  const additions = own.filter((n) => !n.startsWith('-'));
  let defaults = [...lib.realism.negative_base,
                  ...(lib.realism.negative_by_genre[spec.genre] || [])];
  const unmatched = [];
  for (const removal of removals) {
    if (removal === '*') { defaults = []; continue; }
    const before = defaults.length;
    defaults = defaults.filter((n) => n !== removal);
    if (defaults.length === before) unmatched.push(removal);
  }
  return { list: [...defaults, ...additions], unmatched };
}

function materialLines(spec, lib) {
  return (spec.materials || [])
    .filter((key) => lib.materials[key])
    .map((key) => {
      const m = lib.materials[key];
      return `${words(key)}: ${m.micro}; ${m.light}; ${m.flaw}`;
    });
}

/* An undecided realism level contributes nothing rather than crashing: the
   sections it feeds are simply absent until the user decides. */
const EMPTY_LEVEL = {
  optical_signature: [], sensor_signature: [], scene_imperfections: [],
  retouch_level: '[retouch level]',
};

function levelOf(spec, lib) {
  return lib.realism.levels[spec.realism_level] || EMPTY_LEVEL;
}

function captureCharacter(spec, lib) {
  const level = levelOf(spec, lib);
  const extra = spec.realism || {};
  return [
    ...level.optical_signature, ...(extra.optical_extra || []),
    ...level.sensor_signature, ...(extra.sensor_extra || []),
  ];
}

function imperfections(spec, lib) {
  const level = levelOf(spec, lib);
  return [
    ...level.scene_imperfections,
    ...(lib.realism.imperfections_by_genre[spec.genre] || []),
    ...(spec.imperfections_extra || []),
  ];
}

function retouchWord(spec, lib) {
  return words((spec.realism && spec.realism.retouch)
    || levelOf(spec, lib).retouch_level);
}

function momentItems(moment) {
  if (!moment) return null;
  const items = [
    moment.body,
    moment.attention,
    moment.hands ? `the hands: ${moment.hands}` : null,
    moment.residue ? `still visible from the second before: ${moment.residue}` : null,
    moment.foreground ? `nearest the lens and out of focus: ${moment.foreground}` : null,
  ].filter(Boolean);
  return items.length ? items : null;
}

function dofSentence(dof) {
  if (!dof) return 'sharp zone [waiting for focal length, aperture and distance]';
  if (dof.far_cm === null) {
    return `sharp zone from ${dof.near_cm}cm to infinity, everything nearer `
      + 'falling off progressively';
  }
  return `sharp zone only ${dof.total_cm}cm deep, from ${dof.near_cm}cm to `
    + `${dof.far_cm}cm from the sensor, everything outside it falling off progressively`;
}

/* The intermediate representation: every section as data, shared by all
   dialects and by the budget. */
function buildIR(spec, lib) {
  const rig = resolveRig(spec.rig || {}, lib);
  const dof = P.depthOfField(spec.camera);
  const negatives = buildNegatives(spec, lib);
  return {
    spec,
    rig,
    dof,
    plot: rig.lights.map((l) => lightLine(l, rig.name_equipment, lib)),
    consequences: consequences(rig.lights, spec.genre, lib),
    materials: materialLines(spec, lib),
    capture: captureCharacter(spec, lib),
    imperfections: imperfections(spec, lib),
    retouch: retouchWord(spec, lib),
    moment: momentItems(spec.moment),
    negatives: negatives.list,
    negativeUnmatched: negatives.unmatched,
    formatCharacter: lib.realism.format_character[spec.camera.format],
    focalCharacter: P.focalCharacter(spec.camera, lib.realism),
  };
}

/* Prose sections in the documented order, as [name, text] pairs so the
   budget can shed whole sections. */
/* undecided (null/undefined) becomes a bracketed placeholder; an authored
   empty string means "none" and is simply absent */
function ph(value, name) {
  return (value === undefined || value === null) ? `[${name}]` : value;
}

function proseSections(ir) {
  const s = ir.spec;
  const sections = [];

  let subject = `A photograph. ${ph(s.subject, 'subject')}.`;
  if (s.secondary_subjects && s.secondary_subjects.length) {
    subject += ` With ${s.secondary_subjects.join(', ')}.`;
  }
  if (s.styling) subject += ` ${s.styling}.`;
  sections.push(['subject', subject]);

  if (s.identity) {
    const id = s.identity;
    const traits = id.traits.join('; ');
    let text = 'IDENTITY. This subject recurs across a series';
    if (id.reference) {
      text += ' and must match the attached reference image exactly in every '
        + `fixed detail listed below. ${traits}. The reference image `
        + `[${id.reference}] is attached to this prompt. Match it exactly in `
        + 'every fixed detail listed above, and take the pose, the lighting '
        + 'and the background from this prompt rather than from it.';
    } else {
      text += `. Reproduce every fixed detail exactly: ${traits}. No reference `
        + 'image is attached, so these traits are the whole identity.';
    }
    sections.push(['identity', text]);
  }

  if (ir.moment) sections.push(['moment', `MOMENT. ${ir.moment.join('. ')}.`]);

  const setParts = [ph(s.set.background, 'background'), ph(s.set.surface, 'surface')]
    .filter((part) => part && part.trim());
  let set = `SET. ${setParts.map((part) => `${part}.`).join(' ')}`;
  if (s.set.props && s.set.props.length) {
    set += ` props: ${s.set.props.join(', ')}.`;
  }
  if (s.set.background_distance_cm > 0) {
    set += ` background ${s.set.background_distance_cm}cm behind the subject, `
      + 'so it takes clearly less light than the subject.';
  }
  sections.push(['set', set]);

  const c = s.composition;
  const framingParts = [
    ph(c.layout, 'layout'),
    ph(c.subject_placement, 'subject placement'),
    ph(c.negative_space, 'negative space'),
    ph(c.horizon_or_table_line, 'horizon or table line'),
  ].filter((part) => part && part.trim());
  sections.push(['composition',
    `FRAMING. ${framingParts.map((part) => `${part}.`).join(' ')} `
    + `Aspect ratio ${ph(s.camera.aspect_ratio, 'aspect ratio')}.`]);

  const plotText = ir.plot.length ? ir.plot.join(' ') : '[lighting rig].';
  const ratioText = ir.rig.ratio
    ? `Ratio ${ir.rig.ratio}: ${RATIO_WORDS[ir.rig.ratio] || ir.rig.ratio}.`
    : 'Ratio [key to fill ratio].';
  const ambientText = ir.rig.ambient && ir.rig.ambient !== 'none'
    ? words(ir.rig.ambient)
    : (ir.rig.ambient === 'none' ? 'none' : '[ambient]');
  sections.push(['lighting_plot',
    `LIGHTING PLOT. ${plotText} ${ratioText} `
    + `Ambient: ${ambientText}. ${EQUIPMENT_SENTENCE}`]);

  if (ir.consequences.length) {
    sections.push(['consequences',
      `WHAT THE LIGHT DOES. ${ir.consequences.join('; ')}.`]);
  }

  if (ir.materials.length) {
    sections.push(['materials', `MATERIALS. ${ir.materials.join(' | ')}.`]);
  }

  const cam = s.camera;
  /* an undecided value travels as a bracketed placeholder, never as
     "undefined" and never as a silent default */
  const v = (value, name, suffix = '') =>
    (value === undefined || value === null || value === ''
      ? `[${name}]` : `${value}${suffix}`);
  const character = [ir.formatCharacter, ir.focalCharacter]
    .filter(Boolean).map((text) => `${text}. `).join('');
  const camText = `CAMERA. Shot on a ${v(cam.body_class && words(cam.body_class), 'camera body')} at `
    + `${v(cam.focal_length_mm, 'focal length', 'mm')}, ${v(cam.aperture, 'aperture')}, `
    + `${v(cam.shutter, 'shutter')}, ISO ${v(cam.iso, 'ISO')}, `
    + `camera ${v(cam.subject_distance_cm, 'distance', 'cm')} from the subject at `
    + `${v(cam.height_cm, 'camera height', 'cm')} height. `
    + `${character}`
    + `Focus plane on ${v(cam.focus_point, 'focus point')}; ${dofSentence(ir.dof)}.`;
  sections.push(['camera', camText]);

  if (ir.capture.length) {
    sections.push(['capture_character',
      `CAPTURE CHARACTER. ${ir.capture.join('; ')}.`]);
  }

  if (ir.imperfections.length) {
    sections.push(['imperfections',
      `IMPERFECTIONS TO KEEP. ${ir.imperfections.join('; ')}. `
      + `Retouching: ${ir.retouch}.`]);
  }

  const g = s.grade;
  const gradeParts = [
    ph(g.look, 'grade look'),
    g.black_point != null ? words(g.black_point) : '[black point]',
    g.white_balance_k,
    ph(g.contrast_curve, 'contrast curve'),
    ph(g.saturation, 'saturation'),
  ].filter((part) => part !== undefined && part !== null && part !== '');
  sections.push(['grade', `GRADE. ${gradeParts.join('. ')}.`]);

  if (ir.negatives.length) {
    sections.push(['negative', `DO NOT PRODUCE: ${ir.negatives.join(', ')}.`]);
  }

  return sections;
}

/* ------------------------------------------------------------- dialects -- */

function compileNano(ir) {
  return proseSections(ir).map(([, text]) => text).join('\n');
}

function compileGpt(ir) {
  const lines = [GPT_PREAMBLE];
  if (ir.spec.identity) lines.push(GPT_IDENTITY_PREAMBLE);
  lines.push(compileNano(ir));
  return lines.join('\n');
}

function compileFlux(ir) {
  const s = ir.spec;
  const out = {
    type: 'photograph',
    subject: s.subject,
    secondary_subjects: s.secondary_subjects || [],
    styling: s.styling || '',
  };
  if (s.identity) {
    out.identity = { reference: s.identity.reference, traits: s.identity.traits };
  }
  out.set = {
    background: s.set.background,
    background_distance_cm: s.set.background_distance_cm,
    surface: s.set.surface,
    props: s.set.props || [],
    environment: s.set.environment,
  };
  out.composition = {
    layout: s.composition.layout,
    subject_placement: s.composition.subject_placement,
    negative_space: s.composition.negative_space,
    horizon_or_table_line: s.composition.horizon_or_table_line,
  };
  if (ir.moment) out.moment = ir.moment;
  out.lighting = {
    plot: ir.plot,
    consequences: ir.consequences,
    ratio: ir.rig.ratio,
    ambient: ir.rig.ambient,
    equipment_visibility: EQUIPMENT_SENTENCE,
  };
  out.materials = ir.materials;
  const cam = s.camera;
  out.camera = {
    body_class: cam.body_class,
    format: cam.format,
    focal_length_mm: cam.focal_length_mm,
    aperture: cam.aperture,
    subject_distance_cm: cam.subject_distance_cm,
    height_cm: cam.height_cm,
  };
  if (cam.tilt_deg !== undefined) out.camera.tilt_deg = cam.tilt_deg;
  out.camera.shutter = cam.shutter;
  out.camera.iso = cam.iso;
  out.camera.focus_point = cam.focus_point;
  out.camera.aspect_ratio = cam.aspect_ratio;
  out.camera.shot_size = cam.shot_size;
  if (ir.dof) {
    out.depth_of_field_cm = {
      near_cm: ir.dof.near_cm, far_cm: ir.dof.far_cm, total_cm: ir.dof.total_cm,
    };
  }
  out.capture_character = ir.capture;
  out.imperfections = ir.imperfections;
  out.grade = {};
  for (const key of ['look', 'black_point', 'white_balance_k',
                     'contrast_curve', 'saturation']) {
    if (s.grade[key] !== undefined) out.grade[key] = s.grade[key];
  }
  out.avoid = ir.negatives;
  return JSON.stringify(out, null, 2);
}

/* Cut a phrase at a word boundary so it fits the budget. A severed word is a
   fact with no meaning. */
function cutAtWord(text, budget) {
  if (text.length <= budget) return text;
  const cut = text.slice(0, budget + 1);
  const at = cut.lastIndexOf(' ');
  return (at > 0 ? cut.slice(0, at) : '').replace(/[,;]$/, '');
}

/* Midjourney: 320 characters is an allocation problem. The light and the
   camera are protected; the subject and the moment shrink to whole words;
   texture rides along only if room remains. --no is how that dialect says
   the negatives, and it sits in the tail so it is never dropped. */
function compileMidjourney(ir) {
  const s = ir.spec;
  const tail = ` --ar ${s.camera.aspect_ratio || '[aspect]'} --style raw --s 50 --no ${MJ_TAIL_NO.join(', ')}`;
  const key = ir.rig.lights.find((l) => l.role === 'key');
  const keyText = key
    ? `${P.azimuthWords(key.azimuth_deg)}, ${P.elevationWords(key.elevation_deg)}`
    : '';
  const distText = key ? `${key.distance_cm}cm from the subject` : '';
  const camText = `${s.camera.focal_length_mm || '[focal]'}mm `
    + `${s.camera.aperture || '[aperture]'}`;
  const ratioText = ir.rig.ratio ? `${ir.rig.ratio} ratio` : '[ratio] ratio';
  const texture = MJ_TEXTURE[s.realism_level];

  const fixed = [keyText, distText, camText, ratioText].filter(Boolean);
  const body = MJ_LIMIT - tail.length;
  const joins = (n) => 2 * n; /* ", " between n+1 segments adds 2n chars */

  let fixedLen = fixed.reduce((sum, t) => sum + t.length, 0);
  const identityTrait = s.identity ? s.identity.traits[0] : null;

  /* subject gets at most 45% of the body, always whole words */
  let remaining = body - fixedLen - joins(fixed.length);
  if (identityTrait) remaining -= identityTrait.length + 2;
  const momentFull = ir.moment ? ir.moment[0] : null;
  let subject = cutAtWord(s.subject, Math.max(40, Math.floor(body * 0.45)));
  if (subject.length > remaining - 20) subject = cutAtWord(subject, remaining - 20);
  remaining -= subject.length;

  let moment = null;
  if (momentFull && remaining > 22) {
    moment = cutAtWord(momentFull, remaining - 2);
    remaining -= moment.length + 2;
  }

  const segments = [subject, moment, identityTrait, ...fixed].filter(Boolean);
  let prompt = segments.join(', ') + tail;

  if (texture && prompt.length + texture.length + 2 <= MJ_LIMIT) {
    prompt = [...segments, texture].join(', ') + tail;
  }
  /* last resort: drop the key distance, the way the published prompts do */
  if (prompt.length > MJ_LIMIT && distText) {
    prompt = segments.filter((t) => t !== distText).join(', ') + tail;
  }
  return prompt;
}

/* --------------------------------------------------------------- public -- */

const DIALECTS = {
  nano: compileNano,
  gpt: compileGpt,
  flux: compileFlux,
  midjourney: compileMidjourney,
};

function compile(rawSpec, lib, target) {
  const spec = normalizeSpec(rawSpec);
  const ir = buildIR(spec, lib);
  if (target) return DIALECTS[target](ir);
  const out = {};
  for (const [name, dialect] of Object.entries(DIALECTS)) out[name] = dialect(ir);
  return out;
}

const COMPILER = {
  compile, normalizeSpec, buildIR, proseSections, resolveRig, buildNegatives,
  RATIO_WORDS, EQUIPMENT_SENTENCE, FACE_GENRES, DIALECTS, MJ_LIMIT,
  GPT_PREAMBLE, GPT_IDENTITY_PREAMBLE,
};

if (typeof module !== 'undefined') module.exports = COMPILER;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, COMPILER);
}

/* Prompt Machine — validation: structural against the schema shape, then
   referential against lib/. A key that does not resolve is an error, not a
   warning: it does not fail loudly, it silently strips physics out of the
   prompt while the prompt still reads as correct. */
'use strict';

const REQUIRED_TOP = ['subject', 'genre', 'realism_level', 'set', 'composition',
                      'rig', 'camera', 'grade'];
const REQUIRED_CAMERA = ['body_class', 'format', 'focal_length_mm', 'aperture',
                         'subject_distance_cm', 'height_cm', 'shutter', 'iso',
                         'focus_point', 'aspect_ratio'];
const REQUIRED_SET = ['background', 'surface', 'environment'];
const REQUIRED_COMPOSITION = ['layout', 'subject_placement', 'negative_space',
                              'horizon_or_table_line'];
/* white_balance_k is optional: a grade may leave the balance to the look */
const REQUIRED_GRADE = ['look', 'black_point', 'contrast_curve', 'saturation'];
const REQUIRED_MOMENT = ['body', 'attention', 'hands', 'residue', 'foreground'];
const REQUIRED_NEW_LIGHT = ['role', 'modifier', 'azimuth_deg', 'elevation_deg',
                            'distance_cm'];

const AMBIENT_VALUES = ['none', 'dim_practical', 'blacked_out', 'daylight_mix'];
const BLACK_POINT_VALUES = ['true_black', 'lifted_charcoal', 'crushed'];

const C = (typeof require !== 'undefined') ? require('./compiler.js') : globalThis.PM;

function validate(rawSpec, lib) {
  const spec = C.normalizeSpec(rawSpec);
  const errors = [];
  const warnings = [];
  const err = (m) => errors.push(m);
  const warn = (m) => warnings.push(m);

  /* ---- structural ---- */
  for (const key of REQUIRED_TOP) {
    if (spec[key] === undefined) err(`missing required field: ${key}`);
  }
  if (spec.camera) {
    for (const key of REQUIRED_CAMERA) {
      if (spec.camera[key] === undefined) err(`camera missing required key: ${key}`);
    }
  }
  if (spec.set) {
    for (const key of REQUIRED_SET) {
      if (spec.set[key] === undefined) err(`set missing required key: ${key}`);
    }
  }
  if (spec.composition) {
    for (const key of REQUIRED_COMPOSITION) {
      if (spec.composition[key] === undefined) err(`composition missing required key: ${key}`);
    }
  }
  if (spec.grade) {
    for (const key of REQUIRED_GRADE) {
      if (spec.grade[key] === undefined) err(`grade missing required key: ${key}`);
    }
  }
  if (spec.realism_level && !lib.realism.levels[spec.realism_level]) {
    err(`enum violation: realism_level "${spec.realism_level}" is not a level`);
  }
  if (spec.rig && spec.rig.ambient && !AMBIENT_VALUES.includes(spec.rig.ambient)) {
    err(`enum violation: ambient "${spec.rig.ambient}"`);
  }
  if (spec.grade && spec.grade.black_point
      && !BLACK_POINT_VALUES.includes(spec.grade.black_point)) {
    err(`enum violation: grade.black_point "${spec.grade.black_point}"`);
  }
  if (spec.moment) {
    for (const key of REQUIRED_MOMENT) {
      if (!spec.moment[key]) warn(`moment missing field: ${key}`);
    }
  }
  if (spec.identity) {
    if (!spec.identity.traits || !spec.identity.traits.length) {
      err('identity with no traits');
    }
  }

  /* Structural errors suppress referential checks: resolving a rig against a
     malformed spec raises rather than reports. */
  if (errors.length) return { errors, warnings, ok: false };

  /* ---- referential ---- */
  const rig = spec.rig;
  const preset = rig.preset ? lib.lighting[rig.preset] : null;
  if (rig.preset && !preset) err(`unknown lighting preset: ${rig.preset}`);

  const presetRoles = preset ? preset.lights.map((l) => l.role) : [];
  for (const light of rig.lights || []) {
    if (light.off) {
      if (!light.role) err('a light switched off must name its role');
      continue;
    }
    const isOverride = presetRoles.includes(light.role);
    if (!isOverride) {
      for (const key of REQUIRED_NEW_LIGHT) {
        if (light[key] === undefined) {
          err(`new light "${light.role || '?'}" missing ${key}: a light with no `
            + 'modifier emits no catchlight, shadow edge or specular while '
            + 'still counting as a source');
        }
      }
    }
    if (light.modifier && !lib.modifiers[light.modifier]) {
      err(`unknown modifier: ${light.modifier}`);
    }
  }
  if (!errors.length) {
    /* resolved rig must end with a key light */
    const resolved = (preset ? preset.lights.map((l) => ({ ...l })) : []);
    for (const o of rig.lights || []) {
      const at = resolved.findIndex((l) => l.role === o.role);
      if (o.off) { if (at !== -1) resolved.splice(at, 1); }
      else if (at !== -1) resolved[at] = { ...resolved[at], ...o };
      else resolved.push(o);
    }
    if (!resolved.some((l) => l.role === 'key')) err('rig resolves to no key light');
  }

  if (!spec.materials || !spec.materials.length) {
    warn('no materials declared: the single largest realism lever is unused');
  } else {
    for (const key of spec.materials) {
      if (!lib.materials[key]) err(`unknown material: ${key}`);
    }
  }

  for (const negative of spec.negative || []) {
    if (!negative.startsWith('-') || negative === '-*') continue;
    const target = negative.slice(1);
    const defaults = [...lib.realism.negative_base,
                      ...(lib.realism.negative_by_genre[spec.genre] || [])];
    if (!defaults.includes(target)) {
      warn(`negative removal "-${target}" removes nothing`);
    }
  }

  /* Hebrew must never reach a model. identity.key and identity.label are how
     the form finds the identity again; they never compile, so they are the
     one place Hebrew may live in a spec. */
  const hebrew = /[֐-׿]/;
  const uiOnly = ['spec.identity.key', 'spec.identity.label'];
  const sweep = (value, path) => {
    if (uiOnly.includes(path)) return;
    if (typeof value === 'string' && hebrew.test(value)) {
      err(`hebrew in a model facing field: ${path}`);
    } else if (Array.isArray(value)) {
      value.forEach((v, i) => sweep(v, `${path}[${i}]`));
    } else if (value && typeof value === 'object') {
      for (const [k, v] of Object.entries(value)) sweep(v, `${path}.${k}`);
    }
  };
  sweep(spec, 'spec');

  return { errors, warnings, ok: errors.length === 0 };
}

const VALIDATE = { validate };
if (typeof module !== 'undefined') module.exports = VALIDATE;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, VALIDATE);
}

/* Prompt Machine — the section budget. Whole sections are shed, least load
   bearing first, and the log says what went. The subject, the lighting plot,
   what the light does and the camera are never shed; below that floor the
   compiler reports OVER BUDGET rather than cutting physics. */
'use strict';

/* Shed first -> shed last. Capture character before imperfections: vignette
   and grain are post stages, a broken pear stem is not. Grade before
   materials: do not spend prompt on what post owns. The moment sheds last:
   the materials decide whether the frame passes as a photograph, the moment
   decides whether it was worth taking. */
const DROP_ORDER = ['capture_character', 'grade', 'imperfections', 'negative',
                    'composition', 'set', 'materials', 'moment', 'identity'];

const PROTECTED = ['subject', 'lighting_plot', 'consequences', 'camera'];

/* sections: [name, text] pairs. Returns {sections, log, overBudget}. */
function applyBudget(sections, budget) {
  const log = [];
  if (!budget) return { sections, log, overBudget: false };

  let kept = sections.slice();
  const length = () => kept.reduce((sum, [, t]) => sum + t.length, 0)
    + (kept.length - 1); /* newline joins */

  for (const name of DROP_ORDER) {
    if (length() <= budget) break;
    const at = kept.findIndex(([n]) => n === name);
    if (at === -1) continue;
    /* identity is protected in spirit: shed only if it is the last resort */
    if (name === 'identity') continue;
    const [, text] = kept[at];
    kept.splice(at, 1);
    log.push(`shed ${name} (-${text.length} chars)`);
  }

  const overBudget = length() > budget;
  if (overBudget) {
    log.push(`OVER BUDGET: ${length()} chars against ${budget}; the remaining `
      + `sections are protected (${[...PROTECTED, 'identity'].join(', ')}) and `
      + 'will not be cut');
  }
  return { sections: kept, log, overBudget };
}

const BUDGET = { applyBudget, DROP_ORDER, PROTECTED };
if (typeof module !== 'undefined') module.exports = BUDGET;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, BUDGET);
}

/* Prompt Machine — Hebrew to English on the way into the spec. The

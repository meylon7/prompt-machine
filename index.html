   interface is Hebrew and the prompt is English; whatever language the user
   thinks in, the spec and every file the form writes are English.

   The rules, in the order they earned their place:
   - longest phrase first: an entry spanning several words beats the word by
     word reading of the same text.
   - a word with an entry of its own is never re-read as a prefix and a stem
     (bread must not become "to warm").
   - the compound rule fires on evidence only: the second noun is on the
     constructs list, carrying the English it takes in that position.
   - a verb and its object look exactly like a compound from inside the rule
     and mean the opposite once reordered, so verbs never head a compound.
   - an adjective written after the noun moves in front of it, behind the
     article, and the article is repaired (a/an).
   - stopwords are dropped without being reported; an unknown word is named
     once and left out - a wrong English word would be acted on with
     confidence, a missing one is merely missing. */
'use strict';

const HEBREW_RE = /[֐-׿]/;
const FINAL_REPAIR = { 'מ': 'ם', 'נ': 'ן', 'כ': 'ך', 'פ': 'ף', 'צ': 'ץ' };
const PREFIXES = [
  ['וב', 'and in'], ['ול', 'and to'], ['ומ', 'and from'], ['וה', 'and the'],
  ['ב', 'in'], ['ל', 'to'], ['מ', 'from'], ['כ', 'like'],
  ['ש', 'that'], ['ו', 'and'], ['ה', 'the'],
];

function stripArticle(en) {
  return en.replace(/^(an?|the) /, '');
}
function articleOf(en) {
  const match = en.match(/^(an?|the) /);
  return match ? match[1] : null;
}
function fixArticle(article, nextWord) {
  if (article === 'the') return 'the';
  return /^[aeiou]/i.test(nextWord) ? 'an' : 'a';
}

function makeTranslator(lexicon) {
  const phrases = lexicon.phrases;
  const adjectives = new Set(lexicon.adjectives);
  const verbs = new Set(lexicon.verbs);
  const constructs = lexicon.constructs;
  const stopwords = new Set(lexicon.stopwords);

  /* exact entry, then a stripped feminine/plural suffix with the last
     letter put back into its final form */
  function lookupWord(word) {
    if (phrases[word] !== undefined) return { en: phrases[word], heb: word };
    for (const suffix of ['ה', 'ים', 'ות', 'ת']) {
      if (!word.endsWith(suffix) || word.length <= suffix.length + 1) continue;
      let stem = word.slice(0, -suffix.length);
      const last = stem.at(-1);
      if (FINAL_REPAIR[last]) stem = stem.slice(0, -1) + FINAL_REPAIR[last];
      if (phrases[stem] !== undefined) return { en: phrases[stem], heb: stem };
    }
    return null;
  }

  /* one Hebrew token -> {en, heb, definite, prep} or null */
  function resolveToken(word) {
    const direct = lookupWord(word);
    if (direct) return { ...direct, definite: false, prep: null };
    for (const [prefix, prepEn] of PREFIXES) {
      if (!word.startsWith(prefix) || word.length <= prefix.length + 1) continue;
      const rest = lookupWord(word.slice(prefix.length));
      if (!rest) continue;
      if (prefix === 'ה' || prefix === 'וה') {
        return {
          ...rest,
          definite: true,
          prep: prefix === 'וה' ? 'and' : null,
        };
      }
      return { ...rest, definite: false, prep: prepEn };
    }
    return null;
  }

  const EN_PREP = /^(on|in|at|by|beside|under|over|behind|near|with|from|to|of|and|inside|between|against|toward|towards|next to)$/;

  function classify(heb, en) {
    if (adjectives.has(heb)) return 'adj';
    if (verbs.has(heb)) return 'verb';
    if (EN_PREP.test(en)) return 'prep'; /* a preposition never heads a compound */
    return 'noun';
  }

  function translate(text) {
    if (!text || !HEBREW_RE.test(text)) return { text: text || '', unknown: [] };

    const rawTokens = text.split(/\s+/).filter(Boolean);
    const unknown = [];
    const reported = new Set();
    const items = []; /* {kind:'en'|'tok', ...} */

    let i = 0;
    while (i < rawTokens.length) {
      const raw = rawTokens[i];
      const core = raw.replace(/^["'(]+|[,.;:!?)"']+$/g, '');
      const tail = raw.match(/[,.;:!?]+$/) ? raw.match(/[,.;:!?]+$/)[0] : '';

      if (!HEBREW_RE.test(core)) { /* English survives untouched */
        items.push({ kind: 'en', text: raw });
        i += 1;
        continue;
      }

      /* longest phrase first, up to five words */
      let matched = false;
      for (let span = Math.min(5, rawTokens.length - i); span >= 2; span -= 1) {
        const windowTokens = rawTokens.slice(i, i + span)
          .map((t) => t.replace(/[,.;:!?]+$/g, ''));
        const key = windowTokens.join(' ');
        if (phrases[key] !== undefined) {
          const lastRaw = rawTokens[i + span - 1];
          const lastTail = lastRaw.match(/[,.;:!?]+$/);
          items.push({
            kind: 'phrase',
            text: phrases[key],
            tail: lastTail ? lastTail[0] : '',
          });
          i += span;
          matched = true;
          break;
        }
      }
      if (matched) continue;

      if (stopwords.has(core)) { i += 1; continue; }

      const resolved = resolveToken(core);
      if (!resolved) {
        if (!reported.has(core)) { reported.add(core); unknown.push(core); }
        i += 1;
        continue;
      }
      items.push({
        kind: 'tok',
        en: resolved.en,
        heb: resolved.heb,
        type: classify(resolved.heb, resolved.en),
        definite: resolved.definite,
        prep: resolved.prep,
        tail,
      });
      i += 1;
    }

    /* reorder: compounds and trailing adjectives */
    const out = [];
    let index = 0;
    while (index < items.length) {
      const item = items[index];
      if (item.kind === 'en') { out.push(item.text); index += 1; continue; }

      /* a Hebrew-sourced phrase behaves like a noun: a trailing adjective
         still moves in behind its article */
      if (item.kind === 'phrase') {
        const adjs = [];
        let k = index + 1;
        let lastTail = item.tail;
        while (!item.tail && k < items.length && items[k].kind === 'tok'
               && items[k].type === 'adj') {
          adjs.push(stripArticle(items[k].en));
          lastTail = items[k].tail;
          if (items[k].tail) { k += 1; break; }
          k += 1;
        }
        if (adjs.length) {
          /* the phrase may open with a preposition and an article; the
             adjective slides in behind both */
          const match = item.text.match(
            /^((?:in|on|to|from|and|like|that|of|by|with|at|inside|under|over|behind) )?((?:an?|the) )?([\s\S]*)$/);
          const prep = match[1] || '';
          const article = match[2] ? match[2].trim() : null;
          const rest = match[3];
          const words = [...adjs, rest];
          const lead = article ? `${fixArticle(article, words[0])} ` : '';
          out.push(prep + lead + words.join(' ') + (lastTail || ''));
          index = k;
        } else {
          out.push(item.text + (item.tail || ''));
          index += 1;
        }
        continue;
      }

      if (item.type === 'noun' && !item.tail) {
        const next = items[index + 1];
        /* compound: evidence is the constructs list, and a preposition on
           the second noun ends the compound */
        if (next && next.kind === 'tok' && next.type === 'noun' && !next.prep
            && constructs[next.heb] !== undefined) {
          const article = next.definite || item.definite
            ? 'the' : (articleOf(item.en) || '');
          const base = stripArticle(item.en);
          const constructEn = constructs[next.heb];
          /* an adjective after the pair describes the whole pair */
          const adjs = [];
          let k = index + 2;
          while (k < items.length && items[k].kind === 'tok'
                 && items[k].type === 'adj') {
            adjs.push(stripArticle(items[k].en));
            if (items[k].tail) { k += 1; break; }
            k += 1;
          }
          const words = [...adjs, constructEn, base];
          const lead = article ? `${fixArticle(article, words[0])} ` : '';
          const lastTail = items[k - 1].tail || next.tail || '';
          out.push(lead + words.join(' ') + lastTail);
          index = k > index + 2 ? k : index + 2;
          continue;
        }
        /* adjectives written after the noun move in front of it */
        if (next && next.kind === 'tok' && next.type === 'adj') {
          const adjs = [];
          let k = index + 1;
          let lastTail = '';
          while (k < items.length && items[k].kind === 'tok'
                 && items[k].type === 'adj') {
            adjs.push(stripArticle(items[k].en));
            lastTail = items[k].tail;
            if (items[k].tail) { k += 1; break; }
            k += 1;
          }
          const article = item.definite ? 'the' : articleOf(item.en);
          const base = stripArticle(item.en);
          const words = [...adjs, base];
          const lead = article ? `${fixArticle(article, words[0])} ` : '';
          const prep = item.prep ? `${item.prep} ` : '';
          out.push(prep + lead + words.join(' ') + lastTail);
          index = k;
          continue;
        }
      }

      /* plain token */
      let en = item.en;
      if (item.definite) en = `the ${stripArticle(en)}`;
      if (item.prep) en = `${item.prep} ${item.definite ? en : stripArticle(en) === en ? en : en}`;
      out.push(en + (item.tail || ''));
      index += 1;
    }

    return { text: out.join(' ').replace(/\s+([,.;:!?])/g, '$1'), unknown };
  }

  return translate;
}

/* convenience wrapper used by the UI */
function translateHe(text, lib) {
  if (!translateHe._fn || translateHe._lib !== lib) {
    translateHe._fn = makeTranslator(lib.lexicon_he);
    translateHe._lib = lib;
  }
  return translateHe._fn(text);
}

const TRANSLATE = { makeTranslator, translateHe };
if (typeof module !== 'undefined') module.exports = TRANSLATE;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, TRANSLATE);
}

/* Prompt Machine — the lighting sketch: the resolved rig from above, drawn
   to scale. Conventions are load bearing and match the original diagram:
   azimuth 0 is the camera axis, the camera sits at the bottom of the panel
   (toward the viewer), and camera left is screen left. If this ever mirrors,
   the control image contradicts the prompt.

   The sketch stands in for a blacked out studio, so it is the one place the
   interface is allowed to go fully dark. Roles are told apart by value:
   the key is the brightest thing in the frame, subtraction is nearly void. */
'use strict';

const ROLE_COLORS = {
  key: '#64D4FC',
  fill: '#44A888',
  bounce: '#3C9C80',
  rim: '#9898EC',
  kicker: '#9898EC',
  background: '#546078',
  practical: '#C9A96A',
  negative_fill: '#2A3346',
};

function sketchSVG(lights, roleLabels, options = {}) {
  const width = options.width || 460;
  const height = options.height || 300;
  const cx = width / 2;
  const cy = height / 2 - 10;

  if (!lights.length) {
    return `<svg viewBox="0 0 ${width} ${height}" class="sketch-svg">
      <text x="${cx}" y="${cy}" text-anchor="middle" class="sketch-empty">[lighting rig]</text>
    </svg>`;
  }

  const maxDistance = Math.max(...lights.map((l) => l.distance_cm || 100));
  const radius = Math.min(cx, cy) - 34;
  const scale = radius / (maxDistance * 1.1);

  const pos = (light) => {
    const rad = (light.azimuth_deg * Math.PI) / 180;
    const r = (light.distance_cm || 100) * scale;
    /* azimuth 0 -> toward the camera at the bottom; positive -> camera
       right, which is screen right when the camera looks at the subject
       from the bottom of the panel */
    return [cx + Math.sin(rad) * r, cy + Math.cos(rad) * r];
  };

  let parts = '';

  /* distance rings at round steps */
  const step = maxDistance > 250 ? 100 : 50;
  for (let d = step; d <= maxDistance * 1.05; d += step) {
    parts += `<circle cx="${cx}" cy="${cy}" r="${d * scale}" class="sketch-ring"/>`;
    parts += `<text x="${cx + 4}" y="${cy - d * scale - 3}" class="sketch-ring-label">${d}cm</text>`;
  }

  /* beams from each source toward the subject, then the sources */
  for (const light of lights) {
    const [x, y] = pos(light);
    const color = ROLE_COLORS[light.role] || '#98A2B3';
    const subtractive = light.modifier === 'negative_fill_black';
    parts += `<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${cx}" y2="${cy}"
      stroke="${color}" stroke-width="${light.role === 'key' ? 2 : 1.2}"
      stroke-opacity="${subtractive ? 0.25 : 0.55}"
      ${subtractive ? 'stroke-dasharray="3 4"' : ''}/>`;
  }
  for (const light of lights) {
    const [x, y] = pos(light);
    const color = ROLE_COLORS[light.role] || '#98A2B3';
    const r = light.role === 'key' ? 9 : 7;
    const size = light.size_cm ? Math.min(14, 5 + light.size_cm / 40) : r;
    parts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size}"
      fill="${color}" fill-opacity="0.92" stroke="#0A121F" stroke-width="2"/>`;
    if (light.role === 'key') {
      parts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size + 5}"
        fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1.5"/>`;
    }
    const label = roleLabels[light.role] || light.role;
    const meta = `${light.distance_cm}cm · ${light.elevation_deg}°`;
    const above = y < cy;
    const ty = above ? y - size - 16 : y + size + 14;
    parts += `<text x="${x.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle"
      class="sketch-label" fill="${color}">${label}</text>`;
    parts += `<text x="${x.toFixed(1)}" y="${(ty + (above ? -11 : 12)).toFixed(1)}"
      text-anchor="middle" class="sketch-meta">${meta}</text>`;
  }

  /* the subject, then the camera wedge on the axis */
  parts += `<circle cx="${cx}" cy="${cy}" r="7" fill="none"
    stroke="#E9EEF5" stroke-width="2"/>`;
  parts += `<text x="${cx}" y="${cy + 22}" text-anchor="middle" class="sketch-meta">subject</text>`;
  const camY = cy + radius + 18;
  parts += `<path d="M ${cx - 11} ${camY} h 22 v 12 h -22 z M ${cx - 5} ${camY} l 5 -7 l 5 7"
    fill="none" stroke="#98A2B3" stroke-width="1.6" stroke-linejoin="round"/>`;
  parts += `<line x1="${cx}" y1="${cy + 9}" x2="${cx}" y2="${camY - 9}"
    stroke="#98A2B3" stroke-width="1" stroke-dasharray="2 4" stroke-opacity="0.5"/>`;

  return `<svg viewBox="0 0 ${width} ${height + 26}" class="sketch-svg">${parts}</svg>`;
}

const SKETCH = { sketchSVG, ROLE_COLORS };
if (typeof module !== 'undefined') module.exports = SKETCH;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, SKETCH);
}

/* Prompt Machine — reading a reference photograph. Everything here is real
   photometry done in the browser on the pixels themselves: no model, no API,
   no upload. The image is read into memory, measured, and dropped; nothing
   about it is ever serialised into a spec, which is the standing rule.

   What can honestly be measured is measured (aspect, tonal distribution,
   colour cast, key to fill ratio in real stops, where the light sits,
   sharpness falloff, noise floor). What cannot be measured from pixels — who
   is in the picture, what the surfaces are made of — is not guessed at. The
   analysis fills the physics; the photographer still writes the picture.

   analyzePixels takes raw RGBA and stays free of the DOM, so the whole
   engine is testable in node against synthetic frames. */
'use strict';

const COMMON_RATIOS = [
  ['1:1', 1], ['5:4', 1.25], ['4:3', 4 / 3], ['3:2', 1.5],
  ['16:9', 16 / 9], ['2:1', 2],
  ['4:5', 0.8], ['3:4', 0.75], ['2:3', 2 / 3], ['9:16', 0.5625],
];

const RATIO_STOPS = [
  ['1:1', 0], ['2:1', 1], ['3:1', 1.585], ['4:1', 2],
  ['5:1', 2.322], ['6:1', 2.585], ['8:1', 3], ['16:1', 4],
];

function srgbToLinear(v) {
  const c = v / 255;
  return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
}

/* gamma-space luma for histograms and framing decisions */
const luma = (r, g, b) => 0.2126 * r + 0.7152 * g + 0.0722 * b;
/* linear luminance: the only correct basis for a ratio in stops */
const linear = (r, g, b) => 0.2126 * srgbToLinear(r)
  + 0.7152 * srgbToLinear(g) + 0.0722 * srgbToLinear(b);

function nearest(table, value) {
  let best = table[0];
  let bestGap = Infinity;
  for (const entry of table) {
    const gap = Math.abs(entry[1] - value);
    if (gap < bestGap) { bestGap = gap; best = entry; }
  }
  return best[0];
}

function percentile(hist, total, fraction) {
  let seen = 0;
  const target = total * fraction;
  for (let i = 0; i < hist.length; i += 1) {
    seen += hist[i];
    if (seen >= target) return i;
  }
  return 255;
}

function rgbToHsl(r, g, b) {
  const rn = r / 255; const gn = g / 255; const bn = b / 255;
  const max = Math.max(rn, gn, bn); const min = Math.min(rn, gn, bn);
  const l = (max + min) / 2;
  const d = max - min;
  if (!d) return [0, 0, l * 100];
  const s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
  let h;
  if (max === rn) h = ((gn - bn) / d + (gn < bn ? 6 : 0));
  else if (max === gn) h = (bn - rn) / d + 2;
  else h = (rn - gn) / d + 4;
  return [h * 60, s * 100, l * 100];
}

const HUE_NAMES = [
  [15, 'אדום'], [40, 'כתום'], [65, 'צהוב'], [160, 'ירוק'],
  [200, 'טורקיז'], [250, 'כחול'], [290, 'סגול'], [345, 'ורוד'], [361, 'אדום'],
];

function colourNameHe(r, g, b) {
  const [h, s, l] = rgbToHsl(r, g, b);
  if (l < 12) return 'שחור';
  if (l > 92 && s < 12) return 'לבן';
  if (s < 12) return l > 55 ? 'אפור בהיר' : 'אפור כהה';
  let name = 'אדום';
  for (const [limit, label] of HUE_NAMES) {
    if (h < limit) { name = label; break; }
  }
  const shade = l < 32 ? 'כהה' : (l > 72 ? 'בהיר' : '');
  const muted = s < 30 ? 'עמום' : '';
  return [name, shade, muted].filter(Boolean).join(' ');
}

const hex = (r, g, b) => '#' + [r, g, b]
  .map((v) => Math.round(v).toString(16).padStart(2, '0')).join('');

/* ---------------------------------------------------------------------- */

function analyzePixels(data, width, height) {
  const count = width * height;
  if (!count) return null;

  const hist = new Array(256).fill(0);
  const gray = new Float32Array(count);
  const lin = new Float32Array(count);

  let sumR = 0; let sumG = 0; let sumB = 0;
  let sumSat = 0;
  let hiR = 0; let hiB = 0; let hiN = 0;
  const bucket = new Map(); /* 5 bits per channel, for the palette */

  for (let i = 0, p = 0; i < count; i += 1, p += 4) {
    const r = data[p]; const g = data[p + 1]; const b = data[p + 2];
    const y = luma(r, g, b);
    gray[i] = y;
    lin[i] = linear(r, g, b);
    hist[Math.min(255, Math.max(0, Math.round(y)))] += 1;
    sumR += r; sumG += g; sumB += b;
    const max = Math.max(r, g, b); const min = Math.min(r, g, b);
    sumSat += max ? (max - min) / max : 0;
    /* the light's own colour lives in the upper midtones, not in the paint */
    if (y > 140 && y < 250) { hiR += r; hiB += b; hiN += 1; }
    const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
    bucket.set(key, (bucket.get(key) || 0) + 1);
  }

  /* ---- exposure and tonal shape ---- */
  const meanLuma = (0.2126 * sumR + 0.7152 * sumG + 0.0722 * sumB) / count;
  const p1 = percentile(hist, count, 0.01);
  const p5 = percentile(hist, count, 0.05);
  const p50 = percentile(hist, count, 0.5);
  const p95 = percentile(hist, count, 0.95);
  const clippedBlack = (hist[0] + hist[1]) / count;
  const clippedWhite = (hist[254] + hist[255]) / count;

  let variance = 0;
  for (let i = 0; i < count; i += 1) variance += (gray[i] - meanLuma) ** 2;
  const std = Math.sqrt(variance / count);

  let blackPoint;
  if (clippedBlack > 0.02 && p5 < 12) blackPoint = 'crushed';
  else if (p1 > 24) blackPoint = 'lifted_charcoal';
  else blackPoint = 'true_black';

  const key = meanLuma < 78 ? 'low' : (meanLuma > 168 ? 'high' : 'normal');

  /* mid-tone mass separates a soft source from a hard one: hard light
     empties the middle of the histogram and piles both ends */
  let mids = 0;
  for (let i = 64; i < 192; i += 1) mids += hist[i];
  const midMass = mids / count;
  const quality = midMass > 0.62 ? 'soft' : (midMass < 0.42 ? 'hard' : 'medium');

  /* ---- where the light sits: the luminance centroid of the subject area -- */
  const x0 = Math.floor(width * 0.2); const x1 = Math.ceil(width * 0.8);
  const y0 = Math.floor(height * 0.15); const y1 = Math.ceil(height * 0.85);
  let wsum = 0; let wx = 0; let wy = 0;
  let leftLin = 0; let leftN = 0; let rightLin = 0; let rightN = 0;
  const midX = (x0 + x1) / 2;
  for (let y = y0; y < y1; y += 1) {
    for (let x = x0; x < x1; x += 1) {
      const i = y * width + x;
      const w = gray[i];
      wsum += w; wx += w * x; wy += w * y;
      if (x < midX) { leftLin += lin[i]; leftN += 1; }
      else { rightLin += lin[i]; rightN += 1; }
    }
  }
  const regionW = x1 - x0; const regionH = y1 - y0;
  const shiftX = wsum ? ((wx / wsum) - midX) / (regionW / 2) : 0;
  const shiftY = wsum ? ((wy / wsum) - (y0 + y1) / 2) / (regionH / 2) : 0;

  /* screen-left is camera-left, and the project's azimuth runs positive to
     camera right, so a brighter left side is a negative azimuth */
  const azimuth = Math.round(Math.max(-120, Math.min(120, (shiftX / 0.22) * 90)));
  const elevation = Math.round(Math.max(-40, Math.min(80, (-shiftY / 0.25) * 55)));
  const dirConfidence = Math.min(1, Math.abs(shiftX) / 0.10);
  const elevConfidence = Math.min(1, Math.abs(shiftY) / 0.10);

  /* ---- key to fill, in real stops, from linear luminance ---- */
  const leftMean = leftN ? leftLin / leftN : 0;
  const rightMean = rightN ? rightLin / rightN : 0;
  const bright = Math.max(leftMean, rightMean);
  const dark = Math.min(leftMean, rightMean);
  const stops = (bright > 0 && dark > 0)
    ? Math.max(0, Math.min(5, Math.log2(bright / Math.max(dark, 1e-5)))) : 0;
  const ratio = nearest(RATIO_STOPS, stops);

  /* ---- colour cast: red against blue in the light's own tones ---- */
  const warmth = hiN ? (hiR / hiN) / Math.max(1, hiB / hiN) : 1;
  let cast = 'neutral';
  if (warmth > 1.12) cast = 'warm';
  else if (warmth < 0.92) cast = 'cool';
  const kelvin = Math.round(
    Math.max(2600, Math.min(9000, 5500 / Math.pow(warmth, 1.7))) / 100) * 100;

  /* ---- sharpness: centre against the edges, which is depth of field ---- */
  const sharpness = (ax0, ay0, ax1, ay1) => {
    let sum = 0; let n = 0;
    for (let y = ay0 + 1; y < ay1 - 1; y += 2) {
      for (let x = ax0 + 1; x < ax1 - 1; x += 2) {
        const i = y * width + x;
        const gx = gray[i + 1] - gray[i - 1];
        const gy = gray[i + width] - gray[i - width];
        sum += Math.sqrt(gx * gx + gy * gy); n += 1;
      }
    }
    return n ? sum / n : 0;
  };
  const centreSharp = sharpness(Math.floor(width * 0.3), Math.floor(height * 0.3),
    Math.ceil(width * 0.7), Math.ceil(height * 0.7));
  const edgeSharp = (
    sharpness(0, 0, width, Math.floor(height * 0.18))
    + sharpness(0, Math.ceil(height * 0.82), width, height)) / 2;
  const focusRatio = edgeSharp > 0.01 ? centreSharp / edgeSharp : 1;
  const depth = focusRatio > 2.2 ? 'shallow'
    : (focusRatio < 1.25 ? 'deep' : 'medium');

  /* ---- noise floor: the quietest tiles carry the grain ---- */
  const tiles = [];
  const step = Math.max(8, Math.floor(Math.min(width, height) / 12));
  for (let ty = 0; ty + step < height; ty += step) {
    for (let tx = 0; tx + step < width; tx += step) {
      let m = 0; let n = 0;
      for (let y = ty; y < ty + step; y += 1) {
        for (let x = tx; x < tx + step; x += 1) { m += gray[y * width + x]; n += 1; }
      }
      m /= n;
      let v = 0;
      for (let y = ty; y < ty + step; y += 1) {
        for (let x = tx; x < tx + step; x += 1) {
          v += (gray[y * width + x] - m) ** 2;
        }
      }
      tiles.push(Math.sqrt(v / n));
    }
  }
  tiles.sort((a, b) => a - b);
  const noise = tiles.length ? tiles[Math.floor(tiles.length * 0.15)] : 0;
  const grain = noise > 6 ? 'heavy' : (noise > 2.6 ? 'visible' : 'clean');

  /* ---- palette ---- */
  const top = [...bucket.entries()].sort((a, b) => b[1] - a[1]).slice(0, 24);
  const palette = [];
  for (const [code, n] of top) {
    const r = ((code >> 10) & 31) * 8 + 4;
    const g = ((code >> 5) & 31) * 8 + 4;
    const b = (code & 31) * 8 + 4;
    const near = palette.find((c) => Math.abs(c.r - r) + Math.abs(c.g - g)
      + Math.abs(c.b - b) < 60);
    if (near) { near.share += n / count; continue; }
    palette.push({ r, g, b, share: n / count });
    if (palette.length === 5) break;
  }

  return {
    aspect: {
      width, height,
      value: width / height,
      nearest: nearest(COMMON_RATIOS, width / height),
      orientation: width > height * 1.02 ? 'landscape'
        : (height > width * 1.02 ? 'portrait' : 'square'),
    },
    exposure: {
      mean: Math.round(meanLuma), key,
      clipped_white_pct: +(clippedWhite * 100).toFixed(1),
      clipped_black_pct: +(clippedBlack * 100).toFixed(1),
    },
    tone: {
      std: +std.toFixed(1), p1, p5, p50, p95,
      black_point: blackPoint,
      spread: p95 - p5,
    },
    light: {
      azimuth_deg: azimuth,
      elevation_deg: elevation,
      ratio,
      stops: +stops.toFixed(2),
      quality,
      mid_mass: +midMass.toFixed(2),
      direction_confidence: +dirConfidence.toFixed(2),
      elevation_confidence: +elevConfidence.toFixed(2),
      side: azimuth < -6 ? 'camera_left' : (azimuth > 6 ? 'camera_right' : 'frontal'),
    },
    colour: {
      cast, warmth: +warmth.toFixed(3), kelvin,
      saturation: +(sumSat / count * 100).toFixed(1),
      palette: palette.map((c) => ({
        hex: hex(c.r, c.g, c.b),
        name: colourNameHe(c.r, c.g, c.b),
        share: +(c.share * 100).toFixed(1),
      })),
    },
    focus: {
      centre: +centreSharp.toFixed(2),
      edge: +edgeSharp.toFixed(2),
      ratio: +focusRatio.toFixed(2),
      depth,
    },
    grain: { noise: +noise.toFixed(2), level: grain },
  };
}

/* ---------------------------------------------------------------------- */
/* Turning measurements into spec values. Nothing is applied on its own:
   each entry is an offer the photographer accepts or ignores, which is the
   same rule as everywhere else in the tool. */

const SATURATION_TEXT = (s) => (s < 12
  ? 'near monochrome, colour barely present'
  : (s < 26 ? 'restrained, colour held well back'
    : (s < 45 ? 'natural, colour present without shouting'
      : 'strong colour, the palette carrying the frame')));

const CONTRAST_TEXT = (report) => {
  const { std, spread } = report.tone;
  if (spread > 215 && std > 62) {
    return 'steep, the tones running the full scale with short shoulders';
  }
  if (std > 48) return 'firm S curve, midtones separated, highlights rolling off';
  if (std < 28) return 'flat and low contrast, the scale held in the midtones';
  return 'gentle S, shadows open and highlights held short of clipping';
};

const GRAIN_LEVEL = { clean: 'clean_commercial', visible: 'editorial', heavy: 'documentary' };

function suggestSpec(report, lib) {
  const out = [];
  const add = (path, value, label, detail, confidence) => out.push(
    { path, value, label, detail, confidence });

  add('camera.aspect_ratio', report.aspect.nearest, 'יחס תמונה',
    `נמדד ${report.aspect.width}x${report.aspect.height} פיקסל`, 1);

  add('grade.black_point', report.tone.black_point, 'נקודת שחור',
    `האחוזון התחתון על ${report.tone.p1}, ` +
    `${report.exposure.clipped_black_pct}% מהפיקסלים בשחור מלא`, 0.9);

  add('grade.contrast_curve', CONTRAST_TEXT(report), 'עקומת קונטרסט',
    `סטיית תקן ${report.tone.std}, טווח ${report.tone.spread} רמות`, 0.75);

  add('grade.saturation', SATURATION_TEXT(report.colour.saturation), 'רוויה',
    `רוויה ממוצעת ${report.colour.saturation}%`, 0.8);

  if (report.colour.cast !== 'neutral') {
    add('grade.white_balance_k', report.colour.kelvin, 'טמפרטורת צבע',
      `נטייה ${report.colour.cast === 'warm' ? 'חמה' : 'קרה'} ` +
      `ביחס אדום לכחול של ${report.colour.warmth}`, 0.6);
  }

  /* paths are the form's authoring shape: that form is the only consumer */
  add('realism.level', GRAIN_LEVEL[report.grain.level] || 'editorial', 'רמת ריאליזם',
    `רעש ברצפת התמונה ${report.grain.noise}, ${
      { clean: 'נקי', visible: 'גריין נראה', heavy: 'גריין כבד' }[report.grain.level]}`,
    0.55);

  add('rig.ratio', report.light.ratio, 'יחס מפתח למילוי',
    `${report.light.stops} סטופים בין הצד המואר לצד הצל, נמדד באור ליניארי`,
    0.7);

  /* the closest rig in the library, scored on what was actually measured */
  const wanted = report.light;
  let bestKey = null; let bestScore = Infinity;
  for (const [presetKey, preset] of Object.entries(lib.lighting)) {
    if (presetKey.startsWith('_') || !preset.lights) continue;
    const keyLight = preset.lights.find((l) => l.role === 'key');
    if (!keyLight) continue;
    const stopsOf = (text) => {
      const entry = RATIO_STOPS.find(([name]) => name === text);
      return entry ? entry[1] : 2;
    };
    const dAz = Math.abs(Math.abs(keyLight.azimuth_deg) - Math.abs(wanted.azimuth_deg)) / 90;
    const dSide = (keyLight.azimuth_deg < 0) === (wanted.azimuth_deg < 0) ? 0 : 0.25;
    const dEl = Math.abs((keyLight.elevation_deg || 0) - wanted.elevation_deg) / 60;
    const dRatio = Math.abs(stopsOf(preset.key_to_fill_ratio) - wanted.stops) / 3;
    const score = dAz + dSide + dEl * 0.8 + dRatio;
    if (score < bestScore) { bestScore = score; bestKey = presetKey; }
  }
  if (bestKey) {
    const sideHe = { camera_left: 'משמאל למצלמה', camera_right: 'מימין למצלמה',
                     frontal: 'חזיתי' }[wanted.side];
    add('rig.preset', bestKey, 'ריג קרוב מהספרייה',
      `${lib.lighting[bestKey].label}. נמדד אור ${sideHe}, ` +
      `אזימוט ${wanted.azimuth_deg}°, גובה ${wanted.elevation_deg}°, ` +
      `${wanted.quality === 'soft' ? 'רך' : (wanted.quality === 'hard' ? 'קשה' : 'בינוני')}`,
      Math.min(0.65, wanted.direction_confidence));
  }

  return out;
}

const REFERENCE = { analyzePixels, suggestSpec, colourNameHe, COMMON_RATIOS, RATIO_STOPS };
if (typeof module !== 'undefined') module.exports = REFERENCE;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, REFERENCE);
}

/* Prompt Machine — the shared output pane: dialect tabs, validation pill,
   live prompt, meta chips, copy. Used by the quick path and the pro form so
   the two can never drift apart in behaviour. */
'use strict';

/* which editor group a placeholder or a validation message belongs to, so
   both can be links that lead to the relevant fields */
const GROUP_KEYWORDS = [
  ['moment', 'moment'],
  ['materials', 'material'],
  ['rig', 'lighting rig'], ['rig', 'key to fill'], ['rig', 'ambient'],
  ['rig', 'rig '], ['rig', '[ratio]'],
  ['camera', 'camera'], ['camera', 'focal'], ['camera', 'aperture'],
  ['camera', 'shutter'], ['camera', 'iso'], ['camera', 'distance'],
  ['camera', 'focus point'], ['camera', 'aspect'], ['camera', 'depth of field'],
  ['grade', 'grade'], ['grade', 'black point'], ['grade', 'contrast'],
  ['grade', 'saturation'], ['grade', 'retouch'], ['grade', 'realism'],
  ['set', 'background'], ['set', 'surface'], ['set', 'layout'],
  ['set', 'placement'], ['set', 'negative space'], ['set', 'horizon'],
  ['set', 'set '], ['set', 'composition'],
  ['negative', 'negative'],
  ['basis', 'subject'], ['basis', 'styling'], ['basis', 'genre'],
  ['basis', 'identity'],
];

function resolveGroup(text) {
  const lower = text.toLowerCase();
  for (const [group, keyword] of GROUP_KEYWORDS) {
    if (lower.includes(keyword)) return group;
  }
  return null;
}

function createOutputPane(lib, getSpec, options = {}) {
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const root = el('aside', 'quick-output panel');

  const header = el('div', 'panel-header');
  header.append(el('span', 'panel-title', 'הפרומפט'));
  const statusPill = el('span', 'status-pill');
  header.append(statusPill);
  root.append(header);

  const dialectTabs = el('div', 'tabs dialect-tabs');
  const DIALECTS = [
    ['nano', 'Nano Banana'], ['gpt', 'GPT Image'],
    ['flux', 'FLUX'], ['midjourney', 'Midjourney'],
  ];
  let activeDialect = 'nano';
  for (const [key, label] of DIALECTS) {
    const tab = el('button', 'tab', label);
    tab.dataset.dialect = key;
    tab.addEventListener('click', () => { activeDialect = key; render(); });
    dialectTabs.append(tab);
  }
  root.append(dialectTabs);

  const metaRow = el('div', 'meta-row');
  const chipChars = el('span', 'chip-meta');
  const chipDof = el('span', 'chip-meta');
  metaRow.append(chipChars, chipDof);
  root.append(metaRow);

  const promptBox = el('pre', 'prompt-box mono');
  root.append(promptBox);

  const noteBox = el('div', 'note-box');
  root.append(noteBox);

  const buttonRow = el('div', 'button-row');
  root.append(buttonRow);

  const copyBtn = el('button', 'btn-run', 'העתקת הפרומפט');
  copyBtn.addEventListener('click', async () => {
    const text = promptBox.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.append(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    copyBtn.textContent = 'הועתק ✓';
    setTimeout(() => { copyBtn.textContent = 'העתקת הפרומפט'; }, 1400);
  });
  buttonRow.append(copyBtn);

  for (const extra of options.extraButtons || []) {
    const btn = el('button', 'btn-ghost', extra.label);
    btn.addEventListener('click', extra.onClick);
    buttonRow.append(btn);
  }

  const escapeHtml = (text) => text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function render() {
    const spec = getSpec();
    const PM = globalThis.PM;
    const report = PM.validate(spec, lib);

    for (const tab of dialectTabs.children) {
      tab.className = 'tab '
        + (tab.dataset.dialect === activeDialect ? 'active' : 'inactive');
    }

    const budget = options.getBudget ? options.getBudget() : null;
    let prompt;
    let shedLog = [];
    if (budget && (activeDialect === 'nano' || activeDialect === 'gpt')) {
      const normalized = PM.normalizeSpec(spec);
      const ir = PM.buildIR(normalized, lib);
      const sections = PM.proseSections(ir);
      const result = PM.applyBudget(sections, budget);
      shedLog = result.log;
      prompt = result.sections.map(([, text]) => text).join('\n');
      if (activeDialect === 'gpt') {
        const lines = [PM.GPT_PREAMBLE];
        if (normalized.identity) lines.push(PM.GPT_IDENTITY_PREAMBLE);
        prompt = `${lines.join('\n')}\n${prompt}`;
      }
    } else {
      prompt = PM.compile(spec, lib, activeDialect);
    }

    /* placeholders stay visible and highlighted until the user decides;
       with a navigator attached they are links to the relevant fields */
    const placeholders = prompt.match(/\[[^\]\n]{1,60}\]/g) || [];
    promptBox.innerHTML = escapeHtml(prompt)
      .replace(/\[[^\]\n]{1,60}\]/g, (m) => `<span class="ph">${m}</span>`);
    if (options.onNavigate) {
      for (const span of promptBox.querySelectorAll('.ph')) {
        const group = resolveGroup(span.textContent);
        if (!group) continue;
        span.classList.add('ph-link');
        span.addEventListener('click', () => options.onNavigate(group));
      }
    }
    chipChars.textContent = `${prompt.length.toLocaleString('en')} CHARS`;

    const normalized = PM.normalizeSpec(spec);
    const dof = PM.depthOfField(normalized.camera);
    chipDof.textContent = dof
      ? (dof.far_cm === null ? `DOF ${dof.near_cm}cm - INF`
                             : `DOF ${dof.total_cm}cm SHARP`)
      : 'DOF -';

    if (report.errors.length && !placeholders.length) {
      statusPill.textContent = `${report.errors.length} שגיאות`;
      statusPill.className = 'status-pill error';
    } else if (placeholders.length) {
      statusPill.textContent = `${placeholders.length} ממלאי מקום`;
      statusPill.className = 'status-pill warn';
    } else if (report.warnings.length) {
      statusPill.textContent = `${report.warnings.length} אזהרות`;
      statusPill.className = 'status-pill warn';
    } else {
      statusPill.textContent = 'מוכן להעתקה';
      statusPill.className = 'status-pill ok';
    }

    /* every note is a link to the fields it talks about */
    noteBox.innerHTML = '';
    const notes = [
      ...(placeholders.length
        ? [`ממתין להחלטה: ${placeholders.length} שדות מסומנים [כך] בפרומפט`] : []),
      ...report.errors,
      ...report.warnings,
      ...shedLog,
    ];
    for (const note of notes) {
      const group = options.onNavigate ? resolveGroup(note) : null;
      const item = document.createElement(group ? 'button' : 'span');
      item.className = 'note-item' + (group ? ' note-link' : '');
      item.textContent = note;
      if (group) item.addEventListener('click', () => options.onNavigate(group));
      noteBox.append(item);
    }
  }

  return { root, render, get activeDialect() { return activeDialect; } };
}

/* a professional explanation of a pane, collapsed until asked for, so it
   never takes space in advance */
function explainToggle(entries) {
  const items = (entries || []).filter(Boolean);
  if (!items.length) return null;
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const wrap = el('div', 'explain');
  const btn = el('button', 'explain-toggle', 'מה החלון הזה ולמה הוא משמש?');
  const panel = el('div', 'explain-panel');
  panel.hidden = true;
  for (const entry of items) {
    if (entry.what) panel.append(el('p', 'explain-what', entry.what));
    if (entry.do) panel.append(el('p', 'explain-do', entry.do));
    if (entry.why) panel.append(el('p', 'explain-why', entry.why));
  }
  btn.addEventListener('click', () => {
    panel.hidden = !panel.hidden;
    btn.classList.toggle('open', !panel.hidden);
  });
  wrap.append(btn, panel);
  return wrap;
}

/* ------------------------------------------------------------- popover -- */

/* One styled popover for the whole system, replacing the browser tooltip.
   Opens centred below the trigger, flips above when there is no room, and
   clamps to the viewport; sides as a last resort. */
let popoverNode = null;
let popoverOwner = null;

function ensurePopover() {
  if (popoverNode) return popoverNode;
  popoverNode = document.createElement('div');
  popoverNode.className = 'popover';
  popoverNode.hidden = true;
  document.body.append(popoverNode);
  window.addEventListener('scroll', hidePopover, true);
  window.addEventListener('resize', hidePopover);
  document.addEventListener('click', (event) => {
    if (popoverOwner && !popoverOwner.contains(event.target)
        && !popoverNode.contains(event.target)) hidePopover();
  });
  return popoverNode;
}

function hidePopover() {
  if (popoverNode) popoverNode.hidden = true;
  popoverOwner = null;
}

function showPopover(trigger, content) {
  const node = ensurePopover();
  node.innerHTML = '';
  if (content.title) {
    const title = document.createElement('div');
    title.className = 'popover-title';
    title.textContent = content.title;
    node.append(title);
  }
  for (const line of content.lines || []) {
    if (!line) continue;
    const p = document.createElement('p');
    p.className = 'popover-line'
      + (line.mono ? ' mono' : '') + (line.strong ? ' strong' : '');
    p.textContent = line.text || line;
    node.append(p);
  }
  node.hidden = false;
  node.dataset.side = 'bottom';

  const rect = trigger.getBoundingClientRect();
  const gap = 10;
  const { offsetWidth: w, offsetHeight: h } = node;
  const vw = window.innerWidth;
  const vh = window.innerHeight;

  let side = 'bottom';
  if (rect.bottom + gap + h <= vh) side = 'bottom';
  else if (rect.top - gap - h >= 0) side = 'top';
  else side = (rect.left > vw - rect.right) ? 'left' : 'right';

  let left;
  let top;
  if (side === 'bottom' || side === 'top') {
    left = rect.left + rect.width / 2 - w / 2;
    top = side === 'bottom' ? rect.bottom + gap : rect.top - gap - h;
  } else {
    top = Math.min(Math.max(8, rect.top + rect.height / 2 - h / 2), vh - h - 8);
    left = side === 'left' ? rect.left - gap - w : rect.right + gap;
  }
  left = Math.min(Math.max(8, left), vw - w - 8);
  node.style.left = `${left}px`;
  node.style.top = `${top}px`;
  node.dataset.side = side;
  /* the caret points back at the trigger centre */
  const caretX = rect.left + rect.width / 2 - left;
  const caretY = rect.top + rect.height / 2 - top;
  node.style.setProperty('--caret-x', `${Math.min(Math.max(14, caretX), w - 14)}px`);
  node.style.setProperty('--caret-y', `${Math.min(Math.max(14, caretY), h - 14)}px`);
  popoverOwner = trigger;
}

/* content: {title, lines:[string|{text,mono,strong}]}. A click always opens
   rather than toggling: hover has already opened it, and a click that then
   closes reads as a click that did nothing. */
function attachPopover(trigger, content, opts = {}) {
  trigger.classList.add('has-popover');
  const open = () => showPopover(trigger, content);
  trigger.addEventListener('mouseenter', open);
  trigger.addEventListener('mouseleave', () => {
    if (popoverOwner === trigger) hidePopover();
  });
  trigger.addEventListener('focus', open);
  trigger.addEventListener('blur', () => {
    if (popoverOwner === trigger) hidePopover();
  });
  if (opts.openOnClick !== false) {
    trigger.addEventListener('click', (event) => {
      event.preventDefault();
      open();
    });
  }
}

const OUTPUT = { createOutputPane, explainToggle, attachPopover, hidePopover };
if (typeof module !== 'undefined') module.exports = OUTPUT;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, OUTPUT);
}

/* Prompt Machine — the quick path. Six questions, each answered from an
   authored option list, composed into a complete spec by deep merge in a
   fixed order: subject, environment, mood, moment, aspect ratio. Mood wins
   over environment on purpose: the environment may move the shot outdoors,
   the mood then decides how it is lit.

   Every axis offers every recipe's options - the home options lead, the rest
   follow with their origin named. A crossed choice is answered with what it
   produces (the depth of field is printed beside the prompt), never blocked. */
'use strict';

/* ------------------------------------------------------------- compose -- */

/* Deep merge: objects merge recursively, arrays and scalars replace.
   Replacing arrays is load bearing: concatenating would let a studio
   material follow the subject outdoors. Never mutates its inputs. */
function deepMerge(base, patch) {
  if (Array.isArray(patch) || typeof patch !== 'object' || patch === null) {
    return patch;
  }
  const out = { ...base };
  for (const [key, value] of Object.entries(patch)) {
    out[key] = (base && typeof base[key] === 'object' && !Array.isArray(base[key]))
      ? deepMerge(base[key], value)
      : deepMerge(undefined, value);
  }
  return out;
}

/* choices: {subject, environment, mood, moment, aspect} - each an option
   object carrying .patch (moment/aspect may be null), plus optional
   typedSubject that replaces the subject sentence and nothing else. */
function compose(quickLib, recipeKey, choices) {
  const recipe = quickLib.recipes[recipeKey];
  let spec = JSON.parse(JSON.stringify(recipe.base));
  if (choices.subject) spec = deepMerge(spec, choices.subject.patch);
  if (choices.environment) spec = deepMerge(spec, choices.environment.patch);
  if (choices.mood) spec = deepMerge(spec, choices.mood.patch);
  if (choices.moment) spec = deepMerge(spec, choices.moment.patch);
  if (choices.aspect) {
    spec = deepMerge(spec, { camera: { aspect_ratio: choices.aspect.value } });
  }
  if (choices.typedSubject) {
    spec = deepMerge(spec, { subject: { primary: choices.typedSubject } });
  }
  /* free text on the other questions: the environment describes the set,
     words about atmosphere write into the grade and never move a light,
     a typed moment is the action of the body */
  if (choices.typedEnvironment) {
    spec = deepMerge(spec, { set: { background: choices.typedEnvironment } });
  }
  if (choices.typedMood) {
    spec = deepMerge(spec, { grade: { look: choices.typedMood } });
  }
  if (choices.typedMoment) {
    spec = deepMerge(spec, { moment: {
      ...(spec.moment || {}), action: choices.typedMoment,
    } });
  }
  return spec;
}

/* Option list for one axis: the chosen recipe's own options lead, every
   other recipe's follow, tagged with where they came from. */
function axisOptions(quickLib, recipeKey, axis) {
  const own = (quickLib.recipes[recipeKey][axis] || [])
    .map((option) => ({ ...option, origin: null }));
  const crossed = [];
  for (const key of quickLib._order) {
    if (key === recipeKey) continue;
    for (const option of quickLib.recipes[key][axis] || []) {
      crossed.push({ ...option, origin: quickLib.recipes[key].label });
    }
  }
  return [...own, ...crossed];
}

/* Moments are the one axis that is shared by design: they describe a body,
   never an occupation. Home moments first, the rest after. */
function momentOptions(quickLib, recipeKey) {
  const home = quickLib._moments.filter((m) => m.home === recipeKey);
  const away = quickLib._moments.filter((m) => m.home !== recipeKey)
    .map((m) => ({ ...m, origin: quickLib.recipes[m.home].label }));
  return [...home, ...away];
}

/* ------------------------------------------------------------------ UI -- */

const HEBREW = /[֐-׿]/;

function initQuick(root, lib, hooks = {}) {
  const quick = lib.quick_he;
  /* nothing preselected: the recipe base is the authored starting point,
     every further answer is the user's own decision */
  const state = {
    recipe: quick._order[0],
    subject: null, environment: null, mood: null, moment: null, aspect: null,
    typedSubject: '', typedEnvironment: '', typedMood: '', typedMoment: '',
    expanded: { subject: false, environment: false, mood: false, moment: false },
  };

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  function typedEnglish(stateKey) {
    const raw = state[stateKey];
    if (!raw) return { text: '', unknown: [] };
    return globalThis.PM.translateHe(raw, lib);
  }

  function currentSpec() {
    const pick = (axis, index) =>
      index === null ? null : axisOptions(quick, state.recipe, axis)[index];
    const choices = {
      subject: pick('subjects', state.subject),
      environment: pick('environments', state.environment),
      mood: pick('moods', state.mood),
      moment: state.moment === null
        ? null : momentOptions(quick, state.recipe)[state.moment],
      aspect: state.aspect === null ? null : quick._aspects[state.aspect],
      typedSubject: typedEnglish('typedSubject').text,
      typedEnvironment: typedEnglish('typedEnvironment').text,
      typedMood: typedEnglish('typedMood').text,
      typedMoment: typedEnglish('typedMoment').text,
    };
    return compose(quick, state.recipe, choices);
  }

  root.innerHTML = '';
  const layout = el('div', 'quick-layout');
  const questions = el('section', 'quick-questions');
  const QUICK_NAV_STEP = {
    basis: 1, set: 2, rig: 3, grade: 3, moment: 4, camera: 5, materials: 1,
  };
  const pane = globalThis.PM.createOutputPane(lib, currentSpec, {
    onNavigate: (group) => {
      if (QUICK_NAV_STEP[group] !== undefined) {
        activeStep = QUICK_NAV_STEP[group];
        render();
      }
    },
    extraButtons: hooks.openInPro ? [{
      label: 'עריכה מתקדמת',
      onClick: () => hooks.openInPro(currentSpec()),
    }] : [],
  });
  layout.append(questions, pane.root);
  root.append(layout);

  /* ---- questions: one step visible at a time, never one long scroll ---- */
  let activeStep = 0;
  const stepBar = el('div', 'step-tabs');
  questions.append(stepBar);

  const makePane = () => {
    const stepPane = el('div', 'step-pane');
    questions.append(stepPane);
    return stepPane;
  };

  /* free text with live translation, one per question where it makes sense */
  const freeTexts = [];
  function freeTextRow(pane, stateKey, placeholder) {
    const input = el('input', 'free-text');
    input.placeholder = placeholder;
    input.addEventListener('input', () => {
      state[stateKey] = input.value.trim();
      render();
    });
    const note = el('div', 'field-note');
    pane.append(input, note);
    freeTexts.push({ input, note, stateKey });
  }

  const explainFor = (key, pane) => {
    const entry = (lib.help_he._quick || {})[key];
    const toggle = globalThis.PM.explainToggle([entry]);
    if (toggle) pane.append(toggle);
  };

  const recipePane = makePane();
  explainFor('recipe', recipePane);
  const recipeGrid = el('div', 'tile-grid recipe-grid');
  recipePane.append(recipeGrid);

  const subjectPane = makePane();
  explainFor('subject', subjectPane);
  freeTextRow(subjectPane, 'typedSubject',
    'תאר נושא במילים שלך, בעברית או באנגלית, או בחר מהאריחים…');
  const subjectGrid = el('div', 'tile-grid option-grid');
  subjectPane.append(subjectGrid);

  const envPane = makePane();
  explainFor('environment', envPane);
  freeTextRow(envPane, 'typedEnvironment',
    'תאר סביבה במילים שלך, בעברית או באנגלית, או בחר מהאריחים…');
  const envGrid = el('div', 'tile-grid option-grid');
  envPane.append(envGrid);

  const moodPane = makePane();
  explainFor('mood', moodPane);
  freeTextRow(moodPane, 'typedMood',
    'תאר אווירה במילים שלך: היא תיכנס לגרייד, לא תזיז אור…');
  const moodGrid = el('div', 'tile-grid option-grid');
  moodPane.append(moodGrid);

  const momentPane = makePane();
  explainFor('moment', momentPane);
  freeTextRow(momentPane, 'typedMoment',
    'תאר את הרגע במילים שלך: מה הגוף עושה בשנייה הזאת…');
  const momentGrid = el('div', 'tile-grid option-grid moment-grid');
  momentPane.append(momentGrid);

  const aspectPane = makePane();
  explainFor('aspect', aspectPane);
  const aspectRow = el('div', 'segmented aspect-row');
  aspectPane.append(aspectRow);

  const PANES = [recipePane, subjectPane, envPane, moodPane, momentPane, aspectPane];
  const STEP_NAMES = ['מה מצלמים', 'הנושא', 'הסביבה', 'אווירה ואור', 'הרגע', 'יחס תמונה'];

  function stepSummaries() {
    const label = (axis, index, typedKey) => {
      if (state[typedKey]) return 'במילים שלך';
      if (index === null) return '-';
      return (axisOptions(quick, state.recipe, axis)[index] || {}).label || '-';
    };
    const moments = momentOptions(quick, state.recipe);
    const aspect = state.aspect === null
      ? quick.recipes[state.recipe].base.camera.aspect_ratio
      : quick._aspects[state.aspect].value;
    return [
      quick.recipes[state.recipe].label,
      label('subjects', state.subject, 'typedSubject'),
      label('environments', state.environment, 'typedEnvironment'),
      label('moods', state.mood, 'typedMood'),
      state.typedMoment ? 'במילים שלך'
        : (state.moment === null ? 'ללא' : (moments[state.moment] || {}).label),
      aspect,
    ];
  }

  function renderSteps() {
    stepBar.innerHTML = '';
    const summaries = stepSummaries();
    STEP_NAMES.forEach((name, index) => {
      const btn = el('button', 'step-tab' + (index === activeStep ? ' active' : ''));
      btn.append(el('span', 'step-num', String(index + 1)));
      const textWrap = el('span', 'step-text');
      textWrap.append(el('span', 'step-name', name));
      textWrap.append(el('span', 'step-choice', summaries[index] || ''));
      btn.append(textWrap);
      btn.addEventListener('click', () => { activeStep = index; render(); });
      stepBar.append(btn);
    });
    PANES.forEach((stepPane, index) => { stepPane.hidden = index !== activeStep; });
  }

  function tile(label, sub, selected, onClick) {
    const node = el('button', 'tile option-tile' + (selected ? ' selected' : ''));
    node.append(el('span', 'tile-label', label));
    if (sub) node.append(el('span', 'tile-sub', sub));
    node.addEventListener('click', onClick);
    return node;
  }

  function renderQuestions() {
    renderSteps();

    recipeGrid.innerHTML = '';
    for (const key of quick._order) {
      const recipe = quick.recipes[key];
      recipeGrid.append(tile(recipe.label, recipe.blurb, key === state.recipe, () => {
        state.recipe = key;
        state.subject = 0; state.environment = 0; state.mood = 0;
        state.moment = null; state.aspect = null;
        activeStep = 1; /* choosing what you shoot opens the subject step */
        render();
      }));
    }

    const axes = [
      ['subjects', 'subject', subjectGrid],
      ['environments', 'environment', envGrid],
      ['moods', 'mood', moodGrid],
    ];
    /* crossed options stay one click away so a step never becomes a long
       scroll; a crossed selection keeps the list open */
    const expander = (grid, count, key) => {
      const btn = el('button', 'tile option-tile expander',
        state.expanded[key]
          ? 'להסתיר את האפשרויות מהמתכונים האחרים'
          : `עוד ${count} אפשרויות מהמתכונים האחרים`);
      btn.addEventListener('click', () => {
        state.expanded[key] = !state.expanded[key];
        render();
      });
      grid.append(btn);
    };

    for (const [axis, stateKey, grid] of axes) {
      grid.innerHTML = '';
      const options = axisOptions(quick, state.recipe, axis);
      const crossedCount = options.filter((o) => o.origin).length;
      const open = state.expanded[stateKey]
        || (options[state[stateKey]] && options[state[stateKey]].origin);
      options.forEach((option, index) => {
        if (option.origin && !open) return;
        grid.append(tile(option.label, option.origin, index === state[stateKey],
          () => { state[stateKey] = index; render(); }));
      });
      if (crossedCount) expander(grid, crossedCount, stateKey);
    }

    momentGrid.innerHTML = '';
    momentGrid.append(tile('בלי רגע מוגדר', 'הפריים כפי שהוא', state.moment === null,
      () => { state.moment = null; render(); }));
    const moments = momentOptions(quick, state.recipe);
    const awayCount = moments.filter((m) => m.origin).length;
    const momentOpen = state.expanded.moment
      || (state.moment !== null && moments[state.moment] && moments[state.moment].origin);
    moments.forEach((moment, index) => {
      if (moment.origin && !momentOpen) return;
      momentGrid.append(tile(moment.label, moment.origin, index === state.moment,
        () => { state.moment = index; render(); }));
    });
    if (awayCount) expander(momentGrid, awayCount, 'moment');

    aspectRow.innerHTML = '';
    const baseAspect = quick.recipes[state.recipe].base.camera.aspect_ratio;
    quick._aspects.forEach((aspect, index) => {
      const selected = state.aspect === null
        ? aspect.value === baseAspect : state.aspect === index;
      const seg = el('button', 'segment' + (selected ? ' active' : ''), aspect.label);
      if (aspect.note) {
        globalThis.PM.attachPopover(seg, { lines: [aspect.note] },
          { openOnClick: false });
      }
      seg.addEventListener('click', () => { state.aspect = index; render(); });
      aspectRow.append(seg);
    });
  }

  function render() {
    renderQuestions();
    for (const { note, stateKey } of freeTexts) {
      if (HEBREW.test(state[stateKey])) {
        const { text, unknown } = typedEnglish(stateKey);
        note.textContent = [
          text ? `→ ${text}` : '',
          unknown.length ? `מילים שלא תורגמו והושמטו: ${unknown.join(', ')}` : '',
        ].filter(Boolean).join('   ·   ');
      } else {
        note.textContent = '';
      }
    }
    pane.render();
  }

  render();
}

const QUICK = { deepMerge, compose, axisOptions, momentOptions, initQuick };
if (typeof module !== 'undefined') module.exports = QUICK;
if (typeof globalThis !== 'undefined') {

}

/* Prompt Machine — the professional form: every spec field editable, in
   tabs (never one long scroll), with the live prompt beside it. The spec is
   the source of truth; the form only reads and writes it. */
'use strict';

const FORM_HEBREW = /[֐-׿]/;

/* The form edits the original authoring shape (subject as an object,
   realism.level). A spec that arrives in the internal shape - a shots/ file,
   an export - is converted on the way in, never rejected. */
function toAuthoringShape(source) {
  const spec = JSON.parse(JSON.stringify(source));
  if (typeof spec.subject === 'string') {
    spec.subject = {
      primary: spec.subject,
      secondary: spec.secondary_subjects || [],
      materials: spec.materials || [],
      styling: spec.styling || '',
    };
    if (spec.subject_scale_cm !== undefined) {
      spec.subject.scale_cm = spec.subject_scale_cm;
    }
    delete spec.secondary_subjects;
    delete spec.materials;
    delete spec.styling;
    delete spec.subject_scale_cm;
  }
  if (spec.realism_level) {
    const extra = spec.realism || {};
    spec.realism = { level: spec.realism_level };
    if (extra.retouch) spec.realism.retouch_level = extra.retouch;
    if (extra.optical_extra) spec.realism.optical_extra = extra.optical_extra;
    if (extra.sensor_extra) spec.realism.sensor_extra = extra.sensor_extra;
    if (spec.imperfections_extra) {
      spec.realism.scene_imperfections = spec.imperfections_extra;
      delete spec.imperfections_extra;
    }
    delete spec.realism_level;
  }
  if (spec.rig && spec.rig.key_to_fill_ratio && !spec.rig.ratio) {
    spec.rig.ratio = spec.rig.key_to_fill_ratio;
    delete spec.rig.key_to_fill_ratio;
  }
  if (spec.moment && spec.moment.body && !spec.moment.action) {
    spec.moment.action = spec.moment.body;
    delete spec.moment.body;
  }
  if (!spec.subject.materials) spec.subject.materials = [];
  if (spec.rig && !spec.rig.lights) spec.rig.lights = [];
  return spec;
}

/* Nothing is decided for the user: every field starts undecided (null) and
   travels to the prompt as a bracketed placeholder until a choice is made.
   An authored empty string still means "none on purpose". */
function blankSpec() {
  return {
    id: '',
    genre: '',
    intent: { message: '', usage: '' },
    subject: { primary: null, secondary: [], materials: [], styling: '' },
    moment: undefined,
    set: {
      environment: '', background: null, background_distance_cm: null,
      surface: null, props: [],
    },
    composition: {
      layout: null, subject_placement: null,
      negative_space: null, horizon_or_table_line: null,
    },
    rig: { preset: null, ratio: null, ambient: null, lights: [] },
    materials: undefined,
    camera: {
      body_class: null, format: null, focal_length_mm: null, aperture: null,
      subject_distance_cm: null, height_cm: null, shutter: null, iso: null,
      focus_point: null, aspect_ratio: null, shot_size: null,
    },
    realism: { level: '' },
    grade: {
      look: null, black_point: null, white_balance_k: null,
      contrast_curve: null, saturation: null,
    },
    negative: [],
  };
}

function initForm(root, lib, hooks = {}) {
  const labels = lib.labels_he;
  const options = lib.options_he;
  const help = lib.help_he;

  let spec = blankSpec();
  let budget = null;

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  root.innerHTML = '';
  const layout = el('div', 'quick-layout');
  const editor = el('section', 'quick-questions');
  const pane = globalThis.PM.createOutputPane(lib, () => spec, {
    getBudget: () => budget,
    onNavigate: (group) => {
      if (RENDERERS[group]) { activeGroup = group; render(); }
    },
    extraButtons: [
      { label: 'הורדת shot.json', onClick: downloadSpec },
      { label: 'טעינת קובץ', onClick: () => fileInput.click() },
      ...(hooks.extraButtons || []),
    ],
  });
  layout.append(editor, pane.root);
  root.append(layout);

  const fileInput = el('input');
  fileInput.type = 'file';
  fileInput.accept = 'application/json';
  fileInput.hidden = true;
  fileInput.addEventListener('change', () => {
    const file = fileInput.files[0];
    if (!file) return;
    file.text().then((text) => {
      try {
        spec = toAuthoringShape(JSON.parse(text));
        render();
      } catch {
        alert('הקובץ אינו JSON תקין');
      }
      fileInput.value = '';
    });
  });
  root.append(fileInput);

  function downloadSpec() {
    const blob = new Blob([JSON.stringify(spec, null, 2)], { type: 'application/json' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `${spec.id || 'shot'}.json`;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  /* -------------------------------------------------- field primitives -- */

  const get = (path) => path.split('.').reduce((o, k) => (o || {})[k], spec);
  const set = (path, value) => {
    const keys = path.split('.');
    let node = spec;
    for (const key of keys.slice(0, -1)) {
      if (typeof node[key] !== 'object' || node[key] === null) node[key] = {};
      node = node[key];
    }
    node[keys.at(-1)] = value;
  };

  function helpMark(key) {
    const entry = help[key];
    if (!entry) return null;
    const mark = el('button', 'help-mark', '?');
    mark.type = 'button';
    globalThis.PM.attachPopover(mark, {
      lines: [entry.what && { text: entry.what, strong: true }, entry.do, entry.why]
        .filter(Boolean),
    });
    return mark;
  }

  function row(labelText, control, helpKey) {
    const wrap = el('div', 'field-row');
    const label = el('label', 'field-label', labelText);
    const mark = helpKey ? helpMark(helpKey) : null;
    if (mark) label.append(mark);
    wrap.append(label, control);
    return wrap;
  }

  /* free text with an optional authored option list beside it: the value is
     English and goes into the prompt verbatim, the labels are Hebrew and
     never leave the page */
  function comboField(path, optionKey, helpKey, labelText) {
    const wrap = el('div', 'combo');
    const input = el('input', 'free-text');
    const note = el('div', 'field-note');
    input.value = get(path) ?? '';
    input.addEventListener('change', () => {
      let value = input.value.trim();
      note.textContent = '';
      if (FORM_HEBREW.test(value)) {
        const { text, unknown } = globalThis.PM.translateHe(value, lib);
        note.textContent = [
          `תורגם: ${value} → ${text}`,
          unknown.length ? `לא תורגמו והושמטו: ${unknown.join(', ')}` : '',
        ].filter(Boolean).join('   ·   ');
        value = text;
        input.value = text;
      }
      set(path, value);
      render(false);
    });
    if (optionKey && options[optionKey]) {
      const select = el('select', 'field-select');
      select.append(new Option('בחר מהרשימה', ''));
      for (const option of options[optionKey]) {
        select.append(new Option(option.label, option.value));
      }
      select.addEventListener('change', () => {
        if (select.value) {
          input.value = select.value;
          set(path, select.value);
          render(false);
        }
      });
      wrap.append(select);
    }
    wrap.append(input, note);
    return row(labelText, wrap, helpKey);
  }

  function selectField(path, entries, helpKey, labelText, onChange) {
    const select = el('select', 'field-select');
    select.append(new Option('טרם הוחלט', ''));
    for (const [value, label] of entries) select.append(new Option(label, value));
    select.value = get(path) ?? '';
    select.addEventListener('change', () => {
      set(path, select.value || null);
      if (onChange) onChange(select.value);
      render(false);
    });
    return row(labelText, select, helpKey);
  }

  function numField(path, labelText, helpKey, step = 1) {
    const input = el('input', 'free-text num');
    input.type = 'number';
    input.step = String(step);
    const current = get(path);
    input.value = current == null ? '' : current;
    input.addEventListener('change', () => {
      set(path, input.value === '' ? null : Number(input.value));
      render(false);
    });
    return row(labelText, input, helpKey);
  }

  function listField(path, labelText, helpKey, optionKey) {
    const wrap = el('div', 'combo');
    const list = el('div', 'chip-list');
    const redraw = () => {
      list.innerHTML = '';
      for (const [index, item] of (get(path) || []).entries()) {
        const chip = el('button', 'list-chip', item);
        chip.title = 'הסרה';
        chip.addEventListener('click', () => {
          const items = [...get(path)];
          items.splice(index, 1);
          set(path, items);
          redraw();
          render(false);
        });
        list.append(chip);
      }
    };
    redraw();
    const input = el('input', 'free-text');
    const note = el('div', 'field-note');
    input.placeholder = 'הוספה בעברית או באנגלית, ואנטר…';
    input.addEventListener('keydown', (event) => {
      if (event.key !== 'Enter' || !input.value.trim()) return;
      let value = input.value.trim();
      note.textContent = '';
      if (FORM_HEBREW.test(value)) {
        const { text, unknown } = globalThis.PM.translateHe(value, lib);
        note.textContent = [
          `תורגם: ${value} → ${text}`,
          unknown.length ? `לא תורגמו והושמטו: ${unknown.join(', ')}` : '',
        ].filter(Boolean).join('   ·   ');
        value = text;
      }
      if (!value) return;
      set(path, [...(get(path) || []), value]);
      input.value = '';
      redraw();
      render(false);
    });
    if (optionKey && options[optionKey]) {
      const select = el('select', 'field-select');
      select.append(new Option('הוספה מהרשימה', ''));
      for (const option of options[optionKey]) {
        select.append(new Option(option.label, option.value));
      }
      select.addEventListener('change', () => {
        if (!select.value) return;
        set(path, [...(get(path) || []), select.value]);
        select.value = '';
        redraw();
        render(false);
      });
      wrap.append(select);
    }
    wrap.append(list, input, note);
    return row(labelText, wrap, helpKey);
  }

  /* --------------------------------------------- reference-style tiles -- */

  const CAMERA_ICONS = {
    full_frame_dslr:
      '<rect x="2" y="8" width="20" height="13" rx="2"/><path d="M8 8l2-3h4l2 3"/><circle cx="12" cy="14.5" r="4"/>',
    full_frame_mirrorless:
      '<rect x="2" y="7" width="20" height="13" rx="2"/><circle cx="12" cy="13.5" r="4.5"/><rect x="16.5" y="9" width="3" height="2" rx="0.5"/>',
    '35mm_film':
      '<rect x="2" y="8" width="20" height="12" rx="2"/><circle cx="7" cy="6" r="2"/><circle cx="17" cy="6" r="2"/><circle cx="12" cy="14" r="3.5"/>',
    medium_format_digital:
      '<rect x="4" y="4" width="16" height="17" rx="2"/><circle cx="12" cy="13" r="4.5"/><rect x="8" y="5.5" width="8" height="3" rx="1"/>',
    large_format_film:
      '<rect x="2" y="6" width="5" height="12" rx="1"/><rect x="17" y="6" width="5" height="12" rx="1"/><path d="M7 8l10-2M7 12h10M7 16l10 2"/>',
    aps_c:
      '<rect x="4" y="9" width="16" height="10" rx="2"/><circle cx="12" cy="14" r="3"/>',
    phone:
      '<rect x="8" y="3" width="8" height="18" rx="2"/><circle cx="12" cy="18" r="1"/>',
  };

  function svgWrap(inner, size = 26) {
    const span = el('span', 'tile-icon');
    span.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
    return span;
  }

  /* a tiny top-view plot of the rig itself: subject in the centre, camera
     at the bottom, one dot per source placed by its real azimuth */
  function rigPlotIcon(presetKey) {
    const preset = lib.lighting[presetKey];
    const span = el('span', 'tile-icon');
    if (!preset) return span;
    let dots = '';
    for (const light of preset.lights) {
      const rad = (light.azimuth_deg * Math.PI) / 180;
      const x = 12 + Math.sin(rad) * 8;
      const y = 12 + Math.cos(rad) * 8;
      const color = light.role === 'key' ? '#64D4FC'
        : light.modifier === 'negative_fill_black' ? '#374257' : '#44A888';
      const r = light.role === 'key' ? 2.6 : 1.8;
      dots += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${color}"/>`;
    }
    span.innerHTML = `<svg viewBox="0 0 24 24" width="34" height="34">
      <circle cx="12" cy="12" r="10.5" fill="none" stroke="rgba(93,116,152,0.35)" stroke-dasharray="2 2.5"/>
      <circle cx="12" cy="12" r="2.6" fill="none" stroke="#98A2B3" stroke-width="1.4"/>
      <path d="M10 22.5h4" stroke="#98A2B3" stroke-width="1.6" stroke-linecap="round"/>
      ${dots}</svg>`;
    return span;
  }

  function sectionLabel(text) {
    return el('div', 'section-label', text);
  }

  function bigTile({ icon, big, unit, label, sub, selected, onClick }) {
    const node = el('button', 'tile big-tile' + (selected ? ' selected' : ''));
    if (icon) node.append(icon);
    if (big !== undefined) {
      const bigWrap = el('span', 'tile-big mono');
      bigWrap.textContent = big;
      if (unit) bigWrap.append(el('small', null, unit));
      node.append(bigWrap);
    }
    if (label) node.append(el('span', 'tile-label', label));
    if (sub) node.append(el('span', 'tile-sub', sub));
    node.addEventListener('click', onClick);
    return node;
  }

  const explainToggle = globalThis.PM.explainToggle;

  const GROUP_EXPLAIN = {
    reference: () => [{
      what: 'מדידה אמיתית של צילום רפרנס, בתוך הדפדפן. המערכת קוראת את '
        + 'הפיקסלים ומחשבת יחס תמונה, נקודת שחור, קונטרסט, רוויה, נטיית צבע, '
        + 'יחס מפתח למילוי בסטופים, כיוון האור, עומק שדה וגריין.',
      do: 'מה שנמדד מוצע לך, ואתה מחליט מה להחיל. מה שאי אפשר למדוד '
        + 'מפיקסלים, כלומר מי בתמונה ומאיזה חומר עשוי כל דבר, המערכת לא '
        + 'מנחשת: את זה אתה כותב.',
      why: 'התמונה נקראת לזיכרון ונמדדת בלבד. היא לא עולה לשום שרת, לא '
        + 'נשמרת, ולא נכנסת למפרט.',
    }],
    basis: () => [help._groups.basis, help._groups.subject],
    moment: () => [help._groups.moment],
    set: () => [help._groups.set, help._groups.composition],
    rig: () => [help._groups.rig],
    materials: () => [help.subject_materials],
    camera: () => [help._groups.camera],
    grade: () => [help._groups.realism, help._groups.grade],
    negative: () => [help._groups.negative, help._output && help._output.budget],
  };

  function summaryStrip(cells) {
    const strip = el('div', 'summary-strip');
    for (const [caption, value] of cells) {
      const cell = el('div', 'summary-cell');
      cell.append(el('span', 'summary-caption', caption));
      cell.append(el('span', 'summary-value', value));
      strip.append(cell);
    }
    return strip;
  }

  /* ----------------------------------------------------------- groups -- */

  const GROUPS = [
    ['reference', 'צילום רפרנס'],
    ['basis', 'בסיס ונושא'],
    ['moment', 'הרגע'],
    ['set', 'סט וקומפוזיציה'],
    ['rig', 'תאורה'],
    ['materials', 'חומרים'],
    ['camera', 'מצלמה'],
    ['grade', 'ריאליזם וגרייד'],
    ['negative', 'נגטיבים ותקציב'],
  ];
  /* the reference is where most work actually starts */
  let activeGroup = 'reference';

  const groupBar = el('div', 'step-tabs form-tabs');
  editor.append(groupBar);
  const groupPane = el('div', 'step-pane');
  editor.append(groupPane);

  function renderGroupBar() {
    groupBar.innerHTML = '';
    GROUPS.forEach(([key, name], index) => {
      const btn = el('button', 'step-tab' + (key === activeGroup ? ' active' : ''));
      btn.append(el('span', 'step-num', String(index + 1)));
      const textWrap = el('span', 'step-text');
      textWrap.append(el('span', 'step-name', name));
      btn.append(textWrap);
      btn.addEventListener('click', () => { activeGroup = key; render(); });
      groupBar.append(btn);
    });
  }

  /* ---- reading a reference photograph, in the browser, on the pixels ---- */

  let refReport = null;
  let refUrl = null;
  const refApplied = new Set();
  let refError = '';

  const BLACK_POINT_HE = {
    true_black: 'שחור אמיתי', lifted_charcoal: 'שחור מורם', crushed: 'שחור מרוסק',
  };
  const QUALITY_HE = { soft: 'רך', medium: 'בינוני', hard: 'קשה' };
  const DEPTH_HE = { shallow: 'רדוד', medium: 'בינוני', deep: 'עמוק' };
  const GRAIN_HE = { clean: 'נקי', visible: 'נראה לעין', heavy: 'כבד' };
  const CAST_HE = { warm: 'חמה', neutral: 'ניטרלית', cool: 'קרה' };
  const SIDE_HE = {
    camera_left: 'משמאל למצלמה', camera_right: 'מימין למצלמה', frontal: 'חזיתי',
  };

  function readReference(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        /* a working copy: big enough to keep the grain honest, small enough
           to measure instantly. smoothing off, or the noise floor is lost. */
        const max = 1000;
        const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(2, Math.round(img.naturalWidth * scale));
        const h = Math.max(2, Math.round(img.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, 0, 0, w, h);
        const pixels = ctx.getImageData(0, 0, w, h);
        const report = globalThis.PM.analyzePixels(pixels.data, w, h);
        /* the frame's real size is the original's, not the working copy's */
        report.aspect.width = img.naturalWidth;
        report.aspect.height = img.naturalHeight;
        report.aspect.value = img.naturalWidth / img.naturalHeight;
        let best = globalThis.PM.COMMON_RATIOS[0];
        for (const entry of globalThis.PM.COMMON_RATIOS) {
          if (Math.abs(entry[1] - report.aspect.value)
              < Math.abs(best[1] - report.aspect.value)) best = entry;
        }
        report.aspect.nearest = best[0];
        resolve({ report, url });
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }

  const RENDERERS = {
    reference() {
      const intro = el('p', 'section-hint',
        'ברוב העבודות מתחילים מצילום רפרנס. גררו אותו לכאן, והמערכת תמדוד '
        + 'ממנו את מה שאפשר למדוד ותציע למלא בו את המפרט. הצילום נקרא '
        + 'לזיכרון בלבד: הוא לא עולה לשום שרת ולא נשמר.');
      groupPane.append(intro);

      const fileIn = el('input');
      fileIn.type = 'file';
      fileIn.accept = 'image/*';
      fileIn.hidden = true;
      groupPane.append(fileIn);

      const drop = el('div', 'ref-drop');
      drop.append(el('span', 'ref-drop-title', 'גררו לכאן צילום, או לחצו לבחירה'));
      drop.append(el('span', 'ref-drop-sub', 'JPG, PNG או WEBP'));
      drop.addEventListener('click', () => fileIn.click());
      ['dragenter', 'dragover'].forEach((name) => drop.addEventListener(name, (e) => {
        e.preventDefault(); drop.classList.add('over');
      }));
      ['dragleave', 'drop'].forEach((name) => drop.addEventListener(name, (e) => {
        e.preventDefault(); drop.classList.remove('over');
      }));

      const take = async (file) => {
        if (!file || !file.type.startsWith('image/')) {
          refError = 'זה לא קובץ תמונה'; render(); return;
        }
        try {
          const { report, url } = await readReference(file);
          if (refUrl) URL.revokeObjectURL(refUrl);
          refReport = report; refUrl = url; refError = '';
          refApplied.clear();
        } catch {
          refError = 'לא הצלחנו לקרוא את התמונה';
        }
        render();
      };
      drop.addEventListener('drop', (e) => take(e.dataTransfer.files[0]));
      fileIn.addEventListener('change', () => take(fileIn.files[0]));
      groupPane.append(drop);

      if (refError) groupPane.append(el('p', 'rule-note', refError));
      if (!refReport) return;

      const r = refReport;
      const layout2 = el('div', 'ref-layout');
      groupPane.append(layout2);

      /* what was seen */
      const seen = el('div', 'ref-seen');
      const thumb = el('img', 'ref-thumb');
      thumb.src = refUrl;
      thumb.alt = 'צילום הרפרנס';
      seen.append(thumb);

      const swatches = el('div', 'ref-palette');
      for (const colour of r.colour.palette) {
        const chip = el('span', 'ref-swatch');
        chip.style.background = colour.hex;
        globalThis.PM.attachPopover(chip, {
          title: colour.name,
          lines: [{ text: `${colour.share}% מהפריים`, mono: false },
                  { text: colour.hex, mono: true }],
        });
        swatches.append(chip);
      }
      seen.append(swatches);
      layout2.append(seen);

      /* what was measured */
      const measured = el('div', 'ref-measured');
      const chip = (caption, value) => {
        const cell = el('div', 'summary-cell');
        cell.append(el('span', 'summary-caption', caption));
        cell.append(el('span', 'summary-value', value));
        return cell;
      };
      const strip = el('div', 'summary-strip ref-strip');
      strip.append(chip('יחס', r.aspect.nearest));
      strip.append(chip('חשיפה', { low: 'לואו קי', normal: 'רגילה',
        high: 'היי קי' }[r.exposure.key]));
      strip.append(chip('נקודת שחור', BLACK_POINT_HE[r.tone.black_point]));
      strip.append(chip('אור', SIDE_HE[r.light.side]));
      strip.append(chip('יחס מפתח', `${r.light.ratio} · ${r.light.stops} סטופים`));
      strip.append(chip('איכות האור', QUALITY_HE[r.light.quality]));
      strip.append(chip('אזימוט', `${r.light.azimuth_deg}°`));
      strip.append(chip('גובה', `${r.light.elevation_deg}°`));
      strip.append(chip('טמפרטורה', `${CAST_HE[r.colour.cast]} · ${r.colour.kelvin}K`));
      strip.append(chip('עומק שדה', DEPTH_HE[r.focus.depth]));
      strip.append(chip('גריין', GRAIN_HE[r.grain.level]));
      strip.append(chip('רוויה', `${r.colour.saturation}%`));
      measured.append(strip);
      layout2.append(measured);

      /* what it offers to fill */
      groupPane.append(sectionLabel('מה נמדד, ומה אפשר למלא ממנו'));
      const offers = globalThis.PM.suggestSpec(r, lib);
      const readable = (offer) => {
        if (offer.path === 'rig.preset') {
          return (lib.lighting[offer.value] || {}).label || offer.value;
        }
        if (offer.path === 'realism.level') {
          return labels.realism_level[offer.value] || offer.value;
        }
        if (offer.path === 'grade.black_point') {
          return BLACK_POINT_HE[offer.value] || offer.value;
        }
        return String(offer.value);
      };
      const applyOne = (offer) => {
        set(offer.path, offer.value);
        refApplied.add(offer.path);
      };

      const list = el('div', 'ref-offers');
      for (const offer of offers) {
        const card = el('div', 'ref-offer'

        head.append(el('span', 'ref-offer-label', offer.label));
        const conf = el('span', 'chip-meta',

          lines: [{ text: 'יחס תמונה נמדד ודאי. כיוון האור ורמת הריאליזם הם '
            + 'הערכה מהפיקסלים, ולכן אחוז נמוך יותר.' }],

        head.append(conf);

        const btn = el('button', 'btn-ghost',

      groupPane.append(el('p', 'rule-note',
        'מה שלא נמדד מפיקסלים אינו מנוחש: מי בתמונה, מאיזה חומר עשוי כל דבר, '

          spec.rig.lights = spec.rig.lights || [];

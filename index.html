  /* borders */
  --border-subtle:  rgba(93, 116, 152, 0.14);
  --border-mid:     rgba(93, 116, 152, 0.24);
  --border-strong:  rgba(120, 148, 190, 0.35);
  --border-dashed:  rgba(90, 130, 180, 0.45);

  /* cyan — the brand signal */
  --cyan:           #24B8F0;
  --cyan-bright:    #64D4FC;
  --cyan-pale:      #98E0F8;
  --cyan-deep:      #186890;
  --cyan-dim:       #104058;
  --cyan-border:    rgba(56, 192, 240, 0.55);
  --cyan-glow:      rgba(36, 184, 240, 0.35);
  --cyan-tint:      rgba(36, 184, 240, 0.10);

  /* green — data flow only */
  --green:          #3C9C80;
  --green-bright:   #44A888;
  --green-chip:     #205C50;
  --green-accent:   #1D5A4E;

  /* purple — prompt/text flow only */
  --purple:         #9898EC;
  --purple-dim:     #545878;

  /* text */
  --text-primary:   #E9EEF5;
  --text-secondary: #98A2B3;
  --text-muted:     #707885;
  --text-faint:     #515D6D;
  --text-mono-dim:  #374257;
  --text-on-cyan:   #06222E;

  /* geometry */
  --r-node: 14px;
  --r-panel: 16px;
  --r-field: 10px;
  --r-tile: 12px;
  --r-pill: 999px;

  /* type — Hebrew UI: Heebo leads */
  --font-ui: 'Heebo', 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; }

html, body { height: 100%; }

body {
  font-family: var(--font-ui);
  color: var(--text-secondary);
  background: var(--void);
}

/* [hidden] must beat any display rule */
[hidden] { display: none !important; }

button { font-family: inherit; cursor: pointer; }

.mono { font-family: var(--font-mono); direction: ltr; unicode-bidi: isolate; }

/* ---------------------------------------------------------------------
   Canvas: navy gradient, faint dot grid, vignette
   --------------------------------------------------------------------- */

.canvas {
  min-height: 100%;
  display: flex;
  flex-direction: column;
  background:
    radial-gradient(ellipse 120% 90% at 50% 30%,
      var(--void-high) 0%, var(--void) 55%, var(--void-edge) 100%);
  position: relative;
}
.canvas::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(circle,
    rgba(120, 150, 200, 0.10) 1px, transparent 1px);
  background-size: 26px 26px;
  pointer-events: none;
}
.canvas > * { position: relative; }

/* ---------------------------------------------------------------------
   Topbar
   --------------------------------------------------------------------- */

.topbar {
  height: 52px;
  background: var(--surface-top);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  gap: 10px;
  padding-inline: 14px;
}
.app-chip {
  width: 28px; height: 28px;
  border-radius: 8px;
  background: var(--cyan-dim);
  color: var(--cyan-bright);
  display: grid; place-items: center;
  flex: none;
}
.app-chip svg { width: 16px; height: 16px; }
.app-title {
  font-size: 14px; font-weight: 600;
  color: var(--text-primary);
}
.topbar .chip-meta { margin-inline-start: 4px; }
.topbar-spacer { margin-inline-start: auto; }

/* mode switch pills, hidden at the gate */
.mode-switch { display: flex; gap: 6px; }
.mode-switch .btn-ghost.active {
  color: var(--cyan-bright);
  border-color: var(--cyan-border);
  background: var(--cyan-tint);
}

/* ---------------------------------------------------------------------
   Buttons & chips
   --------------------------------------------------------------------- */

.btn-run {
  font-size: 13px; font-weight: 600; line-height: 1;
  color: var(--text-on-cyan);
  background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan-pale) 100%);
  border: none; border-radius: var(--r-pill);
  padding: 12px 22px;
  box-shadow: 0 0 18px var(--cyan-glow), inset 0 1px 0 rgba(255,255,255,0.35);
  transition: box-shadow .2s, transform .15s;
}
.btn-run:hover { box-shadow: 0 0 28px var(--cyan-glow); transform: translateY(-1px); }
.btn-run.compact { padding: 8px 16px; font-size: 12px; }

.btn-ghost {
  font-size: 12px; font-weight: 500; line-height: 1;
  color: var(--text-secondary);
  background: var(--surface-top);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-pill);
  padding: 8px 14px;
}
.btn-ghost:hover { color: var(--text-primary); border-color: var(--border-strong); }

.chip-meta {
  font-family: var(--font-mono);
  font-size: 10px; font-weight: 400; line-height: 1;
  color: var(--text-secondary);
  border: 1px solid var(--border-mid);
  border-radius: 6px; padding: 4px 8px;
  background: transparent;
  white-space: nowrap;
  direction: ltr; unicode-bidi: isolate;
}

/* ---------------------------------------------------------------------
   Panels, tabs, segmented control
   --------------------------------------------------------------------- */

.panel {
  background: var(--surface-1);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-panel);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
.panel-header {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px;
}
.panel-title { font-size: 15px; font-weight: 600; color: var(--text-primary); }

.panel-label {
  font-size: 12px; font-weight: 600;
  color: var(--text-faint);
  margin: 16px 0 6px;
}

.panel-field {
  background: var(--surface-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-field);
  padding: 10px 12px;
  font-size: 12.5px; font-weight: 500;
  color: var(--text-primary);
  display: flex; justify-content: space-between; align-items: center;
}

/* Selected = inverted like the primary button: cyan fill, dark text.
   Unselected = readable primary text on a raised surface. */
.tabs { display: flex; gap: 10px; }
.tab {
  flex: 1;
  border-radius: var(--r-pill);
  padding: 10px 0;
  text-align: center;
  font-size: 12.5px; font-weight: 600;
  transition: color .15s, border-color .15s, box-shadow .15s;
}
.tab.active {
  border: 1px solid transparent;
  color: var(--text-on-cyan);
  background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan-pale) 100%);
  box-shadow: 0 0 14px var(--cyan-glow);
}
.tab.inactive {
  border: 1px solid var(--border-mid);
  color: var(--text-primary);
  background: var(--surface-4);
}
.tab.inactive:hover { border-color: var(--cyan-border); }

.segmented { display: flex; gap: 4px; }
.segment {
  border: none; border-radius: var(--r-pill);
  padding: 7px 14px;
  font-size: 12px; font-weight: 600;
  color: var(--text-primary);
  background: var(--surface-4);
}
.segment.active {
  background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan-pale) 100%);
  color: var(--text-on-cyan);
  box-shadow: 0 0 12px var(--cyan-glow);
}

/* ---------------------------------------------------------------------
   Option tiles
   --------------------------------------------------------------------- */

.tile-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
@media (max-width: 720px) { .tile-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .tile-grid { grid-template-columns: repeat(2, 1fr); } }

.tile {
  background: var(--surface-0);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-tile);
  padding: 8px;
  text-align: center;
  cursor: pointer;
  transition: border-color .15s, box-shadow .15s;
}
.tile:hover { border-color: var(--border-strong); }
.tile-icon {
  background: var(--surface-4);
  border-radius: 8px;
  height: 56px;
  display: grid; place-items: center;
  color: var(--text-secondary);
  margin-bottom: 8px;
}
.tile-icon svg { width: 24px; height: 24px; }
.tile-label { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.3; color: var(--text-primary); }
.tile-sub   { display: block; font-size: 11.5px;  font-weight: 400; line-height: 1.3; color: var(--text-secondary); margin-top: 2px; }
.tile.selected {
  border-color: transparent;
  background: linear-gradient(135deg, var(--cyan) 0%, var(--cyan-pale) 100%);
  box-shadow: 0 0 16px var(--cyan-glow);
}
.tile.selected .tile-label { color: var(--text-on-cyan); }
.tile.selected .tile-sub   { color: rgba(6, 34, 46, 0.75); }
.tile.selected .tile-icon  { background: rgba(6, 34, 46, 0.2); color: var(--text-on-cyan); }

/* ---------------------------------------------------------------------
   Views
   --------------------------------------------------------------------- */

.view {
  flex: 1;
  width: 100%;
  max-width: 1060px;
  margin-inline: auto;
  padding: 28px 20px 48px;
}

/* --- the gate --- */

.gate { display: grid; place-content: center; gap: 28px; text-align: center; }
.gate-heading { font-size: 22px; font-weight: 600; color: var(--text-primary); }
.gate-sub { font-size: 13px; color: var(--text-muted); margin-top: 6px; }

.gate-cards {
  display: grid;
  grid-template-columns: repeat(3, 220px);
  gap: 14px;
  justify-content: center;
}
@media (max-width: 760px) { .gate-cards { grid-template-columns: 1fr; } }

.gate-card {
  background: var(--surface-1);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-node);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  padding: 18px 16px 16px;
  text-align: center;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.gate-card:hover {
  border-color: var(--cyan-border);
  box-shadow: 0 0 24px var(--cyan-glow), 0 10px 30px rgba(0, 0, 0, 0.45);
  transform: translateY(-2px);
}
.gate-card .tile-icon { height: 64px; margin-bottom: 12px; }
.gate-card:hover .tile-icon { color: var(--cyan-bright); }
.gate-card-label { display: block; font-size: 16px; font-weight: 600; color: var(--text-primary); }
.gate-card-sub { display: block; font-size: 12.5px; color: var(--text-faint); margin-top: 5px; line-height: 1.5; }

/* --- placeholder panes (replaced in later stages) --- */

.placeholder {
  display: grid; place-content: center; gap: 14px;
  text-align: center;
  min-height: 40vh;
}
.placeholder-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
.placeholder-sub { font-size: 12.5px; color: var(--text-muted); }

/* ---------------------------------------------------------------------
   Quick path
   --------------------------------------------------------------------- */

.view-wide { max-width: 1240px; }

.quick-layout {
  display: grid;
  grid-template-columns: 1fr 400px;
  gap: 22px;
  align-items: start;
}
@media (max-width: 900px) { .quick-layout { grid-template-columns: 1fr; } }

/* ---- step tabs: one question visible at a time, no long scroll ---- */

.step-tabs {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  margin-bottom: 18px;
}
@media (max-width: 1100px) { .step-tabs { grid-template-columns: repeat(3, 1fr); } }

.step-tab {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-3);
  border: 1px solid transparent;
  border-radius: var(--r-tile);
  padding: 8px 10px;
  text-align: start;
  transition: border-color .15s, box-shadow .15s;
}
.step-tab:hover { border-color: var(--cyan-border); }
.step-tab.active {
  border-color: transparent;
  background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan-pale) 100%);
  box-shadow: 0 0 14px var(--cyan-glow);
}
.step-num {
  flex: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 10.5px; font-weight: 600;
  background: var(--surface-4);
  color: var(--text-primary);
}
.step-tab.active .step-num { background: rgba(6, 34, 46, 0.25); color: var(--text-on-cyan); }
.step-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.step-name { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.step-tab.active .step-name { color: var(--text-on-cyan); }
.step-choice {
  font-size: 11.5px; font-weight: 500; color: var(--text-secondary);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 120px;
}
.step-tab.active .step-choice { color: rgba(6, 34, 46, 0.75); }

.step-pane[hidden] { display: none !important; }

.recipe-grid { grid-template-columns: repeat(4, 1fr); }
.option-grid { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 1100px) { .option-grid { grid-template-columns: repeat(2, 1fr); } }

.option-tile { padding: 12px 10px; }
.option-tile.expander {
  border-style: dashed;
  border-color: var(--border-dashed);
  color: var(--cyan-bright);
  font-size: 12px; font-weight: 600;
  display: grid; place-items: center;
  min-height: 52px;
}
.option-tile .tile-sub { min-height: 0; }

.free-text {
  width: 100%;
  margin-top: 8px;
  background: var(--surface-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-field);
  padding: 10px 12px;
  font: 500 14px/1.4 var(--font-ui);
  color: var(--text-primary);
}
.free-text::placeholder { color: var(--text-faint); }
.free-text:focus {
  outline: none;
  border-color: var(--cyan-border);
  box-shadow: 0 0 10px var(--cyan-glow);
}
.field-note { font-size: 12px; color: var(--purple); margin-top: 5px; min-height: 14px; }

.aspect-row { flex-wrap: wrap; }
.aspect-row .segment { border: 1px solid var(--border-mid); }
.aspect-row .segment.active { border-color: var(--cyan-border); }

/* ---- output pane ---- */

.quick-output {
  position: sticky;
  top: 20px;
  padding: 0 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.quick-output .panel-header { padding: 14px 0 0; }

.status-pill {
  margin-inline-start: auto;
  font-size: 10.5px; font-weight: 600;
  border-radius: var(--r-pill);
  padding: 4px 10px;
}
.status-pill.ok    { color: var(--green-bright); border: 1px solid rgba(68,168,136,.4); }
.status-pill.warn  { color: var(--purple);       border: 1px solid rgba(152,152,236,.4); }
.status-pill.error { color: #E08A8A;             border: 1px solid rgba(224,138,138,.4); }

.dialect-tabs .tab { font-size: 12.5px; padding: 8px 0; }

.meta-row { display: flex; gap: 8px; }

.prompt-box {
  background: var(--surface-0);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-field);
  padding: 12px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--text-secondary);
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 46vh;
  overflow-y: auto;
  text-align: left;
}
.prompt-box::-webkit-scrollbar { width: 4px; }
.prompt-box::-webkit-scrollbar-thumb { background: #3F4A65; border-radius: 2px; }

.note-box {
  font-size: 12px; color: var(--text-muted); min-height: 0;
  display: flex; flex-wrap: wrap; gap: 5px;
}
.note-item {
  font-size: 11.5px; line-height: 1.5;
  color: var(--text-muted);
  background: transparent;
  border: none;
  padding: 0;
  text-align: start;
}
.note-link {
  color: var(--cyan-bright);
  cursor: pointer;
  border-bottom: 1px dashed var(--cyan-border);
}
.note-link:hover { color: var(--cyan-pale); }

.ph-link { cursor: pointer; border-bottom: 1px dashed rgba(152, 152, 236, 0.5); }
.ph-link:hover { color: #B8B8F4; background: rgba(152, 152, 236, 0.18); }

/* ---- the system popover: one styled tooltip for everything ---- */

.popover {
  position: fixed;
  z-index: 50;
  max-width: 320px;
  background: var(--surface-2);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-field);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 7px;
  pointer-events: none;
}
.popover::before {
  content: '';
  position: absolute;
  width: 10px; height: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border-mid);
  transform: rotate(45deg);
}
.popover[data-side="bottom"]::before {
  top: -6px; left: calc(var(--caret-x, 50%) - 5px);
  border-bottom: none; border-right: none;
}
.popover[data-side="top"]::before {
  bottom: -6px; left: calc(var(--caret-x, 50%) - 5px);
  border-top: none; border-left: none;
}
.popover[data-side="left"]::before {
  right: -6px; top: calc(var(--caret-y, 50%) - 5px);
  border-bottom: none; border-left: none;
}
.popover[data-side="right"]::before {
  left: -6px; top: calc(var(--caret-y, 50%) - 5px);
  border-top: none; border-right: none;
}
.popover-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.popover-line { font-size: 12.5px; line-height: 1.65; color: var(--text-secondary); }
.popover-line.strong { color: var(--text-primary); font-weight: 500; }
.popover-line.mono { font-size: 11px; color: var(--text-muted); text-align: left; }

.help-mark { border: 1px solid var(--border-mid); background: var(--surface-4); }
.help-mark:hover, .help-mark:focus {
  border-color: var(--cyan-border);
  box-shadow: 0 0 8px var(--cyan-glow);
  outline: none;
}

/* placeholders in the prompt: undecided fields, highlighted until replaced */
.prompt-box .ph {
  color: var(--purple);
  background: rgba(152, 152, 236, 0.10);
  border-radius: 4px;
  padding: 0 3px;
}

/* ---- collapsed professional explanation per pane ---- */

.explain { margin-bottom: 12px; }
.explain-toggle {
  font-size: 12px; font-weight: 600;
  color: var(--cyan-bright);
  background: transparent;
  border: 1px dashed var(--border-dashed);
  border-radius: var(--r-pill);
  padding: 7px 14px;
}
.explain-toggle.open { border-style: solid; border-color: var(--cyan-border); }
.explain-panel {
  margin-top: 8px;
  background: var(--surface-0);
  border: 1px solid var(--border-subtle);
  border-inline-start: 2px solid var(--cyan-deep);
  border-radius: var(--r-field);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 8px;
}
.explain-what { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.6; }
.explain-do   { font-size: 12.5px; color: var(--text-secondary); line-height: 1.6; }
.explain-why  { font-size: 12px; color: var(--text-muted); line-height: 1.6; }

.rule-note {
  margin: 10px 0;
  padding: 10px 14px;
  font-size: 12.5px; line-height: 1.6;
  color: var(--purple);
  background: rgba(152, 152, 236, 0.07);
  border: 1px solid rgba(152, 152, 236, 0.25);
  border-radius: var(--r-field);
}

/* ---------------------------------------------------------------------
   Professional form
   --------------------------------------------------------------------- */

.form-tabs { grid-template-columns: repeat(4, 1fr); }

.field-row { margin-bottom: 14px; }
.field-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.help-mark {
  width: 15px; height: 15px;
  border-radius: 50%;
  display: inline-grid; place-items: center;
  font-size: 9.5px; font-weight: 600;
  background: var(--surface-4);
  color: var(--cyan-bright);
  border: 1px solid var(--border-mid);
  cursor: help;
}

.combo { display: flex; flex-direction: column; gap: 6px; }

.field-select {
  width: 100%;
  background: var(--surface-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-field);
  padding: 9px 12px;
  font: 500 14px var(--font-ui);
  color: var(--text-primary);
}
.field-select:focus { outline: none; border-color: var(--cyan-border); }
.field-select option { background: var(--surface-2); }

.free-text.num { direction: ltr; text-align: left; }

.check-row {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--text-secondary);
  margin: 6px 0 14px;
  cursor: pointer;
}
.check-row input { accent-color: var(--cyan); }

.chip-list { display: flex; flex-wrap: wrap; gap: 6px; }
.list-chip {
  font-size: 12.5px; font-weight: 500;
  color: var(--text-primary);
  background: var(--surface-4);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-pill);
  padding: 5px 11px;
  direction: ltr;
}
.list-chip:hover { border-color: var(--cyan-border); }
.selected-chip {
  background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan-pale) 100%);
  color: var(--text-on-cyan);
  border-color: transparent;
}
.chip-off {
  opacity: 0.45;
  text-decoration: line-through;
}

/* ---- reference-style pickers (camera & lighting tabs) ---- */

.section-label {
  font-size: 11.5px; font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--text-faint);
  margin: 20px 0 8px;
}

.picker-header {
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.current-chip {
  margin-inline-start: auto;
  display: flex; align-items: center; gap: 8px;
}
.current-caption {
  font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
  color: var(--text-faint);
}
.current-value { font-size: 13px; font-weight: 600; color: var(--text-primary); }

.picker-grid { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 1100px) { .picker-grid { grid-template-columns: repeat(3, 1fr); } }

.big-tile { padding: 10px 8px 12px; }
.big-tile .tile-icon { height: 52px; margin-bottom: 8px; }
.tile-big {
  display: block;

}

.wrap-row { flex-wrap: wrap; }

.summary-strip {

}

}

  color: var(--text-faint);
}
.summary-value { font-size: 14px; font-weight: 600; color: var(--cyan-bright); }

.field-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 14px;
}

/* ---- the lighting sketch: the one deliberately dark surface ---- */

.sketch-wrap {
  background: #060B14;
  border: 1px solid var(--border-mid);
  border-radius: var(--r-tile);
  padding: 8px;
}
.sketch-svg { display: block; width: 100%; height: auto; direction: ltr; }
.sketch-ring { fill: none; stroke: rgba(93, 116, 152, 0.18); stroke-dasharray: 2 4; }
.sketch-ring-label { font: 400 8.5px var(--font-mono); fill: #374257; }
.sketch-label { font: 600 11px var(--font-ui); }
.sketch-meta { font: 400 9px var(--font-mono); fill: #707885; }
.sketch-empty { font: 500 13px var(--font-mono); fill: #515D6D; }

/* ---- light cards ---- */

.light-card {
  background: var(--surface-0);
  border: 1px solid var(--border-mid);
  border-radius: var(--r-tile);
  padding: 12px;
  margin-bottom: 12px;
}
.light-head {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.light-role { font-size: 14px; font-weight: 600; color: var(--cyan-bright); }
.light-head .btn-ghost.small { margin-inline-start: auto; padding: 5px 10px; font-size: 10.5px; }
.btn-ghost.small { padding: 5px 10px; font-size: 10.5px; }

.light-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.light-cell { display: flex; flex-direction: column; gap: 3px; }
.light-cell .field-label { margin-bottom: 0; font-size: 11.5px; }
.light-cell.wide { grid-column: 1 / -1; }
.light-cell .free-text { padding: 7px 10px; font-size: 12px; }

.light-facts { margin-top: 10px; display: flex; flex-direction: column; gap: 3px; }
.light-fact {
  font-size: 12px; color: var(--text-secondary);
  padding-inline-start: 10px;
  border-inline-start: 2px solid var(--green-accent);
  direction: ltr; text-align: left;
}

.button-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.button-row .btn-run { flex: 1; }

/* ---------------------------------------------------------------------
   Footer strip
   --------------------------------------------------------------------- */

.footer {
  display: flex; justify-content: center; gap: 8px;
  padding: 14px;
}

/* reduced motion */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* ---------------------------------------------------------------------
   Examples library + "how it works"
   --------------------------------------------------------------------- */

.gate-links {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  margin-top: 26px;
}
.gate-link {
  background: none; border: none;
  color: var(--cyan-bright);
  font-size: 14.5px; font-weight: 500;
  cursor: pointer;
  padding: 4px 2px;
}
.gate-link:hover { text-decoration: underline; }
.gate-link-sep { color: var(--text-muted); }

.section-hint {
  font-size: 14px; line-height: 1.65;
  color: var(--text-secondary);
  margin: 10px 0 14px;
  max-width: 68ch;
}

.example-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 18px;
}
@media (max-width: 1100px) { .example-grid { grid-template-columns: repeat(2, 1fr); } }

.example-tile {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  background: var(--surface-3);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-tile);
  padding: 12px 14px;
  text-align: start;
  transition: border-color .15s, box-shadow .15s;
}
.example-tile:hover { border-color: var(--cyan-border); }
.example-tile.selected {
  border-color: transparent;
  background: linear-gradient(90deg, var(--cyan) 0%, var(--cyan-pale) 100%);
  box-shadow: 0 0 14px var(--cyan-glow);
}
.example-tile-title {
  font-size: 14.5px; font-weight: 600;
  color: var(--text-primary);
}
.example-tile.selected .example-tile-title { color: var(--text-on-cyan); }
.example-tile-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.example-tile.selected .example-tile-tags .chip-meta {
  color: var(--text-on-cyan);
  border-color: rgba(6, 34, 46, 0.35);
}

.example-detail {
  border-top: 1px solid var(--border-subtle);
  padding-top: 16px;
}
.example-detail-title {
  font-size: 18px; font-weight: 700;
  color: var(--text-primary);
  margin: 0 0 8px;
}
.example-why {
  font-size: 14.5px; line-height: 1.7;
  color: var(--text-secondary);
  margin: 0 0 14px;
  max-width: 70ch;
}

.swap-legend { display: flex; flex-direction: column; gap: 6px; }
.swap-legend-row {
  display: flex; align-items: baseline; gap: 12px;
  padding: 7px 12px;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: 8px;
}
.swap-legend-he { font-size: 13.5px; font-weight: 600; color: var(--text-primary); flex: none; }
.swap-legend-en { direction: ltr; font-size: 12px; color: var(--cyan-bright); }

.swap-toggle {
  display: flex; align-items: center; gap: 8px;
  font-size: 13.5px; color: var(--text-secondary);
  margin: 4px 0 10px;
  cursor: pointer;
}
.swap-toggle input { accent-color: var(--cyan); width: 15px; height: 15px; }

.prompt-box .swap {
  background: var(--cyan-tint);
  border-bottom: 1px dashed var(--cyan-border);
  border-radius: 3px;
  cursor: help;
}

.explain-pane { padding-top: 4px; }
.explain-pane .segmented { flex-wrap: wrap; margin: 6px 0 12px; }
.explain-mono {
  max-height: none;
  margin-bottom: 14px;
}
.explain-pane .free-text { max-width: 460px; direction: rtl; }
.explain-rig-list {
  display: flex; flex-direction: column; gap: 6px;
  margin-bottom: 14px;
  max-width: 460px;
}
.explain-pane .sketch-wrap { max-width: 460px; margin-bottom: 14px; }

/* ---------------------------------------------------------------------
   Login gate + cloud saves
   --------------------------------------------------------------------- */

.view.auth {
  display: grid; place-items: center;
  min-height: calc(100vh - 160px);
}
.auth-card {
  width: min(440px, 92vw);
  padding: 32px;
  background: linear-gradient(180deg, var(--surface-top) 0%, var(--surface-1) 55%);
  border: 1px solid var(--border-mid);
  border-top-color: var(--border-strong);
  box-shadow:
    0 24px 50px rgba(0, 0, 0, 0.55),
    0 3px 10px rgba(0, 0, 0, 0.35),
    inset 0 1px 0 rgba(233, 238, 245, 0.06);
}
.auth-card .panel-header { padding: 0 0 20px; }
.auth-tabs { margin-bottom: 16px; }
.auth-form { display: flex; flex-direction: column; gap: 12px; }
.auth-field { display: flex; flex-direction: column; gap: 6px; }
.auth-field-label {
  font-size: 13.5px; font-weight: 600;
  color: var(--text-secondary);
}
.auth-field .free-text { width: 100%; }
.auth-submit { width: 100%; margin-top: 4px; }
.auth-alt { align-self: center; font-size: 13.5px; }
.auth-notice { font-size: 13.5px; min-height: 18px; margin: 0; }
.auth-notice.error { color: #E8887C; }
.auth-notice.ok { color: var(--green-bright); }

.auth-chip { max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

.auth-overlay {
  position: fixed; inset: 0;
  background: rgba(4, 8, 16, 0.66);
  display: grid; place-items: center;
  z-index: 60;
}
.auth-work-panel { width: min(520px, 94vw); max-height: 80vh; overflow-y: auto; }
.auth-work-list { display: flex; flex-direction: column; gap: 8px; margin: 12px 0 16px; }
.auth-work-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-tile);
  padding: 10px 14px;
}
.auth-work-meta { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.auth-work-name {
  font-size: 14.5px; font-weight: 600;
  color: var(--text-primary);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.auth-work-actions { display: flex; gap: 6px; flex: none; }
.auth-danger { color: #E8887C; }

/* ---------------------------------------------------------------------
   Prompt bank + backoffice
   --------------------------------------------------------------------- */

.bank-list { display: flex; flex-direction: column; gap: 14px; }
.bank-card {
  display: grid;
  grid-template-columns: 1fr 280px;
  gap: 18px;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-tile);
  padding: 18px;
}
.bank-card:has(.bank-card-figure:empty),
.bank-card:not(:has(.bank-card-figure)) { grid-template-columns: 1fr; }
@media (max-width: 900px) { .bank-card { grid-template-columns: 1fr; } }
.bank-card-title {
  font-size: 17px; font-weight: 700;
  color: var(--text-primary);
  margin: 0 0 6px;
}
.bank-card-notes {
  font-size: 14px; line-height: 1.6;
  color: var(--text-secondary);
  margin: 0 0 10px;
}
.bank-card-prompt { max-height: 220px; margin-bottom: 10px; }
.bank-copy { align-self: flex-start; }
.bank-card-figure { display: flex; align-items: flex-start; }
.bank-card-image {
  width: 100%;
  border-radius: 10px;
  border: 1px solid var(--border-mid);
}

.admin-tabs { margin-bottom: 16px; }
.admin-pane { padding-top: 4px; }
.admin-users { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.admin-user-row.blocked { opacity: 0.6; }
.admin-chip { color: var(--cyan-bright); border-color: var(--cyan-border); margin-inline-start: 8px; }

.admin-bank-form {
  display: flex; flex-direction: column; gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-tile);
  padding: 16px;
  margin-top: 12px;
}
.admin-bank-body { resize: vertical; min-height: 110px; font-size: 12.5px; }
.admin-image-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.admin-image-preview {
  max-height: 72px; max-width: 128px;
  border-radius: 8px;
  border: 1px solid var(--border-mid);
}

/* the admin's doorway, visible on the gate itself */
.gate-admin-card {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 14px 26px;
  background: var(--surface-2);
  border: 1px solid var(--cyan-border);
  border-radius: var(--r-tile);
  box-shadow: 0 0 14px var(--cyan-glow);
}
.gate-admin-card .gate-card-label { font-size: 15px; }

.bank-variant-head {
  display: flex; align-items: center; justify-content: space-between;
  margin: 10px 0 6px;
}
.bank-variant-head .btn-run { padding: 7px 16px; font-size: 12px; }
.bank-card-prompt + .bank-variant-head { margin-top: 14px; }

/* ---------------------------------------------------------------------
   Raised panels: every framed surface breathes and carries depth
   --------------------------------------------------------------------- */

.panel {
  background: linear-gradient(180deg, var(--surface-top) 0%, var(--surface-1) 52%);
  border: 1px solid var(--border-mid);
  border-top-color: var(--border-strong);
  box-shadow:
    0 24px 50px rgba(0, 0, 0, 0.5),
    0 3px 10px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(233, 238, 245, 0.06);
}

.view .panel:not(.quick-output) {
  padding: 26px 30px;
}
.view .panel:not(.quick-output) > .panel-header { padding: 0 0 18px; }

.quick-output { padding: 0 20px 20px; }

.auth-work-panel { padding: 26px 30px; }
.auth-work-panel > .panel-header { padding: 0 0 14px; }

/* the question side of the quick path and the pro form: same treatment */
.quick-questions {
  background: linear-gradient(180deg, var(--surface-top) 0%, var(--surface-1) 52%);
  border: 1px solid var(--border-mid);
  border-top-color: var(--border-strong);
  border-radius: var(--r-panel);
  box-shadow:
    0 24px 50px rgba(0, 0, 0, 0.5),
    0 3px 10px rgba(0, 0, 0, 0.3),
    inset 0 1px 0 rgba(233, 238, 245, 0.06);
  padding: 26px 30px;
}

/* ---------------------------------------------------------------------
   Reference photograph: measured in the browser, never uploaded
   --------------------------------------------------------------------- */

.ref-drop {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 30px 20px;
  margin: 6px 0 16px;
  background: var(--surface-2);
  border: 1px dashed var(--border-dashed);
  border-radius: var(--r-tile);
  cursor: pointer;
  transition: border-color .15s, background .15s;
}
.ref-drop:hover, .ref-drop.over {
  border-color: var(--cyan-border);
  background: var(--cyan-tint);
}
.ref-drop-title { font-size: 14.5px; font-weight: 600; color: var(--text-primary); }
.ref-drop-sub { font-size: 12px; color: var(--text-muted); }

.ref-layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 18px;
  align-items: start;
  margin-bottom: 8px;
}
@media (max-width: 900px) { .ref-layout { grid-template-columns: 1fr; } }

.ref-thumb {
  width: 100%;
  border-radius: 10px;
  border: 1px solid var(--border-mid);
  display: block;
}
.ref-palette { display: flex; gap: 5px; margin-top: 8px; }
.ref-swatch {
  width: 100%; height: 26px;
  border-radius: 6px;
  border: 1px solid var(--border-subtle);
  cursor: help;
}
.ref-strip { flex-wrap: wrap; gap: 6px; }
.ref-strip .summary-cell { min-width: 104px; }

.ref-offers {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 8px 0 14px;
}
@media (max-width: 1100px) { .ref-offers { grid-template-columns: 1fr; } }
.ref-offer {
  background: var(--surface-2);
  border: 1px solid var(--border-subtle);
  border-radius: var(--r-tile);
  padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px; align-items: flex-start;
}
.ref-offer.applied { border-color: var(--cyan-border); background: var(--cyan-tint); }
.ref-offer-head {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; gap: 10px;
}
.ref-offer-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.ref-offer-detail { font-size: 12.5px; line-height: 1.55; color: var(--text-secondary); margin: 0; }
.ref-offer-value {
  font-size: 13px; font-weight: 600; color: var(--cyan-bright);
  margin: 0;
}

concrete wall","הרקע"]]},"product_watch_black_acrylic":{"title":"מוצר על אקריל שחור","why":"פורמט בינוני ב-f/16, השתקפות אחת נקייה מתחת לאובייקט, וגרגר אבק אחד שנשאר על הזכוכית בכוונה. השתקפות שחלשה מעט מהמקור היא מה שמונע את מראה ה-3D רנדר.","tags":["מוצר","סטודיו","מסחרי"],"swaps":[["a mechanical wristwatch","המוצר"],["hands at ten past ten","פרט קטן במוצר"],["black acrylic","המשטח"]]},"product_bottle_gradient":{"title":"בקבוק על גרדיאנט","why":"הגרדיאנט נבנה מאור ולא נוסף בפוטושופ: הרקע במרחק 70 ס\"מ מקבל פחות אור מהנושא, וזה מה שמייצר אותו. טביעת אצבע אחת נמוכה על הזכוכית תופסת את אור הרים.","tags":["מוצר","קוסמטיקה","פאקשוט"],"swaps":[["a frosted glass cosmetic bottle","המוצר"],["a brushed aluminium cap","החומר של הפקק"],["a faint wet ring","הפגם על המשטח"]]},"food_bread_backlit":{"title":"לחם בתאורה אחורית","why":"אור מאחור הוא מה שגורם לקרום להיראות פריך ולאדים להיראות. הצד הקרוב של הכיכר סטופ אחד כהה מהצד הרחוק. אור אמיתי תמיד נופל, ופלט AI כמעט תמיד שוכח את זה.","tags":["אוכל","אור אחורי","מרקם"],"swaps":[["a round sourdough loaf","המנה"],["a scarred wooden board","המשטח"],["a butter knife with a smear on the blade","האביזר"]]},"food_flatlay_overhead":{"title":"פלאט־ליי מלמעלה","why":"צילום מלמעלה מאבד כיוון אור בקלות. כאן הצל מתחת לקערה רך בצד אחד וצפוף בצד השני, אז עדיין רואים מאיפה האור בא.","tags":["אוכל","מלמעלה","עריכה"],"swaps":[["a bowl of salad with cut citrus and torn herbs","המנה"],["a pale honed marble slab","המשטח"],["a folded linen napkin","האביזר"]]},"animal_fox_golden_hour":{"title":"שועל בשעת הזהב","why":"טלפוטו 180 מ\"מ ממרחק 7 מטר, מצלמה בגובה 40 ס\"מ, כלומר בגובה העיניים של החיה ולא מלמעלה. אור המפתח בגובה 6 מעלות ובטמפרטורה 3000K, כלומר שמש שנמצאת ממש לפני השקיעה.","tags":["בעלי חיים","טבע","שעת זהב"],"swaps":[["a red fox","החיה"],["low grass","הסביבה"],["open field running to a treeline","הרקע"]]},"lifestyle_kitchen_morning":{"title":"מטבח בבוקר","why":"כל סימני הבימוי הוסרו במכוון: יד אחת מטושטשת קלות מול פנים חדות, אדם אחד מחוץ לפוקוס, וטבעת קפה על העיתון. זה מה שהופך צילום לייפסטייל למשהו שנראה כמו רגע ולא כמו סשן.","tags":["לייפסטייל","אור טבעי","דוקומנטרי"],"swaps":[["two people at a kitchen counter","מי בתמונה"],["a lived in kitchen","המקום"],["an open newspaper","אביזר על הדלפק"]]},"emotive_hands_tea":{"title":"ידיים וכוס, תמונה רגשית","why":"בלי פנים בכלל. הרגש נבנה מיחס 8:1, מחצי פריים כהה וריק, ומאדים שנשברים במקום לעלות בעמוד נקי. גם נכון משפטית וגם עובד חזק יותר, כי הצופה נכנס לתוך הדמות.","tags":["רגשי","טיפולי","לואו קי"],"swaps":[["two hands wrapped around a warm mug","מה בפריים"],["a soft worn sleeve","הבגד"],["a dim room falling away behind","הרקע"]]},"interior_livingroom_daylight":{"title":"חלל פנים באור יום","why":"24 מ\"מ ב-f/8 עם קווים אנכיים שנשארים אנכיים. כתם האור על הרצפה עם קצה רך ולא חד, ואבק שנראה בקרן. אלה שני הפרטים שהופכים חדר מרונדר לחדר מצולם.","tags":["פנים","אדריכלות","אור חלון"],"swaps":[["a living room in late morning","החלל"],["one armchair","הרהיט המרכזי"],["a book left face down on the arm","האביזר"]]},"landscape_coast_dusk":{"title":"קו חוף בשעה כחולה","why":"חשיפה של רבע שנייה: המים זזו והסלע נשאר חד. כל רכס במרחק בניגודיות נמוכה מזה שלפניו, וזה מה שגורם למרחק להיקרא כאוויר ולא כטשטוש.","tags":["נוף","חשיפה ארוכה","שעה כחולה"],"swaps":[["a rocky coastline at dusk","הנוף"],["wet rock shelves","הקדמה"],["layered headlands","הרקע"]]},"fashion_strip_editorial":{"title":"אופנה בלואו קי","why":"רימים בלבד ביחס 16:1, כך שהסילואטה מציירת את הבגד. קפל אחד ברקע הנייר שלא נמתח נשאר בפנים בכוונה, כי סט מושלם מדי הוא בעצמו סימן לתמונה מיוצרת.","tags":["אופנה","לואו קי","סטודיו"],"swaps":[["a long coat","הבגד"],["an unbuttoned wool coat over a silk slip","הסטיילינג"],["a mid grey paper sweep","הרקע"]]},"reportage_street_rain":{"title":"רחוב בגשם","why":"רמת ריאליזם 'חובבני' על סרט 35 מ\"מ ב-ISO 1600: גרעין שנראה גם בהיילייטס, טיפה על העדשה שמרככת פינה אחת, וכף רגל מטושטשת מול ראש חד. פגמים שמצלמה עושה ומודל לא.","tags":["רפורטאז'","סרט","רחוב"],"swaps":[["a person crossing a wet street","מי בתמונה"],["a technical rain coat with the hood up","הבגד"],["a city street","המקום"]]}}},"finishing":{"_doc":"Numeric finishing parameters, resolved by realism level. The spec holds physics in words for the prompt; this holds the numbers the post chain runs on. A shot may override any field in its own 'finish' block. Order of resolution: shot.finish > level preset > grade hints.","_fields":{"texture_amount":"0 to 1. High pass restore strength. Diffusion removes high frequency detail; this puts it back.","texture_radius_px":"High pass radius in pixels at the working resolution.","texture_protect":"0 to 1. How strongly flat regions are excluded from the restore, measured by local variance. 1 means only already detailed areas are touched.","upscale_long_edge_px":"0 disables. Grain is always injected after this, never before.","contrast_s":"0 to 1. Strength of the S curve applied around middle grey.","black_point":"0 to 1. Output level the darkest input maps to. Non zero is what stops shadows reading as pure digital black.","white_balance_shift_k":"Relative shift in kelvin. Positive is warmer.","saturation":"1.0 is neutral, 0.0 is monochrome.","vignette":"0 to 1. Corner darkening.","corner_softness":"0 to 1. Blend toward a blurred copy at the corners, standing in for field curvature.","ca_px":"Radial scale difference between the red and blue channels, in pixels at the frame edge.","grain_iso":"0 disables. Mapped to amplitude on a film like curve.","grain_mono":"true for luminance only grain, false for per channel colour grain.","output_long_edge_px":"Delivery size. 0 keeps the working size.","jpeg_quality":"1 to 100. 0 writes PNG instead."},"levels":{"clean_commercial":{"texture_amount":0.22,"texture_radius_px":1.6,"texture_protect":0.75,"upscale_long_edge_px":0,"contrast_s":0.18,"black_point":0.012,"white_balance_shift_k":0,"saturation":1.0,"vignette":0.06,"corner_softness":0.05,"ca_px":0.25,"grain_iso":100,"grain_mono":true,"output_long_edge_px":0,"jpeg_quality":95},"editorial":{"texture_amount":0.38,"texture_radius_px":2.0,"texture_protect":0.6,"upscale_long_edge_px":0,"contrast_s":0.28,"black_point":0.035,"white_balance_shift_k":0,"saturation":0.94,"vignette":0.16,"corner_softness":0.14,"ca_px":0.6,"grain_iso":400,"grain_mono":true,"output_long_edge_px":0,"jpeg_quality":92},"documentary":{"texture_amount":0.5,"texture_radius_px":2.4,"texture_protect":0.45,"upscale_long_edge_px":0,"contrast_s":0.34,"black_point":0.06,"white_balance_shift_k":150,"saturation":0.88,"vignette":0.26,"corner_softness":0.22,"ca_px":1.0,"grain_iso":800,"grain_mono":false,"output_long_edge_px":0,"jpeg_quality":88},"vernacular":{"texture_amount":0.3,"texture_radius_px":3.0,"texture_protect":0.3,"upscale_long_edge_px":0,"contrast_s":0.45,"black_point":0.02,"white_balance_shift_k":-250,"saturation":0.8,"vignette":0.42,"corner_softness":0.4,"ca_px":1.8,"grain_iso":1600,"grain_mono":false,"output_long_edge_px":0,"jpeg_quality":78}},"_grade_hints":{"_doc":"Deterministic readings of the prose grade block. Matched case insensitively as substrings, applied on top of the level preset and beneath any explicit finish block.","black_point":{"lifted_charcoal":{"black_point":0.045},"true_black":{"black_point":0.0}},"saturation":{"monochrome":{"saturation":0.0},"black and white":{"saturation":0.0},"muted":{"saturation":0.85},"restrained":{"saturation":0.88},"accurate":{"saturation":1.0}},"look":{"black and white":{"saturation":0.0}},"contrast_curve":{"gentle":{"contrast_s":0.2},"firm":{"contrast_s":0.36},"long straight":{"contrast_s":0.22},"soft shoulder":{"contrast_s":0.24}}}},"help_he":{"_doc":"Help text for the browser form, in plain Hebrew for people who are not photographers. Each entry has: what it is, what to do about it, and usually a concrete example. UI only - nothing here reaches a model. Keep the language everyday; if a term cannot be avoided, explain it in the same sentence.","_groups":{"basis":{"what":"שני שדות טכניים שקובעים איך שאר הטופס מתנהג.","do":"בחר ז'אנר קודם. הוא משנה אוטומטית את רשימת הדברים שהמערכת תבקש מהמודל להימנע מהם, ואת סוג אי המושלמויות שיתווספו."},"subject":{"what":"מה בעצם מצולם. זה החלק היחיד שאין למערכת שום דרך לנחש בשבילך.","do":"תאר מה עומד מול המצלמה, בעובדות. לא 'תמונה יפה של קומקום' אלא 'קומקום נחושת מרוקע עם ידית פליז, המכסה מעט פתוח'."},"set":{"what":"מה מסביב לנושא: הרקע, המשטח שהוא עומד עליו, ואביזרים.","do":"מלא לפחות רקע ומשטח. הם משפיעים על התמונה הרבה יותר ממה שנדמה, כי כל האור מתנהג אחרת על משטח מבריק מאשר על עץ מחוספס."},"rig":{"what":"התאורה. זה החלק הכי חשוב בכל הטופס, והוא מה שמבדיל בין תמונה שנראית אמיתית לתמונה שנראית מחשב.","do":"בחר ריג מוכן מהרשימה. אלה סידורי תאורה אמיתיים מסטודיו. אל תתחיל להזיז זוויות לפני שראית את התוצאה עם הסידור המקורי."},"camera":{"what":"הגדרות המצלמה. מהן המערכת מחשבת דברים אמיתיים, למשל כמה מהתמונה יהיה חד וכמה מטושטש.","do":"אם אתה לא בטוח, אל תיגע. הערכים שמגיעים עם התבנית הם ערכים שצלם היה בוחר לסוג הצילום הזה."},"composition":{"what":"איפה הדברים יושבים בתוך המסגרת.","do":"אפשר לדלג על זה בהתחלה. כשתראה שהמודל שם הכל בדיוק במרכז ונראה משעמם, חזור לכאן."},"realism":{"what":"כמה 'מושלמת' התמונה תהיה. זו השכבה שהכי חסרה בתמונות AI.","do":"השאר על 'עיתונאי' אלא אם אתה יודע למה אתה רוצה משהו אחר. תמונה מושלמת מדי היא מה שהעין קולטת כמזויף תוך שתי שניות."},"grade":{"what":"הצבעוניות והאווירה הכללית: חמים או קרים, עזים או דהויים.","do":"טקסט חופשי בעברית או באנגלית. אפשר להשאיר ריק לגמרי, זה לא קריטי."},"negative":{"what":"דברים שאתה רוצה שהמודל יימנע מהם.","do":"יש כבר רשימה אוטומטית של עשרות פריטים לפי הז'אנר. הוסף כאן רק אם ראית משהו ספציפי שחוזר ומפריע לך."},"moment":{"what":"מה קורה בשנייה שבה התריס פתוח.","do":"אפשר לדלג, והפרומפט יהיה תקין. אבל זו השכבה שהכי מבדילה בין פריים נכון מבחינה פיזית לבין תמונה שמישהו היה שומר. תארו גוף ולא אדם.","why":"כל שאר הטופס מתאר צילום שאפשר לצלם: הסט יהיה שם גם מחר, האור דולק בין אם מישהו עומד בו ובין אם לא, והמצלמה לא אכפת לה מה מולה. הרגע הוא היחיד שמתאר את הצילום שמתבצע, ואין בשרשרת הפוסט שום שלב שמחזיר אותו."}},"genre":{"what":"סוג הצילום. פורטרט של אדם, מוצר על רקע לבן, צלחת אוכל, נוף.","do":"בחר את מה שהכי קרוב. אם אתה מצלם בקבוק יין על שולחן, זה 'סטיל לייף'. אם אותו בקבוק על רקע נקי לאתר מכירות, זה 'מוצר'.","why":"הבחירה משנה אוטומטית רשימה שלמה של הנחיות למודל מאחורי הקלעים."},"id":{"what":"שם פנימי לצילום הזה, כדי שתוכל לשמור ולמצוא אותו אחר כך.","do":"אותיות אנגליות קטנות וקו תחתון. לדוגמה: kettle_hero_01"},"intent_message":{"what":"הכוונה: מה התמונה אמורה להגיד. משפט אחד, לא פסקה.","do":"כתבו במילים שלכם מה אתם רוצים שמי שיסתכל ירגיש או יבין. אין כאן תשובה נכונה.","why":"השדה הזה לא נשלח למודל, אף פעם. הוא קיים כדי שההחלטות שלכם יהיו עקביות: כשמתלבטים בין שתי תאורות, המשפט הזה הוא מה שמכריע."},"intent_tradition":{"what":"מסורת הצילום: לאיזו אסכולה או סגנון הצילום הזה מתכתב.","do":"בחרו מהרשימה או כתבו בעצמכם. אם אין לכם מושג, אפשר להשאיר ריק, זה לא חוסם כלום.","why":"גם זה לא נשלח למודל. זו הדרך לזכור למה בחרתם את מה שבחרתם, כשתחזרו למפרט הזה בעוד חודש."},"intent_usage":{"what":"לאן התמונה הולכת: אתר, דפוס, רשת חברתית, תפריט.","do":"כתבו איפה התמונה תוצג בפועל.","why":"גם זה לא נשלח למודל, אבל זה מה שאמור להשפיע על יחס הצדדים ועל כמה פרט צריך לשרוד. תמונה לדפוס ותמונה לסטורי הן שתי החלטות שונות."},"subject_primary":{"what":"התיאור המרכזי: מה עומד מול המצלמה.","do":"כתוב באנגלית, בעובדות פיזיות: מאיזה חומר, באיזה מצב, איך הוא מונח. תאר מה שרואים, לא איך שזה גורם לך להרגיש.","example":"טוב: a hammered copper kettle with a riveted brass handle, lid slightly ajar\nפחות טוב: a beautiful vintage kettle, amazing quality"},"subject_secondary":{"what":"דברים נוספים שנמצאים בפריים אבל אינם הגיבור.","do":"שורה לכל פריט. אפשר להשאיר ריק. אם הכל שווה בחשיבותו, התמונה תיראה מבולגנת.","example":"a curl of steam leaving the spout"},"subject_styling":{"what":"איך הנושא סודר או הולבש.","do":"אופציונלי. שימושי כשיש כיוון מסוים שחשוב לך, למשל שהתפר לא יופיע לכיוון המצלמה.","example":"rotated so the seam faces away from camera"},"subject_scale_cm":{"what":"כמה גדול הנושא במציאות, בסנטימטרים, בממד הארוך שלו.","do":"הערכה גסה מספיקה. קומקום בערך 25, אדם בערך 170, חדר בערך 400.","why":"עוזר לך לבחור מרחק ועדשה הגיוניים. אין טעם לצלם קומקום ממרחק שלושה מטר."},"subject_materials":{"what":"מאילו חומרים עשויים הדברים בתמונה. זו הידית החזקה ביותר בכל הטופס.","do":"סמן כל חומר שמופיע בפריים. כל חומר שתסמן מוסיף לפרומפט שלוש עובדות אמיתיות: איך המרקם שלו נראה מקרוב, איך הוא מחזיר אור, ואיזה פגם אופייני יש לו.","why":"בלי זה המודל נותן לכל משטח את אותה גימור גנרי, וזה בדיוק מה שגורם לתמונה להיראות מחשב. עדיף לסמן שלושה חומרים מדויקים מאשר עשרה בערך."},"subject_identity":{"what":"דמות עקבית: נושא שחוזר בכמה צילומים. אותו אדם, אותו מוצר, אותה מנה, אותו תכשיט.","do":"בונים אותה פעם אחת בדף \"דמות עקבית\", ומשם היא נכנסת לכל פרומפט. כאן רק רואים איזו דמות מחוברת לצילום הזה, ואפשר להסיר אותה.","why":"פרומפט הוא מצב חד פעמי ולא זוכר כלום. בלי דמות שמורה, הבקבוק בפריים השני יהיה בקבוק אחר. הסעיף הזה אף פעם לא נשמט מהפרומפט, כי שום עיבוד אחרי המודל לא יכול להחזיר זהות."},"set_environment":{"what":"איפה הצילום מתרחש.","do":"'סטודיו, שולחן צילום' לחפצים קטנים. 'סטודיו, רקע אינסופי' לאנשים ומוצרים. 'לוקיישן' כשרוצים חדר או חוץ אמיתיים."},"set_background":{"what":"מה נמצא מאחורי הנושא.","do":"תאר באנגלית. אפילו 'רקע נייר אפור' עדיף על כלום.","example":"seamless warm grey paper falling to a gradient at the base"},"set_background_distance_cm":{"what":"כמה סנטימטרים הרקע נמצא מאחורי הנושא.","do":"מספר בין 50 ל־300 לרוב הצילומים בסטודיו.","why":"זה לא פרט טכני משעמם. זה אחד הדברים שהכי מסגירים תמונת AI. אור נחלש עם המרחק, אז רקע רחוק חייב לצאת כהה יותר. רקע שמואר בדיוק כמו הנושא בלי סיבה נראה מזויף מיד."},"set_surface":{"what":"על מה הנושא עומד או מונח.","do":"שולחן עץ, לוח שיש, יריעת מתכת, רצפת בטון.","example":"brushed steel sheet with visible directional grain"},"set_props":{"what":"חפצים נוספים בסט שאינם הנושא.","do":"שורה לכל אחד. אופציונלי לחלוטין."},"rig_preset":{"what":"סידור התאורה. איפה עומדים הפנסים, באיזה גודל, ובאיזו זווית.","do":"בחר לפי מה שאתה רוצה שהתמונה תרגיש. הרשימה מכילה סידורים אמיתיים מסטודיו, וכל אחד מהם הוא מתכון שצלמים משתמשים בו עשרות שנים.","why":"אחרי הבחירה תראה למטה את המקורות עצמם, ומתחת לכל אחד שלוש שורות שמסבירות מה הוא עושה לתמונה. זה מה שנשלח למודל."},"rig_ratio":{"what":"כמה חזק ההבדל בין הצד המואר לצד המוצל. זו לא בהירות, זו דרמטיות.","do":"1:1 שטוח לגמרי ובלי צללים, כמו צילום דרכון. 4:1 טבעי ונעים, ברירת מחדל טובה. 8:1 דרמטי. 16:1 חצי מהפנים נעלם בחושך.","why":"זה כנראה הכפתור הכי משפיע על ה'מצב רוח' של התמונה."},"rig_ambient":{"what":"האם יש אור נוסף בחדר מלבד הפנסים.","do":"'אפלה מוחלטת' לרוב צילומי הסטודיו: רק מה שהגדרת מאיר. השאר משמש לצילומי לוקיישן."},"light_azimuth":{"what":"מאיזה כיוון האור מגיע, במעלות, כשמסתכלים על הסט מלמעלה.","do":"0 = האור בדיוק מאחורי המצלמה. מספר שלילי = משמאל. מספר חיובי = מימין. 90± = בדיוק מהצד. 180 = מאחורי הנושא.","why":"הסקיצה מתחת לרשימת המקורות מתעדכנת בזמן אמת, אז אפשר פשוט לשחק ולראות."},"light_elevation":{"what":"כמה גבוה הפנס, במעלות.","do":"0 = בדיוק בגובה הנושא. 45 = מעליו ומוטה כלפי מטה, הכי נפוץ. 80 = כמעט ישירות מלמעלה. מספר שלילי = מלמטה, וזה נראה מפחיד ולא טבעי."},"light_distance":{"what":"כמה סנטימטרים הפנס רחוק מהנושא.","do":"קרוב (60–100) = אור רך ועוטף, אבל נחלש מהר על פני הפריים. רחוק (200+) = אור קשה יותר עם צללים חדים.","why":"זה נשמע קטן אבל זה משנה שני דברים בבת אחת: גם את רכות הצל וגם את עוצמת האור."},"light_power":{"what":"כמה חזק המקור הזה ביחס למקור הראשי, ביחידות של 'סטופים'. סטופ אחד = פי שתיים.","do":"0 = באותה עוצמה. 1- = חצי מהעוצמה. 2- = רבע. השאר כמו שהגיע אלא אם משהו נראה חזק או חלש מדי."},"camera_body_class":{"what":"סוג המצלמה.","do":"אין צורך לגעת. משפיע בעיקר על 'האופי' של התמונה ולא על התוכן."},"camera_format":{"what":"גודל החיישן במצלמה.","do":"'פול פריים' הוא ברירת המחדל הבטוחה. 'פורמט בינוני' לצילומי מוצר ואופנה יוקרתיים.","why":"משפיע על החישוב של כמה מהתמונה יוצא חד. אין צורך לשנות."},"camera_focal_length_mm":{"what":"כמה 'מקרבת' העדשה. מספר קטן = רואים הרבה מהסביבה. מספר גדול = מקרוב, והרקע נמעך ומטושטש.","do":"24 לחדר או נוף. 35 לצילום טבעי של אנשים בסביבה. 85 לפורטרט, הכי מחמיא. 120 לחפצים ומוצרים.","why":"השתמש רק בערכים 24, 35, 50, 85, 100, 120 או 180. לאחרים אין תיאור בספרייה והפרומפט יוצא חלש יותר."},"camera_aperture":{"what":"כמה 'פתוחה' העדשה. זה מה שקובע כמה מהתמונה יהיה חד וכמה יטושטש.","do":"f/1.4 עד f/2.8 = רק הנושא חד, כל השאר מטושטש יפה. f/8 עד f/16 = כמעט הכל חד.","why":"המערכת מחשבת מזה מספר אמיתי בסנטימטרים ושולחת אותו למודל, במקום לכתוב 'רקע מטושטש'. תראה את התוצאה בשדה 'עומק שדה' למעלה."},"camera_subject_distance_cm":{"what":"כמה רחוקה המצלמה מהנושא, בסנטימטרים.","do":"התאם לגודל הנושא. קומקום בערך 90. אדם בערך 180 עד 250. חדר 400 ומעלה."},"camera_height_cm":{"what":"באיזה גובה המצלמה מהרצפה.","do":"לחפצים על שולחן: בערך בגובה החפץ, 45 עד 80. לאדם: בגובה העיניים, 150 עד 160."},"camera_shutter":{"what":"מהירות התריס.","do":"אין צורך לגעת בסטודיו. רלוונטי רק כשרוצים טשטוש תנועה."},"camera_iso":{"what":"רגישות החיישן. מספר גבוה = יותר 'גרעין' בתמונה.","do":"100 = נקי לגמרי. 400 = גרעין עדין שנראה כמו צילום אמיתי. 800 ומעלה = גרעיני ודוקומנטרי."},"camera_focus_point":{"what":"על מה בדיוק המצלמה מפוקסת.","do":"כתוב באנגלית את הדבר הספציפי. בפורטרט תמיד העין הקרובה.","example":"the near eye  /  the front face of the product"},"camera_aspect_ratio":{"what":"צורת המסגרת.","do":"4:5 מלבן אנכי, מצוין לאינסטגרם. 1:1 ריבוע. 3:2 מלבן אופקי קלאסי. 16:9 רחב מאוד."},"composition_layout":{"what":"איך הדברים מסודרים בפריים.","do":"אופציונלי. תאר באנגלית את המבנה הכללי.","example":"pyramidal mass rising from the left to the tallest bottle right of centre"},"composition_subject_placement":{"what":"איפה בתוך המסגרת יושב הנושא.","do":"אופציונלי. עצה: אל תשים במרכז המדויק. זה נראה סטטי, וזה אחד הסימנים לתמונת AI.","example":"base sitting on the lower third, handle reaching into the upper third"},"composition_negative_space":{"what":"האזורים הריקים בתמונה.","do":"אופציונלי אבל שימושי אם התמונה מיועדת לכותרת או ללוגו מעליה.","example":"upper right kept empty for a headline"},"composition_horizon":{"what":"איפה עובר קו השולחן או קו האופק.","do":"אופציונלי."},"realism_level":{"what":"כמה 'מלוטשת' התמונה תהיה.","do":"'עיתונאי' הוא ברירת המחדל הנכונה כמעט תמיד. 'מסחרי נקי' לפרסום ולאתרי מכירות. 'דוקומנטרי' לתחושת צילום עיתונות אמיתי. 'חובבני' לתמונה שנראית כאילו צולמה בטלפון.","why":"הבחירה קובעת גם כמה גרעין יהיה, כמה החשכה בפינות, וכמה 'מלוכלכת' התמונה תרגיש."},"realism_retouch":{"what":"כמה התמונה 'נוקתה' אחרי הצילום.","do":"'ספוט בלבד' הוא הנכון ברוב המקרים. 'ביוטי מלא' יוצר עור פלסטי, וזה בדיוק מה שמסגיר AI."},"realism_imperfections":{"what":"פגמים קטנים ומכוונים: אבק, טביעת אצבע, קמט, משהו לא ישר.","do":"שורה לכל אחד, באנגלית. יש כבר רשימה אוטומטית לפי הז'אנר, אבל אחד או שניים ספציפיים לתמונה שלך משפרים מאוד.","why":"זה נשמע הפוך מהאינטואיציה, אבל זו השכבה שהכי חסרה בפלט AI. צלם אמיתי משאיר אבק בחריצי העץ. מודל שאומן על תמונות מרוטשות מייצר עולם סטרילי, והעין קולטת את זה מיד.","example":"a faint handling mark below the handle rivet\ndust on the sweep near the base"},"grade_look":{"what":"האווירה הצבעונית הכללית.","do":"טקסט חופשי באנגלית. אפשר להשאיר ריק.","example":"warm metal against a neutral ground, no colour cast on the paper"},"grade_black_point":{"what":"כמה כהים הצללים הכי כהים.","do":"כתוב lifted_charcoal כדי שהשחורים לא יהיו שחור מוחלט.","why":"צילום אמיתי כמעט אף פעם לא מגיע לשחור מוחלט. תמונה עם שחורים מרוסקים לאפס נראית דיגיטלית."},"grade_contrast":{"what":"כמה חזק המעבר בין אור לצל בעיבוד.","do":"אופציונלי. 'gentle' לרך, 'firm' לחזק."},"grade_saturation":{"what":"כמה עזים הצבעים.","do":"'muted' לדהוי ואלגנטי, 'monochrome' לשחור לבן, 'accurate' לצילום מוצר שבו הצבע חייב להיות נכון."},"grade_wb":{"what":"טמפרטורת הצבע בקלווין. נמוך = כתום וחמים. גבוה = כחול וקר.","do":"אופציונלי. 5500 הוא ניטרלי. 3200 חמים כמו נורת להט. 7000 קר כמו יום מעונן."},"negative_extra":{"what":"דברים שהמודל צריך להימנע מהם.","do":"שורה לכל אחד, באנגלית. כבר יש רשימה אוטומטית של עשרות פריטים, אז הוסף כאן רק אם ראית בעיה חוזרת.","example":"floating product\nreflection that does not match the tent"},"_output":{"target":{"what":"לאיזה מודל הפרומפט מיועד.","do":"כל מודל מקבל את אותו מפרט בניסוח שהוא אוהב. Nano Banana ו־GPT Image מקבלים פרוזה, FLUX מקבל JSON מובנה, ומידג'רני מוגבל ל־320 תווים."},"budget":{"what":"תקרת אורך לפרומפט.","do":"התחל בלי הגבלה. אם נראה שהמודל מתעלם מחלקים, נסה 2,000.","why":"מעבר לאורך מסוים מודלים מפסיקים לקרוא. במקום לחתוך באמצע משפט, המערכת משמיטה סעיפים שלמים לפי סדר חשיבות, ומראה לך בדיוק מה ירד."},"dof":{"what":"עומק השדה: כמה סנטימטרים מהסצנה יצאו חדים.","do":"מחושב אוטומטית מהצמצם, אורך המוקד והמרחק. אם המספר קטן מדי (2 ס\"מ), סגור את הצמצם ל־f/8 או f/11."},"shed":{"what":"רשימת מה שהושמט מהפרומפט בגלל התקציב.","do":"אם משהו שחשוב לך מופיע כאן, הגדל את התקציב או קצר את התיאורים."},"validation":{"what":"בדיקה שהמפרט תקין.","do":"אדום = חייב תיקון. כתום = הפרומפט יעבוד אבל יוצא חלש יותר."}},"_quick":{"recipe":{"what":"סוג התמונה שאתם רוצים. זו הבחירה היחידה שקובעת את כל השאר.","do":"בחרו את מה שהכי קרוב. אפשר להחליף בכל רגע, וכל שאר התשובות מתעדכנות איתה.","why":"לכל סוג צילום יש עדשה, תאורה ומרחק שעובדים בו. במקום לשאול אתכם עליהם, המערכת לוקחת אותם מהמתכון של הסוג שבחרתם."},"subject":{"what":"מה נמצא בתמונה. הדבר היחיד שהמודל באמת לא יכול לנחש.","do":"בחרו מהרשימה, או כתבו בעצמכם. כתיבה עצמית מחליפה רק את המשפט הזה. העדשה, התאורה והחומרים נשארים.","why":"פרומפט בלי נושא מתאר סט ריק. זה הסעיף היחיד שהמערכת אף פעם לא משמיטה, גם כשהפרומפט ארוך מדי."},"environment":{"what":"איפה זה מצולם: סטודיו, בית, חוץ.","do":"בחרו לפי איפה הייתם מצלמים את זה במציאות.","why":"הסביבה קובעת גם את מרחק הרקע, וזה מה שמייצר את הגרדיאנט מאחורי הנושא. רקע רחוק מקבל הרבה פחות אור מהנושא, וזה אחד הדברים שהכי מבדילים תמונה אמיתית מתמונת AI."},"mood":{"what":"התחושה: רך, דרמטי, נקי, כהה.","do":"בחרו את התחושה, לא את הטכניקה. מתחת לכל אפשרות כתוב איזו תוכנית תאורה היא מפעילה.","why":"אווירה בצילום היא לא פילטר. היא כמה מקורות אור יש, איפה הם עומדים וכמה חזק ההפרש ביניהם. הבחירה כאן מחליפה בדיוק את זה."},"aspect":{"what":"צורת התמונה: לאורך, לרוחב או ריבוע.","do":"בחרו לפי איפה התמונה תוצג. 9:16 לסטורי, 4:5 לפיד, 16:9 למצגת.","why":"היחס נכנס לפרומפט עצמו, ובמידג'רני גם כפרמטר ‎--ar. חיתוך אחר כך יאבד חלק מהקומפוזיציה שהמערכת ביקשה."},"moment":{"what":"מה קורה בפריים ברגע שבו הוא צולם.","do":"בחרו רגע, או תארו אחד בעצמכם. ברירת המחדל היא כבר רגע, כי \"בלי רגע\" זו הסיבה הכי שכיחה לתמונה שנראית נכונה ולא מעניינת.","why":"ארבע השאלות שמעל קובעות תמונה שאפשר לצלם. השאלה הזאת קובעת את התמונה שמצולמת. היא גם היחידה כאן שאף שלב עיבוד לא יכול להוסיף בדיעבד."}},"_chrome":{"template":{"what":"נקודת התחלה ריקה לפי סוג צילום. ממלאת את הפרמטרים הטכניים ומשאירה את תיאורי התוכן ריקים, מסומנים TODO.","do":"בחרו סוג צילום, ואז מלאו את השדות שכתוב בהם TODO. אם אתם רוצים משהו שכבר מוכן לגמרי, לכו לדף הדוגמאות במקום."},"load":{"what":"טעינה של קובץ shot.json ששמרתם קודם, או שקיבלתם ממישהו אחר.","do":"לחצו, בחרו את הקובץ מהמחשב, והטופס יתמלא ממנו במלואו. שימושי כדי לחזור לצילום שעבדתם עליו, או כדי להמשיך מצילום של מישהו אחר.","why":"הקובץ הוא המפרט המלא: הנושא, התאורה, המצלמה, החומרים והכול. הוא לא התמונה ולא הפרומפט, אלא המתכון שמייצר אותם."},"download":{"what":"שמירה של כל מה שמילאתם לקובץ אחד במחשב.","do":"לחצו כדי לשמור. הפרומפט עצמו נוצר מחדש מהקובץ הזה בכל פעם, אז אין צורך לשמור גם אותו.","why":"הדף לא זוכר כלום אחרי סגירה: אין כאן שרת ואין חשבון. הקובץ הזה הוא הדרך היחידה לשמור עבודה, וגם הדרך להעביר אותה למישהו אחר."},"status":{"what":"מצב המפרט: תקין, אזהרות או שגיאות.","do":"אדום = חסר משהו שבלעדיו הפרומפט נשבר. כתום = הפרומפט יעבוד אבל ייצא חלש יותר. הפירוט המלא מופיע בתחתית העמודה השמאלית."},"portfolio":{"what":"תיק עבודה: קובץ אחד שמחזיק את כל הדמויות שבניתם ואת המפרט שפתוח עכשיו.","do":"שומרים אותו מדי פעם, במיוחד לפני שסוגרים את הדף. לטעינה חזרה בוחרים בין הוספה למה שכבר שמור לבין החלפה מלאה, והמערכת שואלת מה משתיהן.","why":"הדמויות נשמרות בזיכרון הדפדפן, וזיכרון הדפדפן נמחק כשמנקים אותו. אין כאן שרת ואין חשבון, ולכן הקובץ הזה הוא הדרך היחידה לא לאבד עבודה, וגם הדרך להעביר אותה או להגיש אותה."},"plate":{"what":"לוח הדמות: פרומפט שמצלם את הדמות פעם אחת, שטוח וניטרלי, על רקע אפור.","do":"מייצרים אותו פעם אחת בכל מודל שתרצו, שומרים את התמונה, ורושמים את שם הקובץ בשדה \"שם קובץ תמונת הלוח\". מכאן והלאה מצרפים את התמונה לצד כל פרומפט.","why":"זו תמונה משעממת בכוונה. התפקיד שלה הוא לשמש להשוואה, וכל דבר מעוצב בה, אור מכוון או פוקוס רדוד, הופך לתכונה של הדמות שכל צילום עתידי יורש בטעות."},"inject":{"what":"שימוש בדמות: הכנסת הדמות שבניתם לתוך פרומפט רגיל.","do":"לוחצים על אחד משני הכפתורים. הדמות נכנסת לצילום ולא משנה בו שום דבר אחר: לא את התאורה, לא את הרקע ולא את המצלמה.","why":"דמות אומרת מה הנושא, לא איך לצלם אותו. ההפרדה הזו היא מה שמאפשר לצלם את אותו בקבוק בחמישה רקעים בלי שהוא ישתנה בדרך."}},"_identity":{"name":{"what":"השם שאתם נותנים לדמות, בעברית.","do":"תנו שם שתזהו בעוד חודש. \"הבקבוק של המותג\" עדיף על \"בקבוק 1\".","why":"השם הזה לא נשלח למודל, אף פעם. הוא קיים רק כדי שתמצאו את הדמות ברשימה. זה גם מה ששומר על הכלל שאין דמיון לאדם מזוהה: שם בפרומפט מושך את הפנים לכיוון מישהו מפורסם, ולכן הזהות נישאת על תכונות פיזיות בלבד."},"kind":{"what":"סוג הדמות: אדם, מוצר, אוכל או תכשיט.","do":"בחרו לפי מה שמצולם. הסוג קובע אילו חמש שאלות תישאלו ואיך ייראה לוח הדמות.","why":"לכל סוג יש תכונות אחרות שקובעות זהות. אצל אדם זה מבנה הפנים, אצל מוצר אלה מידות וגימור, ואצל אוכל זה גודל המנה והסידור. החלפת סוג מנקה את התשובות, כי הן לא מתאימות לשאלות החדשות."},"source":{"what":"האם המצאתם את הדמות, או שאתם עובדים מתמונה שכבר יש לכם.","do":"בחרו \"מבוססת על תמונה שלכם\" רק אם התמונה בבעלותכם ויש הסכמה של מי שמצולם בה.","why":"הבחירה הזו לא משנה שום דבר בפרומפט, היא רק קובעת מה הדף מזכיר לכם. בשני המקרים שם של אדם לא נכנס לפרומפט."},"plate":{"what":"שם הקובץ של תמונת לוח הדמות שהפקתם.","do":"הפיקו את פרומפט הלוח פעם אחת, שמרו את התמונה, ורשמו כאן את שם הקובץ בדיוק. מכאן והלאה מצרפים את התמונה הזו לצד כל פרומפט.","why":"התמונה עצמה לא נשמרת כאן ולא נשלחת לשום מקום, רק השם. השם נכנס לפרומפט כדי שהמודל יידע לחפש רפרנס מצורף. זה ההבדל בין לבקש מהמודל לזכור לבין להראות לו."},"seed":{"what":"seed הוא המספר שממנו המודל מתחיל לייצר. אותו מספר עם אותו פרומפט נותן תוצאה דומה.","do":"בחרו מספר כלשהו והשתמשו בו לאורך כל הסדרה. אם יצא לכם פריים טוב, שמרו את ה-seed שלו.","why":"זו העקביות הזולה ביותר שיש והיא עובדת גם לפני שיש לכם לוח. המספר לא נכנס לפרומפט עצמו, הוא נכתב בשדה נפרד בממשק של המודל."},"views":{"what":"הזוויות שיופיעו בלוח הדמות. כל זווית היא פאנל אחד בתוך תמונה אחת.","do":"השאירו את המסומנות כמומלץ. לאדם אלה שש: שלוש של כל הגוף, חזית צד וגב, ושלוש של הפורטרט, חזית שלושת רבעי ופרופיל. השורה העליונה היא הסיבוב והתחתונה היא הפנים. הוסיפו מקרוב על פרט מזהה רק במקום אחת מהן.","why":"זווית אחת לא מספיקה, כי פרופורציות לא נקראות ממבט אחד. גוף נקרא משלוש זוויות, ופנים נקראות משלוש. יותר מזה כבר לא מוסיף מידע, רק גוזל פיקסלים: כל פאנל מקבל חלק מהתמונה, ורפרנס מטושטש לא עוזר לאף אחד. שימו לב לחולשה הידועה של השיטה: המודל מייצר את כל הפאנלים במעבר אחד, ולכן הם עלולים לא להיות זהים זה לזה. הפרומפט אומר את זה במפורש ומכניס את זה גם לנגטיבים, אבל תמיד תשוו את הפאנלים זה לזה לפני שאתם משתמשים בלוח."},"reader":{"what":"קריאה של תמונה שכבר יש לכם, כדי לבנות ממנה את הדמות במקום להמציא אותה.","do":"בחרו קובץ. הדף מודד ממנו מה שאפשר למדוד מפיקסלים, וממלא את שם הקובץ. את מה שרואים בתמונה ממלאים בשלב שאחריו, עם פרומפט הקריאה.","why":"התמונה נקראת כאן בדפדפן ונשכחת. שום בייט ממנה לא נשמר במפרט, בתיק העבודה או באחסון הדפדפן, ושום דבר לא נשלח לשום שרת. שימו לב שהמדידות מתארות את הפריים ולא את הנושא: אור וזווית משתנים בין תמונה לתמונה, ולכן הם לא נכנסים לדמות. הצבעים כן שייכים לנושא."}},"moment_action":{"what":"מה הגוף עושה ברגע הזה, באמצע תנועה ולא בפוזה.","do":"כתבו איפה המשקל ואיזה שריר עובד, לא מי האדם. \"אופה\" הוא נושא ושייך למעלה; \"כל המשקל דרך האמות אל תוך השולחן\" נכון לכל נושא שתבחרו.","why":"פוזה היא מה שאדם עושה כשהוא יודע שמצלמים אותו, ומודל שלא נאמר לו אחרת מייצר בדיוק את זה. תנועה באמצע היא מה שמבדיל בין תמונה של מישהו לבין תמונה של מישהו עושה משהו.","example":"leaning in over the work, weight driven through the forearms into the table, shoulders loaded"},"moment_attention":{"what":"לאן הולכים העיניים והראש.","do":"בצילום של מישהו שעובד זה כמעט אף פעם לא העדשה. אם המבט על העבודה, כתבו את זה במפורש, אחרת המודל יחזיר מבט למצלמה.","why":"מבט למצלמה הופך כל תמונה לפורטרט. ברגע שהמבט על משהו אחר, הצופה מסתכל על מה שקורה במקום שיסתכלו עליו.","example":"head bowed, eyes down on the seam and not on the lens"},"moment_hands":{"what":"מה הידיים נוגעות בו, וכמה חזק.","do":"אופציונלי, ומשתלם. תארו לחץ ולא מיקום: אצבעות שנכנסות לתוך החומר, פרקים שמלבינים, גיד שבולט.","why":"ידיים הן המקום שבו מודל נשבר הכי מהר, וגם המקום היחיד שבו מיומנות נראית בלי שכותבים אותה. יד שאוחזת בכוח נכון מוכיחה שהדבר כבד.","example":"thumbs pressed into the seam, flour packed into the knuckle creases"},"moment_residue":{"what":"מה שהשנייה הקודמת השאירה ועדיין נראה.","do":"אופציונלי. קמח שעוד יורד באוויר, אדים, טבעת רטובה במקום שהכוס עמדה.","why":"זה מה שהופך פריים לרגע בתוך רצף ולא לתמונה שעומדת בפני עצמה. בלי זה התמונה נכונה אבל מרגישה מסודרת מראש.","example":"flour still settling out of the air onto the table"},"moment_foreground":{"what":"הדבר הקרוב ביותר לעדשה, מחוץ לפוקוס.","do":"אופציונלי. בחרו משהו ששייך לסצנה ממילא, לא אביזר שהוספתם בשביל האפקט.","why":"חזית מטושטשת שמה את הצופה בתוך החדר במקום מולו. זו גם השכבה שכמעט אף פעם לא מופיעה בפלט של מודל שלא ביקשו ממנו אותה, כי היא נראית כמו טעות.","example":"a starter jar at the near frame edge, well out of focus"}},"identity_he":{"_doc":"The consistent subject library. A shot spec describes one frame; an identity describes what must stay the same across all of them. Each kind carries two things: the guided fields that turn an idea into a list of invariant traits, and a complete plate spec that photographs that identity once, flat and neutral, so the resulting image can be attached as a reference to every later prompt. The plate is a document, not a picture: even light, mid grey ground, deep focus, no retouching. Note that the imperfections stay switched on, because on a reference plate the flaws are the identity: a scuff in a fixed place is what proves frame two is the same object. Hebrew is interface only. Trait values are English because they go verbatim into the prompt. A person's name is never one of them.","_order":["person","product","food","jewellery"],"kinds":{"person":{"label":"אדם","blurb":"דמות אנושית שחוזרת לאורך סדרה או קמפיין.","caution":"המערכת לא מייצרת דמיון לאדם מזוהה ציבורית, ולא שולחת שם של אף אחד למודל. הזהות נישאת על תכונות פיזיות בלבד. אם אתם עובדים מתמונה של אדם אמיתי, ודאו שהתמונה שלכם ושיש הסכמה.","materials":["skin_face","human_hair"],"fields":[{"key":"build","label":"גיל ומבנה","hint":"טווח גילים ומבנה גוף, לא שם ולא מקצוע","placeholder":"a man in his late fifties, lean, with narrow shoulders","options":[{"value":"a woman in her early thirties, medium build, upright posture","label":"אישה בשנות השלושים, מבנה בינוני"},{"value":"a man in his late fifties, lean, with narrow shoulders","label":"גבר בשנות החמישים, רזה"},{"value":"a woman in her seventies, small framed, slightly stooped","label":"אישה מבוגרת, מבנה קטן"},{"value":"a man in his mid twenties, broad through the chest and shoulders","label":"גבר צעיר, מבנה רחב"},{"value":"a teenager, tall and still filling out, long limbed","label":"נער או נערה, גבוה וצנום"}],"help":{"what":"טווח הגילים ומבנה הגוף. לא שם, לא מקצוע ולא אופי.","do":"כתבו טווח ולא מספר מדויק: \"בשנות החמישים\" עדיף על \"בן 54\". הוסיפו מבנה: רזה, רחב, מבנה קטן.","why":"גיל ומבנה הם מה שהמודל קובע ראשון, ואם לא תגידו הוא ינחש מחדש בכל פריים. זו הסחיפה שהכי בולטת לעין בסדרה."}},{"key":"face","label":"מבנה הפנים","hint":"צורת הפנים ותווי הפנים. זה מה שהמודל הכי נוטה לסחוף","placeholder":"a long face with a square jaw and a slightly hooked nose","options":[{"value":"a long face with a square jaw and a slightly hooked nose","label":"פנים ארוכות, לסת מרובעת, אף מעט מעוקל"},{"value":"a round face with full cheeks and a short straight nose","label":"פנים עגולות, לחיים מלאות, אף קצר"},{"value":"a narrow oval face with high cheekbones and a pointed chin","label":"פנים סגלגלות, עצמות לחיים גבוהות"},{"value":"a broad face with a heavy brow and wide set eyes","label":"פנים רחבות, גבות כבדות, עיניים מרוחקות"},{"value":"a heart shaped face with a wide forehead and a small mouth","label":"פנים משולשות, מצח רחב, פה קטן"}],"help":{"what":"צורת הפנים ותווי הפנים: אורך, לסת, אף, עיניים.","do":"תארו מבנה ולא יופי. \"פנים ארוכות עם לסת מרובעת ואף מעט מעוקל\" עובד, \"פנים יפות\" לא אומר כלום.","why":"זה השדה שהכי מכריע אם הדמות תיראה אותו אדם. פנים הן גם מה שהמודל הכי נוטה למשוך לכיוון ממוצע מוכר, ותיאור מבני הוא מה שעוצר את זה."}},{"key":"hair","label":"שיער","hint":"אורך, מרקם, צבע וקו הצמיחה","placeholder":"short salt and pepper hair, receding at the temples","options":[{"value":"short salt and pepper hair, receding at the temples","label":"קצר, מאפיר, נסוג ברקות"},{"value":"thick dark hair to the shoulders, parted off centre","label":"כהה ועבה עד הכתפיים"},{"value":"tight grey curls cropped close to the head","label":"תלתלים אפורים קצרים"},{"value":"fine blonde hair pulled back, strands escaping at the neck","label":"בלונדיני דק, אסוף"},{"value":"a shaved head with a week of dark stubble across the scalp","label":"מגולח, זיפים כהים"}],"help":{"what":"אורך, מרקם, צבע וקו הצמיחה.","do":"ארבעת אלה ביחד. \"קצר\" לבד לא מספיק, \"קצר ומאפיר, נסוג ברקות\" כן.","why":"שיער תופס שטח גדול בפריים ומשתנה בקלות. קו הצמיחה הוא הפרט שהכי מזוהה ושהכי נשכח."}},{"key":"skin","label":"עור וסימנים מזהים","hint":"גוון, מרקם, וסימן אחד או שניים שחוזרים בכל פריים","placeholder":"olive skin with a small mole below the left eye and deep smile lines","options":[{"value":"olive skin with a small mole below the left eye and deep smile lines","label":"גוון זית, שומה מתחת לעין, קמטי חיוך"},{"value":"fair skin with dense freckles across the nose and cheekbones","label":"בהיר, נמשים על האף והלחיים"},{"value":"deep brown skin with a fine scar through the right eyebrow","label":"חום כהה, צלקת דקה בגבה"},{"value":"weathered skin with sun lines at the outer corners of both eyes","label":"עור מיובש שמש, קמטים בזוויות העיניים"},{"value":"pale skin that flushes at the cheeks and the base of the neck","label":"חיוור, מסמיק בלחיים ובצוואר"}],"help":{"what":"גוון העור, המרקם שלו, וסימן אחד או שניים שחוזרים.","do":"בחרו סימן אחד קבוע: שומה במקום מסוים, צלקת, נמשים באזור מסוים. תמיד באותו מקום.","why":"הסימן הקבוע הוא ההוכחה. בלעדיו יש לכם תיאור של טיפוס, לא של דמות. זו גם השכבה שמודלים מוחקים אוטומטית, כי הם אומנו על תמונות מרוטשות."}},{"key":"wardrobe","label":"לבוש קבוע","hint":"רק אם הלבוש הוא חלק מהזהות. אחרת השאירו ריק ותנו לכל צילום להחליט","placeholder":"a charcoal crew neck and a plain steel watch on the left wrist","options":[{"value":"a charcoal crew neck and a plain steel watch on the left wrist","label":"סוודר פחם ושעון פלדה"},{"value":"a white cotton shirt worn open at the collar, sleeves rolled twice","label":"חולצה לבנה פתוחה, שרוולים מקופלים"},{"value":"a faded denim jacket with a torn left cuff","label":"ג'קט ג'ינס דהוי, שרוול קרוע"},{"value":"thin wire framed glasses and a dark linen apron","label":"משקפיים דקים וסינר פשתן"},{"value":"a heavy knit scarf in undyed wool, wound twice","label":"צעיף צמר גס, כרוך פעמיים"}],"help":{"what":"לבוש שהוא חלק מהזהות ולא חלק מהצילום.","do":"מלאו רק אם הבגד קבוע בכל הפריימים. אם הדמות מחליפה בגדים בין צילומים, השאירו ריק.","why":"השדה היחיד כאן שמותר להשאיר ריק. לבוש שננעל בטעות יופיע גם בצילום שבו התכוונתם להחליף אותו."}}],"plate":{"id":"identity_plate_person","version":1,"genre":"portrait","intent":{"message":"a reference sheet, not a portrait: the face recorded so it can be matched later","reference_tradition":"casting reference photography","usage":"internal reference"},"subject":{"primary":"one person photographed head on against a plain field, neutral expression, jaw relaxed, eyes to the lens, nothing in the frame but the person","secondary":[],"materials":["skin_face","human_hair"],"styling":"no makeup beyond a matte finish, hair off the face so the hairline is visible","scale_cm":40},"set":{"background":"18 percent grey seamless paper, evenly lit, no gradient and no shadow cast onto it","background_distance_cm":200,"surface":"","props":[],"environment":"studio_cyc"},"rig":{"preset":"clamshell_beauty","ambient":"blacked_out","key_to_fill_ratio":"2:1"},"camera":{"body_class":"full_frame_mirrorless","format":"36x24","focal_length_mm":85,"aperture":"f/8","subject_distance_cm":200,"height_cm":160,"shutter":"1/160","iso":100,"focus_point":"the near eye","aspect_ratio":"4:5","shot_size":"medium_close"},"composition":{"layout":"head and shoulders centred, the whole head inside the frame with even margin","subject_placement":"dead centre, no tilt","negative_space":"equal on both sides, because this frame is a record and not a composition","horizon_or_table_line":"no horizon, plain field behind"},"realism":{"level":"editorial","scene_imperfections":["every mark and asymmetry left exactly as it is, because on a reference frame the flaws are the identity"],"retouch_level":"none"},"grade":{"look":"neutral colour, no split toning, nothing stylised","black_point":"lifted_charcoal","contrast_curve":"flat and low contrast so no detail is lost in the shadows","saturation":"true to life, not boosted"},"negative":["dramatic lighting","coloured gels","shallow background blur"],"generation":{"targets":["nano_banana_pro","gpt_image_2","flux2_pro"],"seeds":[11,22,33],"control_tier":"A_text"}},"sheet":{"noun":"person","views":[{"key":"full_front","label":"גוף מלא, חזית","value":"the whole figure standing square to the camera, arms relaxed at the sides, head to feet inside the panel with clear space above the head and below the feet, nothing cropped by the panel edge","note":"פרופורציות, רוחב הכתפיים","recommended":true},{"key":"full_side","label":"גוף מלא, צד","value":"the whole figure standing in a full side view, the shoulders in line with each other, head to feet inside the panel with clear space above the head and below the feet, nothing cropped by the panel edge","note":"יציבה, קו הגב","recommended":true},{"key":"full_back","label":"גוף מלא, גב","value":"the whole figure standing seen from directly behind, head to feet inside the panel with clear space above the head and below the feet, nothing cropped by the panel edge","note":"הגב, השיער מאחור","recommended":true},{"key":"face_front","label":"פורטרט, חזית","value":"head and shoulders only, square to the camera, eyes to the lens, cropped at mid chest","note":"סימטריה ורוחב הפנים","recommended":true},{"key":"face_three_quarter","label":"פורטרט, שלושת רבעי","value":"head and shoulders only, turned three quarters to the subject's left, cropped at mid chest","note":"המבט שקורא הכי הרבה מבנה","recommended":true},{"key":"face_profile","label":"פורטרט, פרופיל","value":"head and shoulders only, a full profile from the subject's right, ear and nose both visible, cropped at mid chest","note":"קו האף והסנטר","recommended":true},{"key":"hands","label":"ידיים","value":"the two hands alone at rest, palms down, no face in this panel","note":"אם הידיים בפריים בסדרה","recommended":false},{"key":"detail_face","label":"מקרוב על הפנים","value":"a tight crop on the eyes, the nose and the identifying marks, no other panel this close","note":"הסימנים המזהים, רק אם ויתרתם על אחד מהשישה","recommended":false}]}},"product":{"label":"מוצר","blurb":"אריזה, בקבוק, מכשיר או כל חפץ שחוזר בסדרת צילומים.","materials":["aged_glass_bottle","matte_abs_plastic"],"fields":[{"key":"form","label":"צורה ומידות","hint":"מידות במספרים. זה הדבר היחיד שהמודל לא יכול להסיק","placeholder":"a cylindrical 500 ml bottle, 22 cm tall and 7 cm across, with a tapered shoulder","options":[{"value":"a cylindrical 500 ml bottle, 22 cm tall and 7 cm across, with a tapered shoulder","label":"בקבוק גלילי 500 מ\"ל"},{"value":"a rectangular carton 18 cm tall, 8 by 5 cm at the base, with sharp folded edges","label":"קרטון מלבני 18 ס\"מ"},{"value":"a squat 60 ml jar, 5 cm tall and 6 cm across, wider than it is high","label":"צנצנת נמוכה 60 מ\"ל"},{"value":"a flat tin 9 cm across and 2 cm deep, with a rolled rim","label":"פחית שטוחה 9 ס\"מ"},{"value":"a handheld device 14 cm long and 3 cm thick, rounded at both ends","label":"מכשיר יד 14 ס\"מ"}],"help":{"what":"הצורה והמידות של המוצר, במספרים.","do":"כתבו גובה ורוחב בסנטימטרים ואת הצורה הכללית: גלילי, מלבני, שטוח. אם יש נפח, ציינו אותו.","why":"מידות הן הדבר היחיד שהמודל לא יכול להסיק משום מקום. בלעדיהן אותו בקבוק יופיע פעם דק ופעם עבה, ואף אחד לא ידע להצביע למה זה נראה שונה."}},{"key":"material","label":"חומר וגימור","hint":"ממה זה עשוי ואיך פני השטח מחזירים אור","placeholder":"amber soda lime glass with a matte etched finish, no gloss anywhere","options":[{"value":"amber soda lime glass with a matte etched finish, no gloss anywhere","label":"זכוכית ענבר מאט"},{"value":"uncoated kraft board with a visible fibre grain","label":"קרטון גולמי עם סיבים"},{"value":"brushed aluminium with the grain running the long way","label":"אלומיניום מוברש"},{"value":"soft touch matte plastic that shows fingerprints","label":"פלסטיק מאט רך"},{"value":"clear glass with a slight green cast at the thick base","label":"זכוכית שקופה, בסיס ירקרק"}],"help":{"what":"ממה המוצר עשוי ואיך פני השטח מחזירים אור.","do":"שני חלקים: החומר עצמו, והגימור. \"זכוכית ענבר\" זה חצי, \"זכוכית ענבר בגימור מאט, בלי ברק\" זה שלם.","why":"אותו חומר במאט ובמבריק הם שני מוצרים שונים לחלוטין בתמונה. הגימור קובע איך נראה כל ברק וכל השתקפות."}},{"key":"colour","label":"צבע מדויק","hint":"צבע לכל חלק בנפרד. אל תסתפקו בשם צבע כללי","placeholder":"a deep amber body with a matte black cap and a bone white label","options":[{"value":"a deep amber body with a matte black cap and a bone white label","label":"גוף ענבר, פקק שחור, תווית לבנה"},{"value":"an off white body with a single warm grey band around the base","label":"לבן שבור עם פס אפור"},{"value":"a matte black body with no colour anywher

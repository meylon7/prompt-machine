          if (!entry) { entry = { role: light.role }; spec.rig.lights.push(entry); }

            globalThis.PM.resolveRig(spec.rig, lib).lights, labels.role);

        const num = (field, labelText, step = 1) => {
          const cell = el('label', 'light-cell');

          input.type = 'number';

          input.value = light[field] ?? '';
          input.addEventListener('change', () => {
            override(field, input.value === '' ? undefined : Number(input.value));

    negative() {
      /* the defaults, each switchable off; the shot's own list; the budget */
      const normalized = globalThis.PM.normalizeSpec(spec);
      const defaults = [...lib.realism.negative_base,
                        ...(lib.realism.negative_by_genre[normalized.genre] || [])];
      const removals = new Set((spec.negative || [])
        .filter((n) => n.startsWith('-')).map((n) => n.slice(1)));
      const allOff = removals.has('*');

      const grid = el('div', 'chip-list');
      for (const negative of defaults) {
        const off = allOff || removals.has(negative);
        const chip = el('button', 'list-chip' + (off ? ' chip-off' : ''), negative);
        chip.title = off ? 'לחיצה מחזירה' : 'לחיצה מכבה';
        chip.addEventListener('click', () => {
          const list = spec.negative || [];
          spec.negative = off
            ? list.filter((n) => n !== `-${negative}`)
            : [`-${negative}`, ...list];
          render();
        });
        grid.append(chip);
      }
      groupPane.append(row('ברירות המחדל (ניתנות לכיבוי)', grid, 'negative_extra'));

      const additions = (spec.negative || []).filter((n) => !n.startsWith('-'));
      const ownList = el('div', 'chip-list');
      for (const item of additions) {
        const chip = el('button', 'list-chip selected-chip', item);
        chip.addEventListener('click', () => {
          spec.negative = spec.negative.filter((n) => n !== item);
          render();
        });
        ownList.append(chip);
      }
      const addInput = el('input', 'free-text');
      addInput.placeholder = 'נגטיב משלך בעברית או באנגלית, ואנטר…';
      addInput.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || !addInput.value.trim()) return;
        let value = addInput.value.trim();
        if (FORM_HEBREW.test(value)) {
          value = globalThis.PM.translateHe(value, lib).text;
        }
        if (!value) return;
        spec.negative = [...(spec.negative || []), value];
        addInput.value = '';
        render();
      });
      const ownWrap = el('div', 'combo');
      ownWrap.append(ownList, addInput);
      groupPane.append(row('נגטיבים של הצילום הזה', ownWrap));

      const budgetInput = el('input', 'free-text num');

        render(false);

      groupPane.append(row('תקציב תווים לפרוזה (רשות)', budgetInput));

  function render(rebuildEditor = true) {
    if (rebuildEditor) {
      renderGroupBar();
      groupPane.innerHTML = '';
      const explain = GROUP_EXPLAIN[activeGroup]
        ? explainToggle(GROUP_EXPLAIN[activeGroup]()) : null;
      if (explain) groupPane.append(explain);
      RENDERERS[activeGroup]();
    }
    pane.render();
  }

  render();

  return {
    getSpec() { return spec; },
    load(newSpec) {
      spec = toAuthoringShape(newSpec);
      activeGroup = 'basis';
      render();
    },
    setIdentity(identity, seed) {
      spec.identity = identity;
      if (seed) {
        spec.generation = { ...(spec.generation || {}), seeds: [Number(seed)] };
      }
      render();
    },
  };
}

/* Prompt Machine — the consistent subject. A shot spec describes one frame;
   an identity describes what must stay the same across a series: measurable
   traits, a reference sheet, a seed. The label stays in the form and never
   reaches a model; identity travels as traits.

   The kinds are a library, not a wall: a kind nobody wrote fields for is a
   subject that can still be described, through free traits. */
'use strict';

const ID_HEBREW = /[֐-׿]/;

const SHEET_ASPECTS = ['1:1', '4:5', '5:4', '3:2', '2:3', '16:9'];

function sheetGrid(count) {
  const cols = count <= 3 ? count : Math.ceil(count / 2);
  const rows = Math.ceil(count / cols);
  return { cols, rows };
}

function nearestAspect(target) {
  let best = SHEET_ASPECTS[0];
  let bestDiff = Infinity;
  for (const aspect of SHEET_ASPECTS) {
    const [w, h] = aspect.split(':').map(Number);
    const diff = Math.abs(w / h - target);
    if (diff < bestDiff) { bestDiff = diff; best = aspect; }
  }
  return best;
}

/* the reference sheet spec: the kind's neutral plate, its subject replaced
   by the grid of views. A plate is a document and not a picture. */
function composeSheet(kindData, identity, viewKeys, noun) {
  const spec = JSON.parse(JSON.stringify(kindData.plate));
  const views = kindData.sheet.views.filter((v) => viewKeys.includes(v.key));
  const count = views.length;
  const { cols, rows } = sheetGrid(count);
  /* a person reads best in a 2:3 panel, an object in a square one */
  const panelRatio = noun === 'person' ? 2 / 3 : 1;
  const aspect = nearestAspect((cols * panelRatio) / rows);

  const rowMap = [];
  for (let r = 0; r < rows; r += 1) {
    const inRow = Math.min(cols, count - r * cols);
    rowMap.push(`row ${r + 1} holds exactly ${inRow} panels`);
  }
  const panels = views.map((view, index) => `panel ${index + 1}: ${view.value}`);

  spec.subject.primary =
    `a reference sheet: ${count} panels of the same ${noun} on one frame, `
    + `arranged in ${rows} ${rows === 1 ? 'row' : 'rows'} of ${cols}. `
    + `${rowMap.join('; ')}; a row ${rows + 1} is forbidden, and so is any `
    + `panel the count does not name. ${panels.join('. ')}.`
    + (count > 1
      ? ' Render full surface texture at panel scale: a subject drawn small '
        + 'must keep the same micro detail it would carry in a full frame.'
      : '');
  spec.composition = {
    layout: `a clean grid, ${rowMap.join('; ')}, equal margins between panels`,
    subject_placement: 'every panel centred, the subject whole inside it, nothing cropped by a panel edge',
    negative_space: 'thin even margins only, no captions and no text',
    horizon_or_table_line: 'no horizon, the ground is the plain sheet background',
  };
  spec.camera.aspect_ratio = aspect;
  spec.identity = {
    reference: identity.reference || undefined,
    traits: identity.traits,
  };
  return spec;
}

/* ------------------------------------------------------------------ UI -- */

function initIdentity(root, lib, hooks = {}) {
  const idLib = lib.identity_he;

  const state = {

    customKind: '',
    label: '',
    traits: {},          /* guided field key -> english value */
    extraTraits: [],
    reference: '',
    seed: '',
    views: null,         /* null -> the recommended set */
  };

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const translate = (text) => (ID_HEBREW.test(text)
    ? globalThis.PM.translateHe(text, lib).text : text);

  function kindData() {
    return state.kind && state.kind !== 'custom'
      ? idLib.kinds[state.kind] : null;
  }

  function currentTraits() {
    const traits = [];
    const data = kindData();
    if (data) {
      for (const field of data.fields) {
        const value = (state.traits[field.key] || '').trim();
        if (value) traits.push(value);
      }
    }
    return [...traits, ...state.extraTraits];
  }

  function currentViews() {
    const data = kindData();
    if (!data) return [];
    if (state.views) return state.views;
    return data.sheet.views.filter((v) => v.recommended).map((v) => v.key);
  }

  function identityObject() {
    return {
      key: state.label ? state.label.replace(/\s+/g, '_') : 'identity',
      label: state.label,
      reference: state.reference || undefined,
      traits: currentTraits(),
    };
  }

  function sheetSpec() {
    const data = kindData();
    if (!data || !currentTraits().length) return null;
    const noun = state.kind === 'custom'
      ? (translate(state.customKind) || 'subject') : data.sheet.noun;

          }
        },
      },
      {
        label: 'הורדת identity.json',
        onClick: () => {

  /* ---- tabs ---- */
  const STEPS = [

  function freeInput(placeholder, value, onSet) {

        note.textContent = text ? `תורגם: ${text} → ${result.text}` : '';
        text = result.text;
        input.value = text;
      } else {
        note.textContent = '';
      }
      onSet(text);
      render(false);

    const wrap = el('div', 'combo');
    wrap.append(input, note);
    return wrap;
  }

  const RENDERERS = {
    kind() {
      stepPane.append(globalThis.PM.explainToggle([
        help._identity && help._identity.kind,
        { what: idLib._doc.split('.')[0] + '.' },
      ]));
      const grid = el('div', 'tile-grid picker-grid');
      for (const key of idLib._order) {
        const kind = idLib.kinds[key];
        const tile = el('button',
          'tile option-tile' + (state.kind === key ? ' selected' : ''));
        tile.append(el('span', 'tile-label', kind.label));
        tile.append(el('span', 'tile-sub', kind.blurb));
        tile.addEventListener('click', () => {

        });
        grid.append(tile);
      }
      const custom = el('button',
        'tile option-tile' + (state.kind === 'custom' ? ' selected' : ''));
      custom.append(el('span', 'tile-label', 'סוג אחר'));
      custom.append(el('span', 'tile-sub',

      custom.addEventListener('click', () => {
        state.kind = 'custom';
        render();
      });
      grid.append(custom);
      stepPane.append(grid);

      if (state.kind === 'custom') {
        stepPane.append(el('div', 'panel-label', 'מה הנושא? (עברית או אנגלית)'));
        stepPane.append(freeInput('bread loaf / כיכר לחם…', state.customKind,
          (text) => { state.customKind = text; }));
      }
      if (state.kind === 'person') {
        stepPane.append(el('div', 'rule-note',
          'הכלל של המערכת: שום דמיון לאדם אמיתי מזוהה. הדמות מתוארת בתכונות '

      stepPane.append(el('div', 'panel-label', 'שם הדמות (נשאר בטופס, לא בפרומפט)'));
      const labelInput = el('input', 'free-text');
      labelInput.value = state.label;
      labelInput.placeholder = 'למשל: בקבוק הבירה של המותג';
      labelInput.addEventListener('change', () => {
        state.label = labelInput.value.trim();
        render(false);
      });
      stepPane.append(labelInput);
    },

    traits() {
      const data = kindData();
      stepPane.append(globalThis.PM.explainToggle([
        { what: 'התכונות הקבועות של הדמות: מה חייב לחזור זהה בכל פריים בסדרה.',
          do: 'מספרים ועובדות מדידות מנצחים תיאורים. "בקבוק 500 מ"ל, גובה 22 ס"מ" עדיף על "בקבוק גדול".' },
      ]));
      if (!data && state.kind !== 'custom') {
        stepPane.append(el('div', 'placeholder-sub', 'בחר קודם סוג דמות בטאב הראשון.'));
        return;
      }
      if (data) {
        for (const field of data.fields) {
          const label = el('div', 'field-label');
          label.append(document.createTextNode(field.label));
          if (field.hint) {
            const mark = el('button', 'help-mark', '?');
            mark.type = 'button';
            globalThis.PM.attachPopover(mark, { lines: [field.hint] });
            label.append(mark);
          }
          stepPane.append(label);
          if (field.options && field.options.length) {
            const select = el('select', 'field-select');
            select.append(new Option('טרם הוחלט', ''));
            for (const option of field.options) {
              select.append(new Option(option.label || option.value, option.value));
            }
            select.value = state.traits[field.key] || '';
            select.addEventListener('change', () => {
              state.traits[field.key] = select.value;
              render(false);
            });
            stepPane.append(select);
          }
          stepPane.append(freeInput(field.placeholder || '', state.traits[field.key] || '',
            (text) => { state.traits[field.key] = text; }));

      }
      stepPane.append(el('div', 'panel-label', 'תכונות נוספות (עברית או אנגלית, אנטר להוספה)'));
      const list = el('div', 'chip-list');
      const redraw = () => {
        list.innerHTML = '';
        state.extraTraits.forEach((trait, index) => {
          const chip = el('button', 'list-chip selected-chip', trait);
          chip.addEventListener('click', () => {
            state.extraTraits.splice(index, 1);
            redraw();
            render(false);
          });
          list.append(chip);
        });
      };
      redraw();
      const input = el('input', 'free-text');
      input.placeholder = 'a hairline chip on the base rim…';
      input.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || !input.value.trim()) return;
        state.extraTraits.push(translate(input.value.trim()));
        input.value = '';
        redraw();
        render(false);
      });
      stepPane.append(list, input);
    },

    sheet() {
      const data = kindData();
      stepPane.append(globalThis.PM.explainToggle([
        { what: idLib._sheet_doc.split('.').slice(0, 2).join('.') + '.' },
      ]));
      if (!data) {
        stepPane.append(el('div', 'placeholder-sub',
          'לוח ייחוס נבנה מסוג דמות מהספרייה. לסוג חופשי: הוסף תכונות והחל על הטופס.'));
        return;
      }
      stepPane.append(el('div', 'panel-label', 'אילו מבטים ייכנסו ללוח?'));
      const grid = el('div', 'tile-grid option-grid');
      const chosen = currentViews();
      for (const view of data.sheet.views) {
        const selected = chosen.includes(view.key);
        const tile = el('button', 'tile option-tile' + (selected ? ' selected' : ''));
        tile.append(el('span', 'tile-label', view.label));
        tile.append(el('span', 'tile-sub', view.note));
        tile.addEventListener('click', () => {
          const next = selected
            ? chosen.filter((k) => k !== view.key)
            : [...chosen, view.key];
          state.views = data.sheet.views
            .filter((v) => next.includes(v.key)).map((v) => v.key);
          render();
        });
        grid.append(tile);
      }
      stepPane.append(grid);

      const { cols, rows } = sheetGrid(chosen.length);
      stepPane.append(el('div', 'field-note',
        `${chosen.length} פאנלים → ${rows} שורות של ${cols}. `
        + 'הפרומפט משמאל הוא לוח הייחוס: הרץ אותו פעם אחת, שמור את התוצאה, '
        + 'וצרף אותה לכל פריים בסדרה.'));

      stepPane.append(el('div', 'panel-label', 'שם קובץ הרפרנס (אחרי שתריץ את הלוח)'));
      const refInput = el('input', 'free-text');
      refInput.value = state.reference;
      refInput.placeholder = 'my_bottle_sheet.png';
      refInput.addEventListener('change', () => {
        state.reference = refInput.value.trim();
        render(false);
      });
      stepPane.append(refInput);

      stepPane.append(el('div', 'panel-label', 'Seed (אותו מספר בכל פריימי הסדרה)'));
      const seedInput = el('input', 'free-text num');
      seedInput.value = state.seed;
      seedInput.placeholder = '11';
      seedInput.addEventListener('change', () => {
        state.seed = seedInput.value.trim();
        render(false);
      });
      stepPane.append(seedInput);

      if (!state.reference || !state.seed) {
        stepPane.append(el('div', 'rule-note',
          'תכונות לבדן נותנות עקביות חלקית. בלי קובץ רפרנס ובלי seed קבוע, '
          + 'פריים שני לא יהיה אותה דמות בדיוק, וזה נאמר כאן בקול כי שלב '
          + 'הלוח קיים בדיוק בשביל זה.'));
      }
    },
  };

  function render(rebuild = true) {
    if (rebuild) {
      renderStepBar();
      stepPane.innerHTML = '';
      RENDERERS[activeStep]();
    }
    pane.render();
  }

  render();
}

/* Prompt Machine — the examples library. Thirteen finished specs shipped with
   the tool, compiled in the browser by the same compiler as everything else,
   so an example can never drift from what the tool actually produces. Each
   example names spans of its finished prompt that are safe to replace; a
   checkbox wraps them in square brackets on demand and ships unchecked, so
   every example is usable exactly as it is. */
'use strict';

function initExamples(container, lib, hooks = {}) {
  const PM = globalThis.PM;
  const data = lib.examples_he;
  const shots = lib.example_shots || {};

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  let activeId = data._order[0];
  let activeDialect = 'nano';
  let markSwaps = false;

  const layout = el('div', 'quick-layout');
  container.append(layout);

  /* ---- main: the example browser ---- */
  const main = el('section', 'panel');
  layout.append(main);

  const header = el('div', 'panel-header');
  header.append(el('span', 'panel-title', 'ספריית הדוגמאות'));
  header.append(el('span', 'chip-meta', `${data._order.length} עבודות גמורות`));
  main.append(header);

  main.append(el('p', 'section-hint',
    'שלוש עשרה עבודות גמורות, מקצה לקצה. הפרומפט משמאל מקומפל עכשיו, מהמפרט, '
    + 'באותו קומפיילר של שאר המערכת. אפשר להעתיק כמו שהוא, לסמן את החלקים '
    + 'שמחליפים, או לפתוח את המפרט המלא בטופס המקצועי ולערוך הכל.'));

  const grid = el('div', 'example-grid');
  main.append(grid);
  for (const id of data._order) {
    const entry = data.examples[id];
    const tile = el('button', 'example-tile');
    tile.dataset.id = id;
    tile.append(el('span', 'example-tile-title', entry.title));
    const tagRow = el('span', 'example-tile-tags');
    for (const tag of entry.tags) tagRow.append(el('span', 'chip-meta', tag));
    tile.append(tagRow);
    tile.addEventListener('click', () => { activeId = id; render(); });
    grid.append(tile);
  }

  /* the chosen example, explained */
  const detail = el('div', 'example-detail');
  main.append(detail);

  /* ---- aside: the compiled prompt ---- */
  const aside = el('aside', 'quick-output panel');
  layout.append(aside);

  const outHeader = el('div', 'panel-header');
  outHeader.append(el('span', 'panel-title', 'הפרומפט'));
  const statusPill = el('span', 'status-pill ok', 'מוכן להעתקה');
  outHeader.append(statusPill);
  aside.append(outHeader);

  const dialectTabs = el('div', 'tabs dialect-tabs');
  for (const [key, label] of [['nano', 'Nano Banana'], ['gpt', 'GPT Image'],
                              ['flux', 'FLUX'], ['midjourney', 'Midjourney']]) {
    const tab = el('button', 'tab', label);
    tab.dataset.dialect = key;
    tab.addEventListener('click', () => { activeDialect = key; render(); });
    dialectTabs.append(tab);
  }
  aside.append(dialectTabs);

  const metaRow = el('div', 'meta-row');
  const chipChars = el('span', 'chip-meta');
  const chipDof = el('span', 'chip-meta');
  metaRow.append(chipChars, chipDof);
  aside.append(metaRow);

  const swapRow = el('label', 'swap-toggle');
  const swapBox = document.createElement('input');
  swapBox.type = 'checkbox';
  swapBox.addEventListener('change', () => { markSwaps = swapBox.checked; render(); });
  swapRow.append(swapBox,
    el('span', undefined, 'לסמן בסוגריים מרובעים את החלקים שמחליפים'));
  aside.append(swapRow);

  const promptBox = el('pre', 'prompt-box mono');
  aside.append(promptBox);

  const buttonRow = el('div', 'button-row');
  aside.append(buttonRow);

  const copyBtn = el('button', 'btn-run', 'העתקת הפרומפט');
  copyBtn.addEventListener('click', async () => {
    const text = promptBox.textContent;
    try {
      await navigator.clipboard.writeText(text);
    } catch {
      const area = document.createElement('textarea');
      area.value = text;
      document.body.append(area);
      area.select();
      document.execCommand('copy');
      area.remove();
    }
    copyBtn.textContent = 'הועתק ✓';
    setTimeout(() => { copyBtn.textContent = 'העתקת הפרומפט'; }, 1400);
  });
  buttonRow.append(copyBtn);

  const openBtn = el('button', 'btn-ghost', 'פתיחה בטופס המקצועי');
  openBtn.addEventListener('click', () => {
    if (hooks.openInPro) {
      hooks.openInPro(JSON.parse(JSON.stringify(shots[activeId])));
    }
  });
  buttonRow.append(openBtn);

  const escapeHtml = (text) => text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  function render() {
    const entry = data.examples[activeId];
    const spec = shots[activeId];

    for (const tile of grid.children) {
      tile.classList.toggle('selected', tile.dataset.id === activeId);
    }
    for (const tab of dialectTabs.children) {
      tab.className = 'tab '
        + (tab.dataset.dialect === activeDialect ? 'active' : 'inactive');
    }

    detail.innerHTML = '';
    detail.append(el('h3', 'example-detail-title', entry.title));
    detail.append(el('p', 'example-why', entry.why));
    const legend = el('div', 'swap-legend');
    legend.append(el('span', 'section-label', 'מה בטוח להחליף כאן'));
    for (const [span, label] of entry.swaps) {
      const row = el('div', 'swap-legend-row');
      row.append(el('span', 'swap-legend-he', label));
      row.append(el('code', 'swap-legend-en mono', span));
      legend.append(row);
    }
    detail.append(legend);

    let prompt = PM.compile(spec, lib, activeDialect);

    /* the spans are found in the finished prompt, not templated into it */
    let html = escapeHtml(prompt);
    for (const [span, label] of entry.swaps) {
      const escaped = escapeHtml(markSwaps ? `[${span}]` : span);
      const source = escapeHtml(span);
      const at = html.indexOf(source);
      if (at === -1) continue; /* midjourney may have shed the section */
      html = `${html.slice(0, at)}<span class="swap" data-label="${
        escapeHtml(label)}">${escaped}</span>${html.slice(at + source.length)}`;
    }
    promptBox.innerHTML = html;
    for (const span of promptBox.querySelectorAll('.swap')) {
      PM.attachPopover(span, {
        title: span.dataset.label,
        lines: [{ text: 'קטע שבטוח להחליף בטקסט משלכם. שאר הפרומפט נושא את הפיזיקה.' }],
      });
    }

    chipChars.textContent = `${promptBox.textContent.length.toLocaleString('en')} CHARS`;
    const dof = PM.depthOfField(PM.normalizeSpec(spec).camera);
    chipDof.textContent = dof
      ? (dof.far_cm === null ? `DOF ${dof.near_cm}cm - INF`
                             : `DOF ${dof.total_cm}cm SHARP`)
      : 'DOF -';
  }

  render();
  return { render };
}

/* Prompt Machine — "how it works". Every panel on this page is produced by
   the compiler and the translator that ship in the same file, from specs that
   ship beside them, so the page cannot claim something the build stopped
   doing. Nothing here is a quoted screenshot of an old output. */
'use strict';

function initExplain(container, lib) {
  const PM = globalThis.PM;

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const spec = lib.example_shots.portrait_window_morning;
  const rigSpec = lib.example_shots.product_watch_black_acrylic;

  const panel = el('section', 'panel');
  container.append(panel);

  const header = el('div', 'panel-header');
  header.append(el('span', 'panel-title', 'איך זה עובד'));
  header.append(el('span', 'chip-meta', 'כל פאנל כאן קומפל הרגע, לא צוטט'));
  panel.append(header);

  const STEPS = ['הרעיון', 'סדר הסעיפים', 'עומק שדה', 'תאורה בלי שמות',
                 'עברית לפרומפט', 'תקציב תווים'];
  let activeStep = 0;

  const stepBar = el('div', 'step-tabs');
  panel.append(stepBar);

  const panes = STEPS.map(() => {
    const pane = el('div', 'explain-pane');
    pane.hidden = true;
    panel.append(pane);
    return pane;
  });

  function renderSteps() {
    stepBar.innerHTML = '';
    STEPS.forEach((name, index) => {
      const btn = el('button', 'step-tab' + (index === activeStep ? ' active' : ''));
      btn.append(el('span', 'step-num', String(index + 1)));
      const textWrap = el('span', 'step-text');
      textWrap.append(el('span', 'step-name', name));
      btn.append(textWrap);
      btn.addEventListener('click', () => {
        activeStep = index;
        renderSteps();
      });
      stepBar.append(btn);
    });
    panes.forEach((pane, index) => { pane.hidden = index !== activeStep; });
  }

  const hint = (pane, text) => pane.append(el('p', 'section-hint', text));
  const mono = (pane, text) => {
    const box = el('pre', 'prompt-box mono explain-mono');
    box.textContent = text;
    pane.append(box);
    return box;
  };

  /* ---- 1. the idea ---- */
  {
    const pane = panes[0];
    hint(pane,
      'מודל תמונה לא צריך שמות תואר, הוא צריך מפרט צילום. במקום "תמונה יפה '
      + 'ומקצועית" המכונה בונה מפרט: מי הנושא, מה הרגע, איך בנוי הסט, מה כל '
      + 'מקור אור עושה, איזו עדשה ומאיזה מרחק, אילו חומרים, אילו פגמים '
      + 'להשאיר. הפיזיקה יושבת במפרט; הקוד רק מתרגם אותה לפרוזה שהמודל מבין.');
    pane.append(el('div', 'section-label', 'קטע מהמפרט של "פורטרט באור חלון"'));
    mono(pane, JSON.stringify({
      subject: spec.subject,
      rig: spec.rig,
      camera: {
        focal_length_mm: spec.camera.focal_length_mm,
        aperture: spec.camera.aperture,
        subject_distance_cm: spec.camera.subject_distance_cm,
      },
    }, null, 2));
    pane.append(el('div', 'section-label', 'ומה שהקומפיילר עשה ממנו הרגע'));
    const prompt = PM.compile(spec, lib, 'nano');
    mono(pane, prompt.split('\n').slice(0, 2).join('\n'));
    hint(pane,
      'אותו מפרט מקומפל לארבעה דיאלקטים: פרוזה ל-Nano Banana ול-GPT Image, '
      + 'JSON ל-FLUX, ופרומפט של 320 תווים למידג׳רני. מפרט אחד, ארבע שפות.');
  }

  /* ---- 2. section order ---- */
  {
    const pane = panes[1];
    hint(pane,
      'הפרוזה איננה טקסט חופשי. לכל פרומפט אותם סעיפים, באותו סדר, כל אחד '
      + 'עם תפקיד אחד. אלה הסעיפים של "פורטרט באור חלון", מקומפלים עכשיו:');
    const HE = {
      subject: 'הנושא: המשפט הפותח',
      moment: 'MOMENT: גוף, מבט, ידיים, שאריות הפעולה',
      set: 'SET: רקע, משטח, אביזרים',
      composition: 'FRAMING: פריסת הפריים',
      lighting_plot: 'LIGHTING PLOT: מה כל מקור עושה',
      consequences: 'WHAT THE LIGHT DOES: התוצאות הפיזיקליות',
      materials: 'MATERIALS: איך כל חומר מתנהג באור',
      camera: 'CAMERA: פורמט, עדשה, צמצם ועומק שדה מחושב',
      capture_character: 'CAPTURE CHARACTER: חתימת האופטיקה והחיישן',
      imperfections: 'IMPERFECTIONS TO KEEP: הפגמים שנשארים',
      grade: 'GRADE: הצבע והקונטרסט',
      negative: 'DO NOT PRODUCE: מה אסור שיקרה',
    };
    const ir = PM.buildIR(PM.normalizeSpec(spec), lib);
    for (const [name, text] of PM.proseSections(ir)) {
      pane.append(el('div', 'section-label', HE[name] || name));
      mono(pane, text);
    }
  }

  /* ---- 3. depth of field ---- */
  {
    const pane = panes[2];
    hint(pane,
      'עומק השדה לא מתואר במילים, הוא מחושב: מהפורמט, מאורך המוקד, מהצמצם '
      + 'ומהמרחק לנושא, ונכנס לפרומפט כמספר. נסו לשנות את הצמצם של הפורטרט '
      + 'ולראות את אזור החדות זז:');
    const seg = el('div', 'segmented');
    pane.append(seg);
    const result = el('div');
    pane.append(result);
    const APERTURES = ['f/1.4', 'f/2', 'f/2.8', 'f/4', 'f/8', 'f/16'];
    let chosen = spec.camera.aperture;
    const draw = () => {
      seg.innerHTML = '';
      for (const f of APERTURES) {
        const btn = el('button', 'segment' + (f === chosen ? ' active' : ''), f);
        btn.addEventListener('click', () => { chosen = f; draw(); });
        seg.append(btn);
      }
      const cam = { ...spec.camera, aperture: chosen };
      const dof = PM.depthOfField(cam);
      result.innerHTML = '';
      result.append(el('div', 'section-label',
        `${cam.focal_length_mm} מ"מ על ${cam.format}, ב-${chosen}, `
        + `${cam.subject_distance_cm} ס"מ מהנושא`));
      mono(result,
        `sharp zone ${dof.near_cm}cm to ${dof.far_cm === null ? 'infinity' : `${dof.far_cm}cm`}`
        + (dof.total_cm !== null && dof.far_cm !== null
          ? `, ${dof.total_cm}cm deep` : ''));
      result.append(el('p', 'section-hint',
        'המספר הזה נכנס למשפט המצלמה בפרומפט. מודל שמקבל "אזור חדות של '
        + 'סנטימטרים בודדים" מצייר אופטיקה אמיתית במקום טשטוש דקורטיבי.'));
    };
    draw();
  }

  /* ---- 4. lighting without equipment names ---- */
  {
    const pane = panes[3];
    hint(pane,
      'כלל ברזל: שום שם ציוד תאורה לא מגיע לפרומפט. מודל שמקבל "סטריפבוקס" '
      + 'מצייר סטריפבוקס בתוך הפריים. הציוד נשאר במפרט, בסקיצה ובממשק, '
      + 'ולמודל נוסעים רק הכיוון, הגובה, המרחק, היחס ומה שהאור עושה לצל, '
      + 'לעין ולהשתקפות. זה הריג של "מוצר על אקריל שחור" כפי שאתם רואים אותו:');
    const rig = PM.resolveRig(rigSpec.rig, lib);
    const roleLabels = lib.labels_he.role;
    const rigList = el('div', 'explain-rig-list');
    for (const light of rig.lights) {
      const row = el('div', 'swap-legend-row');
      row.append(el('span', 'swap-legend-he',
        roleLabels[light.role] || light.role));
      row.append(el('code', 'swap-legend-en mono', light.modifier));
      rigList.append(row);
    }
    pane.append(rigList);
    const sketchWrap = el('div', 'sketch-wrap');
    sketchWrap.innerHTML = PM.sketchSVG(rig.lights, roleLabels);
    pane.append(sketchWrap);
    pane.append(el('div', 'section-label', 'ומה שהמודל מקבל במקום השמות'));
    const ir = PM.buildIR(PM.normalizeSpec(rigSpec), lib);
    const sections = PM.proseSections(ir);
    for (const wanted of ['lighting_plot', 'consequences']) {
      const found = sections.find(([name]) => name === wanted);
      if (found) mono(pane, found[1]);
    }
    hint(pane,
      'מי שבכל זאת רוצה את השמות בפרומפט מדליק name_equipment במפרט. '
      + 'ברירת מחדל איננה קיר.');
  }

  /* ---- 5. hebrew in, english out ---- */
  {
    const pane = panes[4];
    hint(pane,
      'הממשק בעברית, הפרומפט באנגלית, ועברית לעולם לא מגיעה למודל. טקסט '
      + 'חופשי עובר דרך לקסיקון של המערכת: סמיכות מתהפכת, תואר עובר לפני שם '
      + 'העצם, ומילה שהלקסיקון לא מכיר מדווחת ומושמטת, לא מנוחשת. נסו:');
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'free-text';
    input.value = 'שולחן עץ ישן על רקע קיר לבן';
    pane.append(input);
    const out = el('div');
    pane.append(out);
    const run = () => {
      out.innerHTML = '';
      const result = PM.translateHe(input.value, lib);
      mono(out, result.text || '-');
      if (result.unknown.length) {
        out.append(el('p', 'rule-note',
          `מילים שהלקסיקון לא מכיר ולכן הושמטו: ${result.unknown.join(', ')}`));
      }
    };
    input.addEventListener('input', run);
    run();
  }

  /* ---- 6. character budget ---- */
  {
    const pane = panes[5];
    hint(pane,
      'למידג׳רני יש תקציב של 320 תווים. תקציב לא חותך טקסט באמצע משפט: הוא '
      + 'מוריד סעיפים שלמים לפי סדר ויתור קבוע, והנושא, תוכנית התאורה, מה '
      + 'שהאור עושה והמצלמה מוגנים תמיד. בחרו תקציב ותראו מה נשאר מהפורטרט:');
    const seg = el('div', 'segmented');
    pane.append(seg);
    const out = el('div');
    pane.append(out);
    const BUDGETS = [['ללא תקציב', null], ['2,000', 2000],
                     ['1,200', 1200], ['700', 700]];
    let chosen = 1200;
    const draw = () => {
      seg.innerHTML = '';
      for (const [label, value] of BUDGETS) {
        const btn = el('button', 'segment' + (value === chosen ? ' active' : ''), label);
        btn.addEventListener('click', () => { chosen = value; draw(); });
        seg.append(btn);
      }
      const ir = PM.buildIR(PM.normalizeSpec(spec), lib);
      const { sections, log } = PM.applyBudget(PM.proseSections(ir), chosen);
      const text = sections.map(([, t]) => t).join('\n');
      out.innerHTML = '';
      out.append(el('div', 'section-label',
        `${text.length.toLocaleString('en')} תווים, ${sections.length} סעיפים`));
      for (const line of log) out.append(el('p', 'rule-note', line));
      mono(out, text);
    };
    draw();
    hint(pane,
      'הפרומפט המידג׳רני עצמו נבנה באותו עיקרון, עם זנב ‎--no קבוע שגם אותו '
      + 'אפשר לכבות. שום סעיף לא נחתך באמצע; או שהוא נכנס שלם, או שהוא יורד '
      + 'ומדווח.');
  }

  renderSteps();
  return {};
}

/* Prompt Machine — login gate and cloud saves, on Supabase, with no server
   of our own. The anon key that ships in the page is public by design: every
   data rule is row level security in the database (supabase/setup.sql), and
   the client never gets to decide what it may read or write.

   An empty auth_config.url disables the whole module: local builds, tests
   and file:// fallbacks behave exactly as before. */
'use strict';

function createSupabase(config) {
  const base = config.url.replace(/\/$/, '');
  const KEY = 'pm_session';

  let session = null;
  try {
    session = JSON.parse(localStorage.getItem(KEY) || 'null');
  } catch { session = null; }

  const persist = (next) => {
    session = next;
    if (next) localStorage.setItem(KEY, JSON.stringify(next));
    else localStorage.removeItem(KEY);
  };

  const packSession = (body) => ({
    access_token: body.access_token,
    refresh_token: body.refresh_token,
    expires_at: Math.floor(Date.now() / 1000) + (body.expires_in || 3600),
    user: {
      id: body.user && body.user.id,
      email: body.user && body.user.email,
      name: (body.user && body.user.user_metadata
             && body.user.user_metadata.name) || '',
    },
  });

  async function request(path, { method = 'GET', body, auth = true } = {}) {
    const headers = { apikey: config.anon_key, 'Content-Type': 'application/json' };
    if (auth && session) headers.Authorization = `Bearer ${session.access_token}`;
    let resp;
    try {
      resp = await fetch(base + path, {
        method, headers, body: body === undefined ? undefined : JSON.stringify(body),
      });
    } catch {
      throw { network: true };
    }
    const text = await resp.text();
    const data = text ? JSON.parse(text) : null;
    if (!resp.ok) throw { status: resp.status, data };
    return data;
  }

  async function ensureFresh() {
    if (!session) return null;
    if (session.expires_at - 60 > Date.now() / 1000) return session;
    try {
      const body = await request('/auth/v1/token?grant_type=refresh_token', {
        method: 'POST', auth: false,
        body: { refresh_token: session.refresh_token },
      });
      persist(packSession(body));
    } catch (err) {
      if (!err.network) persist(null); /* stale refresh token: signed out */
    }
    return session;
  }

  return {
    get session() { return session; },
    ensureFresh,

    /* a confirmation-required signup returns a user but no session */
    async signup(email, password, name) {
      const body = await request('/auth/v1/signup', {
        method: 'POST', auth: false,
        body: { email, password, data: { name } },
      });
      if (body && body.access_token) { persist(packSession(body)); return 'session'; }
      return 'confirm_email';
    },

    async login(email, password) {
      const body = await request('/auth/v1/token?grant_type=password', {
        method: 'POST', auth: false, body: { email, password },
      });
      persist(packSession(body));
    },

    async logout() {
      try {
        await request('/auth/v1/logout', { method: 'POST' });
      } catch { /* the local sign-out matters either way */ }
      persist(null);
    },

    async recover(email) {
      await request('/auth/v1/recover', {
        method: 'POST', auth: false, body: { email },
      });
    },

    async resendConfirmation(email) {
      await request('/auth/v1/resend', {
        method: 'POST', auth: false, body: { type: 'signup', email },
      });
    },

    async setPassword(password) {
      await request('/auth/v1/user', { method: 'PUT', body: { password } });
    },

    /* email links (confirm / recovery) land back with tokens in the hash */
    adoptHashSession() {
      const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
      if (!hash.get('access_token')) return null;
      persist({
        access_token: hash.get('access_token'),
        refresh_token: hash.get('refresh_token'),
        expires_at: Math.floor(Date.now() / 1000)
          + Number(hash.get('expires_in') || 3600),
        user: { id: null, email: null, name: '' },
      });
      const type = hash.get('type');
      history.replaceState(null, '', location.pathname + location.search);
      return type;
    },

    async fetchUser() {
      const body = await request('/auth/v1/user');
      session.user = {
        id: body.id, email: body.email,
        name: (body.user_metadata && body.user_metadata.name) || '',
      };
      persist(session);
    },

    /* blocked / admin live in profiles, refreshed on every sign-in and boot */
    async fetchProfile() {
      const rows = await request('/rest/v1/profiles'
        + `?id=eq.${encodeURIComponent(session.user.id)}&select=blocked,is_admin`);
      const profile = rows[0] || { blocked: false, is_admin: false };
      session.user.blocked = profile.blocked;
      session.user.is_admin = profile.is_admin;
      persist(session);
      return profile;
    },

    /* ---- cloud saves (PostgREST + RLS) ---- */
    async listShots() {
      await ensureFresh();
      return request('/rest/v1/saved_shots'
        + '?select=id,name,updated_at&order=updated_at.desc');
    },
    async getShot(id) {
      await ensureFresh();
      const rows = await request(
        `/rest/v1/saved_shots?id=eq.${encodeURIComponent(id)}&select=spec`);
      return rows[0] && rows[0].spec;
    },
    async saveShot(name, spec) {
      await ensureFresh();
      const headers = {
        apikey: config.anon_key,
        Authorization: `Bearer ${session.access_token}`,
        'Content-Type': 'application/json',
        Prefer: 'resolution=merge-duplicates',
      };
      const resp = await fetch(
        `${base}/rest/v1/saved_shots?on_conflict=user_id,name`, {
          method: 'POST', headers,
          body: JSON.stringify({ name, spec,
            updated_at: new Date().toISOString() }),
        });
      if (!resp.ok) throw { status: resp.status };
    },
    async deleteShot(id) {
      await ensureFresh();
      return request(`/rest/v1/saved_shots?id=eq.${encodeURIComponent(id)}`,
        { method: 'DELETE' });
    },

    /* ---- backoffice (every call is gated again by RLS in the db) ---- */
    async listProfiles() {
      await ensureFresh();
      return request('/rest/v1/profiles'
        + '?select=id,email,name,blocked,is_admin,created_at'
        + '&order=created_at.desc');
    },
    async setBlocked(id, blocked) {
      await ensureFresh();
      return request(`/rest/v1/profiles?id=eq.${encodeURIComponent(id)}`,
        { method: 'PATCH', body: { blocked } });
    },
    async wipeShots(userId) {
      await ensureFresh();
      return request(
        `/rest/v1/saved_shots?user_id=eq.${encodeURIComponent(userId)}`,
        { method: 'DELETE' });
    },
    async shotOwners() {
      await ensureFresh();
      return request('/rest/v1/saved_shots?select=user_id');
    },

    /* ---- the prompt bank ---- */
    async listBank() {
      await ensureFresh();
      return request('/rest/v1/prompt_bank'
        + '?select=*&order=position.asc,created_at.desc');
    },
    async addBank(row) {
      await ensureFresh();
      return request('/rest/v1/prompt_bank', { method: 'POST', body: row });
    },
    async updateBank(id, patch) {
      await ensureFresh();
      return request(`/rest/v1/prompt_bank?id=eq.${encodeURIComponent(id)}`,
        { method: 'PATCH', body: patch });
    },
    async deleteBank(id) {
      await ensureFresh();
      return request(`/rest/v1/prompt_bank?id=eq.${encodeURIComponent(id)}`,
        { method: 'DELETE' });
    },

    /* ---- example images (public-read bucket, admin-write by policy) ---- */
    imageUrl(path) {
      return path
        ? `${base}/storage/v1/object/public/prompt-images/${path}` : '';
    },
    async uploadImage(file) {
      await ensureFresh();
      const ext = (file.name.split('.').pop() || 'jpg').toLowerCase()
        .replace(/[^a-z0-9]/g, '') || 'jpg';
      const path = `${crypto.randomUUID()}.${ext}`;
      const resp = await fetch(
        `${base}/storage/v1/object/prompt-images/${path}`, {
          method: 'POST',
          headers: {
            apikey: config.anon_key,
            Authorization: `Bearer ${session.access_token}`,
            'Content-Type': file.type || 'application/octet-stream',
          },
          body: file,
        });
      if (!resp.ok) throw { status: resp.status };
      return path;
    },
    async deleteImage(path) {
      await ensureFresh();
      return request(`/storage/v1/object/prompt-images/${path}`,
        { method: 'DELETE' });
    },
  };
}

/* ---------------------------------------------------------------- UI ---- */

function initAuth(container, lib, hooks = {}) {
  const config = lib.auth_config || {};
  const enabled = Boolean(config.url && config.anon_key);

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  if (!enabled) return { enabled: false, get session() { return null; } };

  const api = createSupabase(config);

  /* ---- the gate: login / signup / recovery ---- */
  let mode = 'login'; /* login | signup | recover | set_password */
  let notice = null;  /* {text, kind: 'error'|'ok'} */

  const card = el('section', 'panel auth-card');
  container.append(card);

  function fieldRow(labelText, type, autocomplete) {
    const wrap = el('label', 'auth-field');
    wrap.append(el('span', 'auth-field-label', labelText));
    const input = el('input', 'free-text');
    input.type = type;
    input.autocomplete = autocomplete;
    input.dir = 'ltr';
    wrap.append(input);
    return { wrap, input };
  }

  function render() {
    card.innerHTML = '';
    const header = el('div', 'panel-header');
    header.append(el('span', 'panel-title', 'מכונת הפרומפטים'));
    header.append(el('span', 'chip-meta', 'כניסת תלמידים'));
    card.append(header);

    if (mode !== 'set_password') {
      const tabs = el('div', 'tabs auth-tabs');
      for (const [key, label] of [['login', 'התחברות'], ['signup', 'הרשמה']]) {
        const tab = el('button', 'tab '
          + (mode === key ? 'active' : 'inactive'), label);
        tab.addEventListener('click', () => { mode = key; notice = null; render(); });
        tabs.append(tab);
      }
      card.append(tabs);
    } else {
      card.append(el('p', 'section-hint', 'בחרו סיסמה חדשה לחשבון.'));
    }

    const form = el('form', 'auth-form');
    card.append(form);

    const name = fieldRow('שם מלא', 'text', 'name');
    name.input.dir = 'rtl';
    const email = fieldRow('אימייל', 'email', 'email');
    const password = fieldRow('סיסמה (8 תווים לפחות)', 'password',
      mode === 'login' ? 'current-password' : 'new-password');

    if (mode === 'signup') form.append(name.wrap);
    if (mode !== 'set_password') form.append(email.wrap);
    if (mode !== 'recover') form.append(password.wrap);

    const noticeBox = el('p', 'auth-notice');
    if (notice) {
      noticeBox.textContent = notice.text;
      noticeBox.classList.add(notice.kind);
    }
    form.append(noticeBox);

    if (notice && notice.resend) {
      const resend = el('button', 'gate-link auth-alt',
        'שליחה חוזרת של אימייל האישור');
      resend.type = 'button';
      resend.addEventListener('click', async () => {
        resend.disabled = true;
        try {
          await api.resendConfirmation(notice.resend);
          notice = { kind: 'ok', text: 'אימייל אישור חדש בדרך אליכם.' };
        } catch {
          notice = { kind: 'error', text: 'השליחה נכשלה. נסו שוב בעוד דקה.' };
        }
        render();
      });
      form.append(resend);
    }

    const submit = el('button', 'btn-run auth-submit', {
      login: 'כניסה', signup: 'יצירת חשבון',
      recover: 'שליחת קישור איפוס', set_password: 'שמירת הסיסמה',
    }[mode]);
    submit.type = 'submit';
    form.append(submit);

    if (mode === 'login') {
      const forgot = el('button', 'gate-link auth-alt', 'שכחתי סיסמה');
      forgot.type = 'button';
      forgot.addEventListener('click', () => { mode = 'recover'; notice = null; render(); });
      form.append(forgot);
    }
    if (mode === 'recover') {
      const back = el('button', 'gate-link auth-alt', 'חזרה להתחברות');
      back.type = 'button';
      back.addEventListener('click', () => { mode = 'login'; notice = null; render(); });
      form.append(back);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      submit.disabled = true;
      notice = null;
      try {
        if (mode === 'login') {
          await api.login(email.input.value.trim(), password.input.value);
          finishLogin();
          return;
        }
        if (mode === 'signup') {
          if (password.input.value.length < 8) {
            throw { local: 'סיסמה של 8 תווים לפחות' };
          }
          const result = await api.signup(email.input.value.trim(),
            password.input.value, name.input.value.trim());
          if (result === 'session') { finishLogin(); return; }
          notice = { kind: 'ok',
            text: 'נשלח אליכם אימייל אישור. פתחו את הקישור שבו וחזרו לכאן.' };
        }
        if (mode === 'recover') {
          await api.recover(email.input.value.trim());
          notice = { kind: 'ok',
            text: 'אם האימייל רשום אצלנו, קישור איפוס בדרך אליו.' };
        }
        if (mode === 'set_password') {
          if (password.input.value.length < 8) {
            throw { local: 'סיסמה של 8 תווים לפחות' };
          }
          await api.setPassword(password.input.value);
          finishLogin();
          return;
        }
      } catch (err) {
        /* uniform wording: never reveal which field failed or what exists.
           the one exception: a correct password on an unconfirmed email —
           telling that user to open their inbox leaks nothing. */
        const code = err.data && (err.data.error_code || err.data.code);
        if (code === 'email_not_confirmed') {
          notice = { kind: 'error', resend: email.input.value.trim(),
            text: 'האימייל עוד לא אושר. פתחו את קישור האישור שנשלח אליכם '
              + '(בדקו גם בספאם).' };
        } else {
          notice = { kind: 'error', text: err.local ? err.local
            : err.network ? 'אין חיבור לרשת. נסו שוב.'
            : mode === 'login' ? 'אימייל או סיסמה שגויים'
            : 'הפעולה נכשלה. בדקו את הפרטים ונסו שוב.' };
        }
      }
      render();
    });
  }

  /* ---- topbar chip: who is signed in, their saved work, logout ---- */
  const chipHost = document.querySelector('[data-auth-chip]');

  function renderChip() {
    if (!chipHost) return;
    chipHost.innerHTML = '';
    if (!api.session) return;
    const chip = el('button', 'btn-ghost auth-chip',
      api.session.user.name || api.session.user.email || 'החשבון שלי');
    chip.addEventListener('click', openWorkPanel);
    chipHost.append(chip);
  }

  /* ---- the saved-work panel, opened from the chip ---- */
  let overlay = null;
  const closePanel = () => { if (overlay) { overlay.remove(); overlay = null; } };

  async function openWorkPanel() {
    closePanel();
    overlay = el('div', 'auth-overlay');
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closePanel();
    });
    const panel = el('section', 'panel auth-work-panel');
    overlay.append(panel);
    document.body.append(overlay);

    const header = el('div', 'panel-header');
    header.append(el('span', 'panel-title', 'העבודות שלי'));
    const who = el('span', 'chip-meta', api.session.user.email || '');
    header.append(who);
    panel.append(header);

    const list = el('div', 'auth-work-list');
    panel.append(list);
    list.append(el('p', 'section-hint', 'טוען…'));

    const footer = el('div', 'button-row');
    const logout = el('button', 'btn-ghost', 'התנתקות');
    logout.addEventListener('click', async () => {
      await api.logout();
      closePanel();
      renderChip();
      mode = 'login'; notice = null;
      render(); /* a fresh, enabled login form for the next person */
      if (hooks.onSignedOut) hooks.onSignedOut();
    });
    const close = el('button', 'btn-ghost', 'סגירה');
    close.addEventListener('click', closePanel);
    footer.append(logout, close);
    panel.append(footer);

    let rows;
    try {
      rows = await api.listShots();
    } catch {
      list.innerHTML = '';
      list.append(el('p', 'rule-note', 'לא הצלחנו לטעון את הרשימה. נסו שוב.'));
      return;
    }
    list.innerHTML = '';
    if (!rows.length) {
      list.append(el('p', 'section-hint',
        'עוד אין עבודות שמורות. בטופס המקצועי: "שמירה בענן".'));
    }
    for (const row of rows) {
      const item = el('div', 'auth-work-row');
      const meta = el('div', 'auth-work-meta');
      meta.append(el('span', 'auth-work-name', row.name));
      meta.append(el('span', 'chip-meta',
        new Date(row.updated_at).toLocaleDateString('he-IL')));
      item.append(meta);
      const actions = el('div', 'auth-work-actions');
      const load = el('button', 'btn-ghost', 'טעינה');
      load.addEventListener('click', async () => {
        try {
          const spec = await api.getShot(row.id);
          closePanel();
          if (spec && hooks.onLoadSpec) hooks.onLoadSpec(spec);
        } catch { load.textContent = 'שגיאה'; }
      });
      const del = el('button', 'btn-ghost auth-danger', 'מחיקה');
      del.addEventListener('click', async () => {
        if (del.dataset.arm !== '1') {
          del.dataset.arm = '1'; del.textContent = 'לאשר מחיקה?'; return;
        }
        try { await api.deleteShot(row.id); item.remove(); } catch { /* keep */ }
      });
      actions.append(load, del);
      item.append(actions);
      list.append(item);
    }
  }

  /* ---- save dialog, called from the pro form's button ---- */
  function saveCurrent(getSpec) {
    if (!api.session) { if (hooks.onNeedAuth) hooks.onNeedAuth(); return; }
    closePanel();
    overlay = el('div', 'auth-overlay');
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closePanel();
    });
    const panel = el('section', 'panel auth-work-panel');
    overlay.append(panel);
    document.body.append(overlay);

    const header = el('div', 'panel-header');
    header.append(el('span', 'panel-title', 'שמירה בענן'));
    panel.append(header);
    panel.append(el('p', 'section-hint',
      'שם קיים נדרס, כך שומרים גרסה מעודכנת של אותה עבודה.'));

    const input = el('input', 'free-text');
    input.maxLength = 80;
    const spec = getSpec();
    input.value = (spec && spec.id) || '';
    input.placeholder = 'שם העבודה';
    panel.append(input);

    const noticeBox = el('p', 'auth-notice');
    panel.append(noticeBox);

    const footer = el('div', 'button-row');
    const save = el('button', 'btn-run', 'שמירה');
    save.addEventListener('click', async () => {
      const name = input.value.trim();
      if (!name) { noticeBox.textContent = 'צריך שם'; noticeBox.className = 'auth-notice error'; return; }
      save.disabled = true;
      try {
        await api.saveShot(name, getSpec());
        noticeBox.textContent = 'נשמר ✓';
        noticeBox.className = 'auth-notice ok';
        setTimeout(closePanel, 700);
      } catch {
        save.disabled = false;
        noticeBox.textContent = 'השמירה נכשלה. נסו שוב.';
        noticeBox.className = 'auth-notice error';
      }
    });
    const cancel = el('button', 'btn-ghost', 'ביטול');
    cancel.addEventListener('click', closePanel);
    footer.append(save, cancel);
    panel.append(footer);
    input.focus();
  }

  async function admitOrEject() {
    try { await api.fetchProfile(); } catch { /* keep last known flags */ }
    if (api.session && api.session.user.blocked) {
      await api.logout();
      renderChip();
      mode = 'login';
      notice = { kind: 'error', text: 'החשבון הזה נחסם על ידי המרצה.' };
      render();
      if (hooks.onSignedOut) hooks.onSignedOut();
      return false;
    }
    return true;
  }

  function finishLogin() {
    mode = 'login'; notice = null;
    render();
    (async () => {
      try { await api.fetchUser(); } catch { /* metadata only */ }
      if (!(await admitOrEject())) return;
      renderChip();
      if (hooks.onSignedIn) hooks.onSignedIn();
    })();
  }

  /* ---- boot: email links first, then any stored session ---- */
  const hashType = api.adoptHashSession();
  if (hashType === 'recovery') {
    mode = 'set_password';
  } else if (api.session) {
    api.ensureFresh().then(async () => {
      if (api.session && await admitOrEject()) {
        renderChip();
        if (hooks.onSignedIn) hooks.onSignedIn();
      } else if (!api.session && hooks.onSignedOut) hooks.onSignedOut();
    });
  }
  if (hashType === 'signup' || hashType === 'magiclink') finishLogin();

  render();

  return {
    enabled: true,
    get session() { return api.session; },
    get isAdmin() {
      return Boolean(api.session && api.session.user.is_admin);
    },
    backend: api,
    saveCurrent,
    openWorkPanel,
  };
}

const AUTH = { initAuth, createSupabase };
if (typeof module !== 'undefined') module.exports = AUTH;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, AUTH);
}

/* Prompt Machine, "בנק פרומפטים לשימוש": ready prompts the teacher curates
   in the backoffice, each optionally carrying an example image. Students
   read; only the admin writes — enforced by RLS, not by this file. */
'use strict';

function initBank(container, lib, authApi) {
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const panel = el('section', 'panel');
  container.append(panel);

  const header = el('div', 'panel-header');
  header.append(el('span', 'panel-title', 'בנק פרומפטים לשימוש'));
  const countChip = el('span', 'chip-meta', '');
  header.append(countChip);
  panel.append(header);

  panel.append(el('p', 'section-hint',
    'פרומפטים מוכנים מהמרצה, להעתקה ולשימוש כמו שהם, או כנקודת פתיחה. '
    + 'כשמצורפת תמונת דוגמה, היא נוצרה מהפרומפט שלצידה.'));

  const list = el('div', 'bank-list');
  panel.append(list);

  async function refresh() {
    list.innerHTML = '';
    list.append(el('p', 'section-hint', 'טוען…'));
    let rows;
    try {
      rows = await authApi.backend.listBank();
    } catch {
      list.innerHTML = '';
      list.append(el('p', 'rule-note', 'לא הצלחנו לטעון את הבנק. נסו לרענן.'));
      return;
    }
    list.innerHTML = '';
    countChip.textContent = `${rows.length} פרומפטים`;
    if (!rows.length) {
      list.append(el('p', 'section-hint', 'הבנק עדיין ריק.'));
      return;
    }
    for (const row of rows) {
      const card = el('article', 'bank-card');
      const body = el('div', 'bank-card-body');
      body.append(el('h3', 'bank-card-title', row.title));
      if (row.notes) body.append(el('p', 'bank-card-notes', row.notes));

      const copyButton = (text, label) => {
        const btn = el('button', 'btn-run bank-copy', label);
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(text);
          } catch {
            const area = document.createElement('textarea');
            area.value = text;
            document.body.append(area);
            area.select();
            document.execCommand('copy');
            area.remove();
          }
          btn.textContent = 'הועתק ✓';
          setTimeout(() => { btn.textContent = label; }, 1400);
        });
        return btn;
      };

      /* a body may carry several model variants, one per [Label] section;
         a plain body renders as a single prompt with a single copy button */
      const sections = row.body.split(/^\[([^\]\n]{1,40})\]\s*$/m);
      if (sections.length > 1 && !sections[0].trim()) {
        for (let i = 1; i < sections.length; i += 2) {
          const label = sections[i].trim();
          const text = (sections[i + 1] || '').trim();
          if (!text) continue;
          const head = el('div', 'bank-variant-head');
          head.append(el('span', 'chip-meta', label));
          head.append(copyButton(text, 'העתקה'));
          body.append(head);
          const promptBox = el('pre', 'prompt-box mono bank-card-prompt');
          promptBox.textContent = text;
          body.append(promptBox);
        }
      } else {
        const promptBox = el('pre', 'prompt-box mono bank-card-prompt');
        promptBox.textContent = row.body;
        body.append(promptBox);
        body.append(copyButton(row.body, 'העתקת הפרומפט'));
      }
      card.append(body);

      if (row.image_path) {
        const figure = el('div', 'bank-card-figure');
        const img = el('img', 'bank-card-image');
        img.loading = 'lazy';
        img.alt = row.title;
        img.src = authApi.backend.imageUrl(row.image_path);
        figure.append(img);
        card.append(figure);
      }
      list.append(card);
    }
  }

  return { refresh };
}

const BANK = { initBank };
if (typeof module !== 'undefined') module.exports = BANK;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, BANK);
}

/* Prompt Machine — the backoffice. Two tabs: students (block / unblock /
   wipe their cloud work) and the prompt bank (add / edit / remove prompts,
   each with an optional example image).

   This view renders only for an admin session, but that is convenience, not
   security: every request it makes is judged again by RLS in the database,
   where is_admin() is the only voice that counts. */
'use strict';

function initAdmin(container, lib, authApi) {
  const backend = authApi.backend;

  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  const panel = el('section', 'panel');
  container.append(panel);

  const header = el('div', 'panel-header');
  header.append(el('span', 'panel-title', 'ניהול'));
  header.append(el('span', 'chip-meta', 'בק-אופיס למרצה'));
  panel.append(header);

  const tabs = el('div', 'tabs admin-tabs');
  panel.append(tabs);
  const panes = {};
  let activeTab = 'users';
  for (const [key, label] of [['users', 'תלמידים'], ['bank', 'בנק הפרומפטים']]) {
    const tab = el('button', 'tab', label);
    tab.dataset.tab = key;
    tab.addEventListener('click', () => { activeTab = key; showTab(); });
    tabs.append(tab);
    panes[key] = el('div', 'admin-pane');
    panes[key].hidden = true;
    panel.append(panes[key]);
  }
  function showTab() {
    for (const tab of tabs.children) {
      tab.className = 'tab '
        + (tab.dataset.tab === activeTab ? 'active' : 'inactive');
    }
    for (const [key, pane] of Object.entries(panes)) {
      pane.hidden = key !== activeTab;
    }
  }

  /* two-click confirm: the first click arms, the second acts */
  function armed(button, label, action) {
    button.addEventListener('click', async () => {
      if (button.dataset.arm !== '1') {
        button.dataset.arm = '1';
        button.textContent = `לאשר ${label}?`;
        setTimeout(() => {
          button.dataset.arm = '';
          button.textContent = label;
        }, 2500);
        return;
      }
      button.dataset.arm = '';
      button.disabled = true;
      try { await action(); } finally { button.disabled = false; }
    });
  }

  /* ---------------------------------------------------- students ---- */
  const usersPane = panes.users;
  usersPane.append(el('p', 'section-hint',
    'חסימה מנתקת את התלמיד מיד בכניסה הבאה, חוסמת את הבנק ואת השמירה בענן, '
    + 'והפיכה. "ניקוי עבודות" מוחק לצמיתות את כל מה ששמור לו בענן. '
    + 'מחיקת חשבון סופית עושים בדשבורד Supabase (Authentication → Users).'));
  const usersList = el('div', 'admin-users');
  usersPane.append(usersList);

  async function refreshUsers() {
    usersList.innerHTML = '';
    usersList.append(el('p', 'section-hint', 'טוען…'));
    let profiles, owners;
    try {
      [profiles, owners] = await Promise.all(
        [backend.listProfiles(), backend.shotOwners()]);
    } catch {
      usersList.innerHTML = '';
      usersList.append(el('p', 'rule-note', 'טעינת הרשימה נכשלה. נסו לרענן.'));
      return;
    }
    const workCount = {};
    for (const { user_id } of owners) {
      workCount[user_id] = (workCount[user_id] || 0) + 1;
    }
    usersList.innerHTML = '';
    for (const profile of profiles) {
      const row = el('div', 'auth-work-row admin-user-row'
        + (profile.blocked ? ' blocked' : ''));
      const meta = el('div', 'auth-work-meta');
      const nameLine = el('span', 'auth-work-name',
        profile.name || profile.email);
      if (profile.is_admin) {
        nameLine.append(el('span', 'chip-meta admin-chip', 'אדמין'));
      }
      if (profile.blocked) {
        nameLine.append(el('span', 'chip-meta blocked-chip', 'חסום'));
      }
      meta.append(nameLine);
      meta.append(el('span', 'chip-meta',
        `${profile.email} · הצטרפות ${new Date(profile.created_at)
          .toLocaleDateString('he-IL')} · ${workCount[profile.id] || 0} עבודות`));
      row.append(meta);

      const actions = el('div', 'auth-work-actions');
      if (!profile.is_admin) {
        const blockBtn = el('button', 'btn-ghost'
          + (profile.blocked ? '' : ' auth-danger'),
          profile.blocked ? 'שחרור חסימה' : 'חסימה');
        blockBtn.addEventListener('click', async () => {
          blockBtn.disabled = true;
          try {
            await backend.setBlocked(profile.id, !profile.blocked);
            refreshUsers();
          } catch { blockBtn.disabled = false; }
        });
        actions.append(blockBtn);
      }
      const wipeBtn = el('button', 'btn-ghost auth-danger', 'ניקוי עבודות');
      armed(wipeBtn, 'ניקוי עבודות', async () => {
        await backend.wipeShots(profile.id);
        refreshUsers();
      });
      actions.append(wipeBtn);
      row.append(actions);
      usersList.append(row);
    }
  }

  /* ------------------------------------------------- prompt bank ---- */
  const bankPane = panes.bank;
  bankPane.append(el('p', 'section-hint',
    'מה שנשמר כאן מופיע מיד אצל כל התלמידים ב"בנק פרומפטים לשימוש". '
    + 'תמונת הדוגמה איננה חובה, אבל שווה: התלמיד רואה מה הפרומפט מייצר.'));

  const form = el('div', 'admin-bank-form');
  bankPane.append(form);

  const titleInput = el('input', 'free-text');
  titleInput.placeholder = 'כותרת (למשל: פורטרט חלון, ריאליזם מלא)';
  titleInput.maxLength = 120;

  const notesInput = el('input', 'free-text');
  notesInput.placeholder = 'הערה לתלמידים (רשות, בעברית)';

  const bodyInput = el('textarea', 'free-text mono admin-bank-body');
  bodyInput.placeholder = 'the prompt itself, in English';
  bodyInput.dir = 'ltr';
  bodyInput.rows = 6;

  const imageRow = el('div', 'admin-image-row');
  const imageInput = el('input');
  imageInput.type = 'file';
  imageInput.accept = 'image/png,image/jpeg,image/webp';
  imageInput.hidden = true;
  const imageBtn = el('button', 'btn-ghost', 'צירוף תמונת דוגמה');
  imageBtn.addEventListener('click', () => imageInput.click());
  const imagePreview = el('img', 'admin-image-preview');
  imagePreview.hidden = true;
  const imageClear = el('button', 'btn-ghost auth-danger', 'הסרת התמונה');
  imageClear.hidden = true;
  imageRow.append(imageInput, imageBtn, imagePreview, imageClear);

  let pendingFile = null;   /* a newly chosen file, not yet uploaded */
  let keepImagePath = '';   /* existing image kept while editing */
  let editingId = null;

  imageInput.addEventListener('change', () => {
    const file = imageInput.files[0];
    if (!file) return;
    if (file.size > 4 * 1024 * 1024) {
      note('התמונה גדולה מ-4MB. הקטינו אותה ונסו שוב.', 'error');
      imageInput.value = '';
      return;
    }
    pendingFile = file;
    keepImagePath = '';
    imagePreview.src = URL.createObjectURL(file);
    imagePreview.hidden = false;
    imageClear.hidden = false;
  });
  imageClear.addEventListener('click', () => {
    pendingFile = null;
    keepImagePath = '';
    imageInput.value = '';
    imagePreview.hidden = true;
    imageClear.hidden = true;
  });

  const noticeBox = el('p', 'auth-notice');
  const note = (text, kind) => {
    noticeBox.textContent = text;
    noticeBox.className = `auth-notice ${kind}`;
  };

  const formButtons = el('div', 'button-row');
  const saveBtn = el('button', 'btn-run', 'הוספה לבנק');
  const cancelEdit = el('button', 'btn-ghost', 'ביטול עריכה');
  cancelEdit.hidden = true;
  formButtons.append(saveBtn, cancelEdit);

  form.append(titleInput, notesInput, bodyInput, imageRow, noticeBox, formButtons);

  const bankList = el('div', 'admin-users');
  bankPane.append(bankList);

  function resetForm() {
    editingId = null;
    titleInput.value = '';
    notesInput.value = '';
    bodyInput.value = '';
    pendingFile = null;
    keepImagePath = '';
    imageInput.value = '';
    imagePreview.hidden = true;
    imageClear.hidden = true;
    saveBtn.textContent = 'הוספה לבנק';
    cancelEdit.hidden = true;
    noticeBox.textContent = '';
  }
  cancelEdit.addEventListener('click', resetForm);

  saveBtn.addEventListener('click', async () => {
    const title = titleInput.value.trim();
    const body = bodyInput.value.trim();
    if (!title || !body) { note('צריך גם כותרת וגם פרומפט', 'error'); return; }
    saveBtn.disabled = true;
    note('שומר…', 'ok');
    try {
      let imagePath = keepImagePath;
      if (pendingFile) imagePath = await backend.uploadImage(pendingFile);
      const row = { title, body, notes: notesInput.value.trim(),
                    image_path: imagePath };
      if (editingId) await backend.updateBank(editingId, row);
      else await backend.addBank(row);
      resetForm();
      note('נשמר ✓', 'ok');
      refreshBank();
    } catch {
      note('השמירה נכשלה. נסו שוב.', 'error');
    }
    saveBtn.disabled = false;
  });

  async function refreshBank() {
    bankList.innerHTML = '';
    bankList.append(el('p', 'section-hint', 'טוען…'));
    let rows;
    try {
      rows = await backend.listBank();
    } catch {
      bankList.innerHTML = '';
      bankList.append(el('p', 'rule-note', 'טעינת הבנק נכשלה. נסו לרענן.'));
      return;
    }
    bankList.innerHTML = '';
    if (!rows.length) {
      bankList.append(el('p', 'section-hint', 'הבנק ריק. הפרומפט הראשון שלך למעלה.'));
    }
    for (const row of rows) {
      const item = el('div', 'auth-work-row');
      const meta = el('div', 'auth-work-meta');
      meta.append(el('span', 'auth-work-name', row.title));
      meta.append(el('span', 'chip-meta',
        `${row.body.length.toLocaleString('en')} תווים`
        + (row.image_path ? ' · עם תמונה' : '')));
      item.append(meta);
      const actions = el('div', 'auth-work-actions');
      const editBtn = el('button', 'btn-ghost', 'עריכה');
      editBtn.addEventListener('click', () => {
        editingId = row.id;
        titleInput.value = row.title;
        notesInput.value = row.notes || '';
        bodyInput.value = row.body;
        pendingFile = null;
        keepImagePath = row.image_path || '';
        imagePreview.hidden = !row.image_path;
        imageClear.hidden = !row.image_path;
        if (row.image_path) imagePreview.src = backend.imageUrl(row.image_path);
        saveBtn.textContent = 'עדכון';
        cancelEdit.hidden = false;
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
      const delBtn = el('button', 'btn-ghost auth-danger', 'מחיקה');
      armed(delBtn, 'מחיקה', async () => {
        await backend.deleteBank(row.id);
        if (row.image_path) {
          backend.deleteImage(row.image_path).catch(() => {});
        }
        if (editingId === row.id) resetForm();
        refreshBank();
      });
      actions.append(editBtn, delBtn);
      item.append(actions);
      bankList.append(item);
    }
  }

  showTab();
  return {
    refresh() { refreshUsers(); refreshBank(); },
  };
}

const ADMIN = { initAdmin };
if (typeof module !== 'undefined') module.exports = ADMIN;
if (typeof globalThis !== 'undefined') {
  globalThis.PM = Object.assign(globalThis.PM || {}, ADMIN);
}

/* Prompt Machine — app shell: routing between views, and the login gate.
   The gate only exists when auth_config carries a Supabase project; without
   one the app behaves exactly as before (local builds, tests, file://).
   The admin view renders only for an admin session — as convenience; every
   admin action is judged again by RLS in the database. */
'use strict';

const LIB = JSON.parse(document.getElementById('lib-data').textContent || '{}');

const VIEWS = ['gate', 'quick', 'pro', 'identity', 'examples', 'explain',
               'auth', 'bank', 'admin'];

let authApi = { enabled: false, session: null, isAdmin: false };
let bankApi = null;
let adminApi = null;
const signedOut = () => authApi.enabled && !authApi.session;

function setMode(name) {
  if (!VIEWS.includes(name)) name = 'gate';
  if (signedOut()) name = 'auth'; /* the gate is a wall only while signed out */
  if (name === 'admin' && !authApi.isAdmin) name = 'gate';
  for (const view of document.querySelectorAll('[data-view]')) {
    view.hidden = view.dataset.view !== name;
  }
  const modeSwitch = document.querySelector('[data-mode-switch]');
  modeSwitch.hidden = name === 'gate' || name === 'auth';
  for (const btn of modeSwitch.querySelectorAll('[data-goto]')) {
    btn.classList.toggle('active', btn.dataset.goto === name);
  }
  if (name === 'bank' && bankApi) bankApi.refresh();
  if (name === 'admin' && adminApi) adminApi.refresh();
}

function syncRoleButtons() {
  for (const btn of document.querySelectorAll('[data-bank-btn]')) {
    btn.hidden = !authApi.enabled;
  }
  for (const btn of document.querySelectorAll('[data-admin-btn]')) {
    btn.hidden = !authApi.isAdmin;
  }
}

document.addEventListener('click', (event) => {
  const target = event.target.closest('[data-goto]');
  if (target) setMode(target.dataset.goto);
});

if (Object.keys(LIB).length) {
  authApi = globalThis.PM.initAuth(document.getElementById('auth-root'), LIB, {
    onSignedIn() { syncRoleButtons(); setMode('gate'); },
    onSignedOut() { syncRoleButtons(); setMode('auth'); },
    onNeedAuth() { setMode('auth'); },
    onLoadSpec(spec) {
      formApi.load(spec);
      setMode('pro');
    },
  });

  const formApi = globalThis.PM.initForm(document.getElementById('pro-root'), LIB, {
    extraButtons: authApi.enabled
      ? [{ label: 'שמירה בענן',
           onClick: () => authApi.saveCurrent(() => formApi.getSpec()) }]
      : [],
  });
  globalThis.PM.initQuick(document.getElementById('quick-root'), LIB, {
    openInPro(spec) {
      formApi.load(spec);
      setMode('pro');
    },
  });
  globalThis.PM.initIdentity(document.getElementById('identity-root'), LIB, {
    applyToPro(identity, seed) {
      formApi.setIdentity(identity, seed);
      setMode('pro');
    },
  });
  globalThis.PM.initExamples(document.getElementById('examples-root'), LIB, {
    openInPro(spec) {
      formApi.load(spec);
      setMode('pro');
    },
  });
  globalThis.PM.initExplain(document.getElementById('explain-root'), LIB);

  if (authApi.enabled) {
    bankApi = globalThis.PM.initBank(
      document.getElementById('bank-root'), LIB, authApi);
    adminApi = globalThis.PM.initAdmin(
      document.getElementById('admin-root'), LIB, authApi);
  }
}

syncRoleButtons();
setMode(signedOut() ? 'auth' : 'gate');

</script>
</body>
</html>
